# RUKO policy: turns the scorer's output into a tier. Numbers live here, not in code.
version: policy-0.1

family_threshold: 0.5            # a family "lights" at this score
corroboration_min_families: 2    # fewer lit families -> T0, whatever p_scam says

# When a completed payment here (c2-0.6) counts the payee as "known" (so new-payee signals drop).
# Defeats "known-payee poisoning": a tiny recent anchor payment must NOT make a mule look known.
# The bank's own history (base.known_payees) is always trusted; this gates only the in-app shortcut.
known_payee:
  min_age_hours: 48              # the anchor payment must be at least this old
  min_inr: 500                  # ...and at least this large (a sub-cap anchor never qualifies)
  anchor_window_hours: 72       # a small completed payment this recent to the same payee,
  anchor_max_inr: 200           # at or below this amount, is an "anchor" -> a behaviour signal

# Walked from T4 down; the first match wins.
tiers:
  T4: {min_p: 0.90, min_families: 3, requires_intel_hit: true}   # analyst review
  T3: {min_p: 0.75, min_families: 2}                             # pause + trusted contact
  T2: {min_p: 0.50, min_families: 2}                             # explain card, slide to pay
  T1: {min_p: 0.30, min_families: 2}                             # inline tip

# A playbook two analysts approved (blue team: red_team_blue_team/blue_team, `approved_by` in
# data/playbooks/playbooks.yaml) labels the payment as that scam and raises it to at least this tier,
# even when the model scored it low: the model cannot learn a scam it has never seen. Rule 5 holds
# because the playbook's own conditions must come from this many families (api/playbooks.families).
# Amount caps, trusted payees and the alert budget below still apply.
approved_playbooks:
  min_tier: T2                   # explain card, slide to pay: a warning, never a block
  min_condition_families: 2

# Strong corroboration: when at least min_families independent families are each near certain, the
# payment pauses even if the scorer's p_scam is lower (lgbm-0.2's combiner can score a scam with a
# strong lure lower than one without; docs/security-hardening.md). Rule 5 holds with room to spare.
# Amount caps, trusted payees and the alert budget below still apply.
strong_corroboration:
  min_families: 3
  min_family_score: 0.9
  min_tier: T3                   # pause + trusted contact

# A payee two analysts approved as a mule (rule 11) always warrants a pause, even if it is the only
# lit family — it is human-verified, so it cannot be a false registry entry (audit §2.6).
approved_mule_min_tier: T3

amount_caps:
  - {below: 200, max_tier: T1}

trusted_payee:
  # "I know this person" drops to T0 unless one of these holds (coached victims tap it too).
  overridden_by: [intel_hit, stage_ge_S3]

alert_budget:
  max_interruptive_per_30d: 2    # T2+ alerts already shown in the last 30 days
  drop_to: T1
  bypass_if_p_ge: 0.90
  # Never throttle while a journey is under way: someone has control of the screen (S3) or the
  # user is paying a new payee after being contacted (S4/S5). Fatigue control is for calm days.
  never_applies_in_stages: [S3, S4, S5]
  # Never throttle when the payee itself looks risky (payee family lit: mule-like account, ring,
  # registry): fatigue is about the user's nerves, not about who receives the money. Without
  # this, the same payment to the same mule got T2 twice and then T1 for good.
  never_applies_with_families: [P]
  # Never throttle an anchor-then-drain attempt: a small recent payment to this payee is a live scam
  # signal, not user nerves (defeats alert-budget exhaustion, audit §2.6).
  never_applies_with_anchor: true

pause_minutes: {T0: 0, T1: 0, T2: 0, T3: 30, T4: 60}

message_keys:
  T1: t1_tip
  T2: t2_generic
  T3: t3_generic
  T4: t3_generic
  playbook_tiers: [T2, T3, T4]   # these use "<tier>_<playbook>" when a playbook matched

# Coached-session signs (c2-0.5): how features/session.py turns the phone's `context.session`
# numbers into yes/no signs. Behaviour family only -- they never interrupt a payment on their own.
session:
  dictated_min_digits: 4          # fewer digits: too short to judge the rhythm
  dictated_vs_usual: 2.5          # median digit gap >= 2.5x this user's own usual gap
  # No personal baseline yet (new user): need a slow AND broken rhythm, so a slow typist alone
  # is not enough.
  dictated_no_baseline_median_s: 2.0
  dictated_no_baseline_max_s: 4.0
  paste_after_return_s: 20       # pasted the UPI ID within 20 s of coming back to the app
  many_switches: 2                # left the app this many times during one payment
  hesitation_s: 180               # more than 3 minutes on the Pay screen

# Alert feedback (c2-0.8): what users do on alert screens.
feedback:
  per_user_per_day: 30           # more than this from one user in a day is not recorded

# Bot-scale fingerprints (graph/store.py `automation`): AI chatbots and scripts run task scams and
# mule networks at machine scale. An account is "automated" when, in the window, one side of it
# (rewards sent, or payments received) has at least min_users distinct RUKO users, per-user amounts
# within max_amount_spread (std / median) and steady arrivals (gap std / median <= max_gap_spread).
# Payee family only (reason R11); never enough to interrupt on its own.
automation:
  window_days: 7
  min_users: 8
  max_amount_spread: 0.10
  max_gap_spread: 0.35
  burst_min: 1.0                  # new people less than a minute apart on average: a burst, also machine-like

# Crowd signals in the payment graph (graph/store.py `account_signals`). Payee family only (R11/R3).
crowd:
  bait_users: 5                  # distinct users with a bait credit from one account in 7 days
  episode_users: 3               # distinct users' episodes in which one account was a payee
  fanin_6h: 10                   # distinct RUKO users paying one account in 6 hours
  new_user_weight: 0.5           # crowd votes from users first seen in the last 24 h count for less
  # New and spreading: AI crews burn a fresh mule every few victims, before any registry lists it.
  # An account RUKO first saw within new_account_hours that new_account_min_users different users
  # already tried to pay. Not for verified merchants, nor accounts the bank says are older than
  # new_account_max_age_days (unknown age still counts: rule 1).
  new_account_hours: 48
  new_account_min_users: 3
  new_account_max_age_days: 30

# Same scam, many phones (graph/campaigns.py): money handles (UPI ID, link host, call-back number)
# found in scam messages on different phones (c2-0.13 lure_seen handles). A handle that reached
# min_users different users within window_minutes is "spreading"; entries are kept keep_hours.
campaign:
  window_minutes: 60
  min_users: 3
  keep_hours: 24
  # c2-0.15: one unknown number that called this many different RUKO users in the window
  # (AI voice agents dial at machine scale). Feature caller_many_users, context family, R14.
  caller_window_hours: 24
  caller_min_users: 3

# RUKO's own cross-user evidence, applied after any scorer (also the trained model, which has not
# learned these features yet): each feature lifts its family to family_floor and adds its reason.
# The tier is raised to min_tier only when at least corroboration_min_families families are lit,
# so this evidence alone never interrupts (rule 5).
evidence_overlay:
  family_floor: 0.6
  min_tier: T2                   # explain card, slide to pay: a warning, never a block
  features:
    payee_new_and_spreading: {family: P, reason: R3_mule_like_payee}
    # One campaign is one source: features in the same group light at most one family (rule 5).
    payee_in_campaign: {family: P, reason: R13_scam_campaign, group: campaign}
    caller_in_campaign: {family: C, reason: R13_scam_campaign, group: campaign}
    # c2-0.15: both are about the call, so context family only; alone they never interrupt (rule 5).
    caller_many_users: {family: C, reason: R14_caller_many_users}
    otp_on_call: {family: C, reason: R15_otp_on_call}

# Emerging patterns (patterns/emerging.py): scam workflows with no known playbook. Analyst view only,
# never in the payment decision. A group of payments with the same signature in the window is shown
# when it has at least min_payments from at least min_users different people. Near misses: T0
# payments with at least near_miss_families lit families also count.
emerging:
  window_days: 7
  min_payments: 5
  min_users: 3
  near_miss_families: 1
