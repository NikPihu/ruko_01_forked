<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUKO payment graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<style>
  :root { --bg: #0f0d17; --panel: #1b1826; --text: #ece9f5; --muted: #a39fb5; --line: #2e2a3d;
          --victim: #22c55e; --bait: #f59e0b; --payee: #ef4444; --hub: #a855f7; --other: #64748b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0 12px 0 0; }
  input { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 260px; }
  button { background: #7c3aed; color: white; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  main { display: grid; grid-template-columns: 1fr 360px; height: calc(100vh - 62px); }
  #cy { width: 100%; height: 100%; }
  aside { border-left: 1px solid var(--line); padding: 14px; overflow: auto; background: var(--panel); }
  h2 { font-size: 14px; margin: 16px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; margin: 0 10px 6px 0; font-size: 12px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .suspect { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; cursor: pointer; }
  .suspect b { font-size: 13px; word-break: break-all; }
  .band { font-size: 11px; padding: 2px 6px; border-radius: 6px; margin-left: 6px; }
  .high { background: #7f1d1d; } .med { background: #78350f; } .low { background: #334155; }
  .why { font-size: 12px; color: var(--muted); margin-top: 4px; }
  pre { white-space: pre-wrap; font-size: 12px; color: var(--muted); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } #cy { height: 60vh; } }
</style>
</head>
<body>
<header>
  <h1>RUKO payment graph</h1>
  <input id="acc" placeholder="UPI ID, e.g. secure.settlement.desk@okaxis">
  <button id="show">Show account</button>
  <button class="ghost" id="refresh">Run discovery</button>
</header>
<main>
  <div id="cy"></div>
  <aside>
    <div class="legend">
      <span><i class="dot" style="background:var(--victim)"></i>RUKO user (pseudonymised)</span>
      <span><i class="dot" style="background:var(--bait)"></i>bait sender</span>
      <span><i class="dot" style="background:var(--payee)"></i>flagged payee</span>
      <span><i class="dot" style="background:var(--hub)"></i>cash-out hub</span>
    </div>
    <h2>Selected</h2>
    <pre id="detail">Click a node or a suspect.</pre>
    <h2>New mule suspects</h2>
    <div id="suspects">Loading…</div>
  </aside>
</main>
<script>
const cy = cytoscape({
  container: document.getElementById('cy'),
  style: [
    { selector: 'node', style: { 'background-color': 'data(colour)', 'label': 'data(label)', 'color': '#ece9f5',
      'font-size': 9, 'text-valign': 'bottom', 'text-margin-y': 4, 'width': 18, 'height': 18 } },
    { selector: 'node.center', style: { 'border-width': 3, 'border-color': '#ffffff', 'width': 26, 'height': 26 } },
    { selector: 'edge', style: { 'width': 'data(w)', 'line-color': '#4b4660', 'target-arrow-color': '#4b4660',
      'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'label': 'data(label)', 'font-size': 8, 'color': '#a39fb5' } },
    { selector: 'edge.loop', style: { 'line-color': '#ef4444', 'target-arrow-color': '#ef4444' } },
  ],
});
let suspects = [];
const hubs = new Set();

function colour(n) {
  if (n.kind === 'ruko_user') return getComputedStyle(document.body).getPropertyValue('--victim');
  if (hubs.has(n.id)) return '#a855f7';
  if (n.marks.flagged || n.marks.listed) return '#ef4444';
  if (n.marks.role === 'bait_sender') return '#f59e0b';
  return '#64748b';
}

async function show(upi) {
  const r = await fetch(`/v1/graph/account/${encodeURIComponent(upi)}?hops=2`);
  const g = await r.json();
  const loop = (g.signals.loop_path || '').split(/ -> | <- /);
  cy.elements().remove();
  cy.add(g.nodes.map(n => ({ data: { id: n.id, label: n.kind === 'ruko_user' ? 'user' : n.id, colour: colour(n), raw: n },
                             classes: n.id === g.center ? 'center' : '' })));
  cy.add(g.edges.map((e, i) => ({ data: { id: 'e' + i, source: e.from, target: e.to, label: '₹' + Math.round(e.inr).toLocaleString('en-IN'),
                                          w: Math.max(1, Math.log10(e.inr + 1)), raw: e },
                                  classes: loop.includes(e.from) && loop.includes(e.to) ? 'loop' : '' })));
  cy.layout({ name: 'cose', animate: false, padding: 30 }).run();
  document.getElementById('detail').textContent = JSON.stringify(g.signals, null, 2);
}

cy.on('tap', 'node', ev => {
  const n = ev.target.data('raw');
  const s = suspects.find(x => x.upi_id === n.id);
  document.getElementById('detail').textContent = JSON.stringify(s || n, null, 2);
});

async function loadSuspects() {
  const r = await fetch('/v1/graph/suspects');
  const body = await r.json();
  suspects = body.suspects;
  hubs.clear();
  suspects.filter(s => s.is_hub).forEach(s => hubs.add(s.upi_id));
  const box = document.getElementById('suspects');
  box.innerHTML = suspects.length ? '' : 'No suspects yet. Episodes from phones fill the graph.';
  for (const s of suspects) {
    const div = document.createElement('div');
    div.className = 'suspect';
    div.innerHTML = `<b></b><span class="band ${s.band}">${s.band}</span>
      <div class="why"></div><div class="why">approvals: ${s.review.approved_by.length}/${body.approvals_needed}${s.review.approved ? ' (in use)' : ''}</div>`;
    div.querySelector('b').textContent = s.upi_id;
    div.querySelectorAll('.why')[0].textContent = s.why + (s.ring_id ? ` · ${s.ring_id}` : '');
    div.onclick = () => { document.getElementById('acc').value = s.upi_id; show(s.upi_id); };
    box.appendChild(div);
  }
}

document.getElementById('show').onclick = () => show(document.getElementById('acc').value.trim());
document.getElementById('refresh').onclick = loadSuspects;
loadSuspects();
</script>
</body>
</html>
