name: income_tax_scrutiny_cooloff
title: 'Fake Income Tax / CA scrutiny call: advises taxpayer to pay challan QR after checking email 1 hour later'
confidence: guess
emerging: true
sources: [CBDT / Income Tax Department advisories on fake tax demand notices]
weight: 0.06
targets: {salaried: 2.2, shopkeeper: 2.0, senior: 1.4, homemaker: 0.6, gig_worker: 0.6, student: 0.3}
start_hours: [10, 18]
mules: {slots: 8}
mule_kinds: {merchant_disguised: 0.6, rented: 0.3, slow_forward: 0.1}
steps:
- id: ca_scrutiny_call
  stage: S1
  events:
  - type: call
    kind: {sim: 0.75, voip: 0.25}
    direction: incoming
    minutes: [8, 22]
  decide: {pressure: 0.9}
- id: challan_qr_payment
  gap_min: [55, 180]
  ask:
    amount:
      log: [900, 3200]
    entry: {qr: 0.85, contact: 0.15}
    round: 0.3
    pressure: 0.85
    mule: same
