name: hospital_icu_friend_delayed
title: Impersonated family friend calls about hospital billing desk, hangs up, sends pharmacy/clinic QR 45 min later
confidence: guess
emerging: true
sources: [I4C medical emergency impersonation advisories]
weight: 0.07
targets: {salaried: 1.8, shopkeeper: 1.6, senior: 1.5, homemaker: 1.4, gig_worker: 1.0, student: 0.6}
start_hours: [8, 22]
mules: {slots: 8}
mule_kinds: {merchant_disguised: 0.7, rented: 0.2, slow_forward: 0.1}
steps:
- id: distress_call
  stage: S1
  events:
  - type: call
    kind: {voip: 0.6, sim: 0.4}
    direction: incoming
    minutes: [3, 11]
  decide: {pressure: 1.0}
- id: pharmacy_qr_bill
  gap_min: [40, 95]
  ask:
    amount:
      log: [750, 2600]
    entry: {qr: 0.8, contact: 0.2}
    round: 0.2
    pressure: 0.95
    mule: same
- id: diagnostic_scan_topup
  p: 0.6
  gap_min: [90, 300]
  ask:
    amount:
      log: [950, 2900]
    entry: {qr: 0.75, contact: 0.25}
    round: 0.2
    pressure: 0.9
    mule: same
