name: qr_code_relay
title: QR Code Relay Scam (Pass‑Through Payee)
status: review
summary: Victims receive a QR code (often via chat) promising a small payment; they scan and pay under
  ₹1,000 to a newly created payee that quickly forwards the money to another account.
steps:
- Victim receives a QR code via chat claiming a refund or prize.
- Victim scans the QR and sees a payee name.
- Victim pays a small amount (<₹1,000) using the QR.
- The new payee, flagged as in‑run, forwards the money to another account (high pass‑through).
- Victim sees payment confirmed and may be asked for further payments.
signals:
- ENTRY_QR
- AMT_UNDER_1K
- NEW_PAYEE
- PAYEE_IN_RUN
- PAYEE_PASS_THROUGH
reason_codes:
- R3_mule_like_payee
advice_en: Verify QR code source; never pay to a QR you didn’t generate yourself.
advice_hi: QR कोड का स्रोत जांचें; बिना अपने बनाए QR को भुगतान न करें।
ai_powered:
  likely: false
  why: No evidence of AI‑generated voice or deep‑fake content in the data.
confidence: high
open_questions: []
misnamed_as: null
match:
- priority: 100
  rule:
    all:
    - feature: entry_method
      op: eq
      value: qr
    - feature: amount_inr
      op: <
      value: 1000
    - feature: first_time_payee
      op: is
      value: true
    - feature: payee_in_run
      op: is
      value: true
    - feature: payee_pass_through_24h
