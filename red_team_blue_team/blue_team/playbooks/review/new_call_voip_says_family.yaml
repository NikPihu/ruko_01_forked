name: new_call_voip_says_family
title: 'Unnamed pattern from 5 complaints: call voip, says family, caller unknown, call on, says other'
status: review
summary: '5 complaints from 5 users describe payments RUKO did not stop. Most share: call voip, says family,
  caller unknown, call on, says other. Median payment Rs 7,950; 6 payee accounts. Drafted without an LLM:
  an analyst should write the story.'
