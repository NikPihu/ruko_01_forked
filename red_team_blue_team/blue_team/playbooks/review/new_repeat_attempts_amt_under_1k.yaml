analyst:
  verdict: new_scam
  nearest_playbook: null
  rationale: The cluster c17 exhibits a distinct pattern (repeat small QR payments to new payees) that
    is not captured by any known playbook; similarity scores are far below the 0.8 threshold for variant_of_known.
    The proposed matcher would generate an unacceptably high false‑positive rate (195 legit payments per
    1,000), so the draft rule is not ready. A new playbook is needed, but it must be refined with extra
    signals to avoid over‑blocking legitimate QR transactions.
  required_changes:
  - Add additional constraints to limit false positives, e.g., require at least two payments within 72h
    and a preceding suspicious communication (unknown caller, remote control, or lure token).
  - Consider requiring the payee to be newly added (no prior transactions) and the QR code to be received
    via a call or message, to differentiate from legitimate QR payments.
  confidence: medium
  reviewed_by: openai.gpt-oss-120b-1:0
