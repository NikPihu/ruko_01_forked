name: qr_code_chat_scam
title: QR‑code payment request scam via chat
status: review
summary: Victims receive an unsolicited QR‑code in a chat promising a refund, discount or prize. Trusting
  the message, they scan the QR and pay via UPI to a newly created, listed merchant that is already part
  of a fraud run. A second, larger payment often follows within the same day.
steps:
- Victim receives a QR‑code image or link in a chat promising a refund, discount or prize.
- Victim scans the QR‑code and selects “Pay” (entry method QR).
- Payment is sent to a new, listed merchant that is already in the fraud run.
- The merchant may request a second, larger payment shortly after (repeat attempt).
- Victim loses money; the merchant cashes out.
signals:
- ENTRY_QR
- NEW_PAYEE
- PAYEE_IN_RUN
- PAYEE_LISTED
- REPEAT_ATTEMPTS
- AMT_UNDER_1K
- AMT_1K_10K
reason_codes:
- R5_lure_message
advice_en: If you receive an unsolicited QR‑code for a refund or prize, verify the sender and never scan/pay
  without confirming the payee’s identity.
advice_hi: यदि आपको अनजान QR‑कोड मिलें, तो भेजने वाले की पुष्टि करें और बिना जाँच के भुगतान न करें।
ai_powered:
  likely: false
  why: No evidence of AI‑generated voice, deep‑fake video, or chatbot interaction in the data.
confidence: high
