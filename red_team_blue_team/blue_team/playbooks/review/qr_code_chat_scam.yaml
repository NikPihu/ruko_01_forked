  nearest_playbook: null
  rationale: The cluster’s mechanism—unsolicited QR‑code sent in a chat, scanned and paid to a newly listed
    merchant—does not match any known playbook. Similarity scores to existing playbooks are low (0.2–0.32)
    and the matcher shows negligible overlap (0.006). Moreover, case data lack any call‑related tokens,
    distinguishing it from the known refund_qr playbook that relies on a phone call. Therefore this pattern
    represents a novel scam mechanism requiring its own playbook.
