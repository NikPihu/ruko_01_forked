  verdict: new_scam
  nearest_playbook: digital_arrest
  rationale: The evidence shows that the cluster’s behavior (unknown VoIP call, family impersonation,
    typed payment to a new personal UPI ID) does not match the core mechanisms of any known playbook.
    The similarity to digital_arrest is moderate (0.71) but crucial elements—remote control, arrest threat,
    and related tokens—are missing. The matcher’s low overlap with known playbooks and the absence of
    a matching playbook in the catalog confirm this is a distinct scam mechanism. Therefore the draft
    playbook 'family_impersonation_voip' should be approved as a new scam rather than a variant of an
    existing one.
