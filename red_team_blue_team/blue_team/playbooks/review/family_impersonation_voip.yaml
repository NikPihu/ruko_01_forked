name: family_impersonation_voip
title: VoIP family‑impersonation payment scam
status: review
summary: Victims receive unknown VoIP calls where the caller pretends to be a family member or urgent
  contact, dictating a typed payment to a new personal UPI ID without remote‑control tools.
steps:
- Victim receives an unknown VoIP call (e.g., WhatsApp).
- Caller claims to be a family member or urgent contact needing money.
- Caller stays on the line and dictates the amount to be paid.
- Victim types a payment to a new personal UPI ID.
- Payment is completed; sometimes repeated with higher amounts.
signals:
- CALL_ON
- CALL_VOIP
- CALLER_UNKNOWN
- ENTRY_TYPED
- SAYS_FAMILY
- SAYS_OTHER
- NEW_PAYEE
- PAYEE_IN_RUN
- SESSION_DICTATED
- SESSION_HESITATION
reason_codes:
- R1_live_unknown_call
- R6_new_payee_typed
- R7_tranche_pattern
advice_en: Do not type a payment during an unknown call; verify the request through a trusted channel
  first.
advice_hi: अज्ञात कॉल पर भुगतान टाइप न करें; पहले भरोसेमंद माध्यम से अनुरोध की पुष्टि करें।
ai_powered:
  likely: false
  why: No evidence of AI‑generated voice or deep‑fake content in the tokens.
confidence: high
open_questions: []
