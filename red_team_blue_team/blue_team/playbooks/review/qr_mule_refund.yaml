analyst:
  verdict: variant_of_known
  nearest_playbook: refund_qr
  rationale: The primary fraud vector in cluster c15 is an unsolicited QR code promising a refund, which
    is exactly the mechanism captured by the known 'refund_qr' playbook. The additional mule‑account behavior
    (new payees that forward funds) is a sub‑pattern that can be incorporated as an extension to the existing
    playbook rather than defining a brand‑new scam. The matcher shows strong recall and low false positives,
    confirming the relevance of the QR‑refund signal. Since the core mechanism is already covered, the
    draft should be merged into the 'refund_qr' playbook with added guidance on mule‑account detection.
  required_changes:
  - Rename the playbook to align with the existing 'refund_qr' playbook (e.g., 'refund_qr_mule_variant')
    and incorporate the mule‑account details into the existing refund_qr guidance rather than creating
    a separate playbook.
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
