name: qr_mule_refund
title: Unsolicited QR Refund Scam Using Mule Accounts
status: review
summary: Scammers send unsolicited QR codes claiming a refund or government payment; victims scan and
  pay small amounts to new mule accounts that forward money, often repeating payments after short gaps.
steps:
- Scammer contacts victim (call, SMS, or chat) claiming a refund, government payout, or prize.
- Victim receives a QR code and is asked to scan it to claim the money.
- Scanning opens a UPI payment screen prefilled with a new payee (often a merchant mule account).
- Victim pays a small amount (under ₹10,000).
- Scammer urges repeat payments after short gaps, using the same or similar QR codes.
- Mule account forwards received funds to cash‑out channels, completing the fraud.
signals:
- ENTRY_QR
- NEW_PAYEE
- PAYEE_IN_RUN
- PAYEE_PASS_THROUGH
- PAYEE_MULEHUNTER
- PAYEE_LISTED
- SESSION_HESITATION
- SESSION_ABANDONED
- REPEAT_ATTEMPTS
reason_codes:
- R5_lure_message
- R3_mule_like_payee
- R7_tranche_pattern
advice_en: Do not scan or pay QR codes you did not request; verify the source before any payment.
advice_hi: अनुरोधित नहीं किए गए QR कोड को स्कैन या भुगतान न करें; भुगतान से पहले स्रोत की पुष्टि करें।
