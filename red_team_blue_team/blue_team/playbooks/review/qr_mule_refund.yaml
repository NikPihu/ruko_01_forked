    fact: The matcher (ENTRY_QR & NEW_PAYEE & PAYEE_IN_RUN & PAYEE_PASS_THROUGH) achieved 86.7% case recall
      with a low false‑positive rate (0.194 per 1,000 legit payments).
    seen: true
  - source: compare_with_playbook
    fact: The cluster shares the core QR‑code refund mechanism with the known 'refund_qr' playbook, but
      adds mule‑account signals (PAYEE_MULEHUNTER, PAYEE_PASS_THROUGH, REPEAT_ATTEMPTS) not present in
      the original playbook.
    seen: true
  - source: list_playbooks
    fact: No existing playbook other than 'refund_qr' describes unsolicited QR‑code refunds; other playbooks
      focus on remote‑control, KYC APKs, or task‑job patterns.
    seen: true
