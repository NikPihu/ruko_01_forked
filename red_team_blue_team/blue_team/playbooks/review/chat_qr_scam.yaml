name: chat_qr_scam
title: QR code scam via chat without call
status: review
summary: Scammers send a QR code via chat promising a small reward; the victim scans it, enters a tiny
  amount to a new payee, then abandons the session, leaving the payment vulnerable.
steps:
- Scammer sends QR code in chat
- Victim scans QR code
- Victim enters small amount to a new payee
- Session is abandoned before confirmation
- Payment completes unnoticed
signals:
- ENTRY_QR
- AMT_UNDER_1K
- NEW_PAYEE
- PAYEE_IN_RUN
- SESSION_ABANDONED
reason_codes:
- R5_lure_message
advice_en: Do not scan QR codes from unknown messages; verify the sender before paying.
advice_hi: अज्ञात संदेशों से QR कोड स्कैन न करें; भुगतान करने से पहले प्रेषक की पुष्टि करें।
ai_powered:
  likely: false
  why: No evidence of AI-generated voice or deepfake content.
confidence: high
open_questions: []
misnamed_as: null
match:
- priority: 100
  rule:
    all:
    - feature: entry_method
      op: eq
      value: qr
    - feature: amount_inr
      op: <
      value: 1000
    - feature: first_time_payee
      op: is
      value: true
    - feature: payee_in_run
      op: is
      value: true
    - feature: session_abandoned_30m
      op: '>='
      value: 1
