drafted_by: openai.gpt-oss-120b-1:0
analyst:
  verdict: new_scam
  nearest_playbook: refund_qr
  rationale: The cluster’s mechanism (QR code sent in a chat message, victim scans and pays a small amount,
    then the session is abandoned) does not match any known playbook; the nearest playbook (refund_qr)
    requires a phone call, which is absent here. The similarity score is low (0.594) and the backtest
    shows the current matcher would generate too many false positives, indicating a distinct scam pattern
    that needs its own playbook with tighter constraints.
  required_changes:
  - Add a condition to exclude cases with any CALLER_* tokens (e.g., caller_unknown, call_voip) to ensure
    the scam is chat‑only.
  - Add a stricter amount limit (e.g., amount_inr < 500) to reduce false positives while still covering
    the median payment size.
  - Require a lure token indicating the QR was sent via chat/message (e.g., LURE_CHAT or MESSAGE_QR) to
    differentiate from the refund_qr playbook that involves a phone call.
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
  evidence:
  - source: get_candidate
    fact: 'Backtest gate failure: matcher would name 2.00 legit payments per 1,000 (max allowed 0.5).'
    seen: true
  - source: get_cluster_overview
    fact: Cluster is marked as 'new' with nearest known playbook refund_qr similarity 0.594 (well below
      the 0.8 variant threshold).
    seen: true
  - source: compare_with_playbook
    fact: Cluster lacks CALLER_UNKNOWN, CALL_VOIP, and other call‑related tokens that define the refund_qr
      playbook.
    seen: true
  - source: get_cluster_overview
    fact: All 6 cases share ENTRY_QR, AMT_UNDER_1K, NEW_PAYEE, PAYEE_IN_RUN, SESSION_ABANDONED, with no
      call‑related tokens.
    seen: true
  - source: list_playbooks
    fact: No existing playbook describes a QR‑code scam delivered solely via chat without a phone call.
    seen: true
