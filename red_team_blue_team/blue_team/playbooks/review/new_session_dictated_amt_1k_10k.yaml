analyst:
  verdict: new_scam
  nearest_playbook: null
  rationale: 'All complaints share a distinct mechanism: a scammer dictates a payment amount (1k‑10k)
    via chat and supplies a QR code for the victim to scan, without any phone call or remote‑control step.
    Known playbooks that involve SESSION_DICTATED (fake_customer_care, digital_arrest) always include
    an unknown caller or remote control, which this cluster lacks. Low similarity scores to existing playbooks
    further confirm that this pattern is not a variant of any known scam. Therefore a new playbook is
    required to capture this QR‑code, session‑dictated payment scam.'
  required_changes:
  - Add a detailed story describing how the scammer contacts the victim (e.g., via WhatsApp/Telegram chat),
    dictates the amount, and sends a QR code for payment.
  - Include any observed victim statements (payer_says) if available, or note that victims did not report
    a call.
  - Clarify that no remote control or call was involved, distinguishing this from fake_customer_care and
    digital_arrest.
  - Provide guidance on how to detect such QR‑code scams (e.g., verify QR source, avoid scanning unknown
    codes).
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
  evidence:
  - source: get_cluster_overview
    fact: SESSION_DICTATED appears in 62% of the cases (2.14x lift).
