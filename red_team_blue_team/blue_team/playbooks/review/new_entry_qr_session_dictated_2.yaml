summary: '12 complaints from 12 users describe payments RUKO did not stop. Most share: entry qr, session
  dictated, session hesitation, session abandoned, repeat attempts. Median payment Rs 6,600; 14 payee
  accounts. Drafted without an LLM: an analyst should write the story.'
