analyst:
  verdict: variant_of_known
  nearest_playbook: refund_qr
  rationale: 'The cluster’s core mechanism is a QR‑code payment scam, matching the refund_qr playbook’s
    description, but the lure channel differs: victims receive the QR via a dictated session rather than
    a phone call. The similarity score (0.65) and the presence of ENTRY_QR and SESSION_DICTATED tokens,
    combined with the absence of call‑related tokens, show this is a variant of the known refund_qr scam.
    Adjusting the refund_qr matcher to include SESSION_DICTATED (and ENTRY_QR) will capture these cases
    without creating a new playbook.'
  required_changes:
  - Update the refund_qr playbook matcher to also fire when SESSION_DICTATED is true even without an on‑call
    signal (e.g., add OR session_dictated is true).
  - Include ENTRY_QR as a required token for the rule to avoid false positives on other session‑dictated
    cases.
  confidence: medium
  reviewed_by: openai.gpt-oss-120b-1:0
  evidence:
  - source: get_candidate
    fact: signal_similarity_lures_ignored shows refund_qr similarity of 0.65, the highest among known
      playbooks.
    seen: true
  - source: compare_with_playbook
    fact: Cluster lacks CALLER_UNKNOWN, CALL_ON, CALL_VOIP tokens present in refund_qr, but has SESSION_DICTATED
      and ENTRY_QR which are not in the playbook.
    seen: true
  - source: get_cluster_overview
    fact: ENTRY_QR appears in 75% of cases and SESSION_DICTATED in 83%, both far above baseline.
    seen: true
  - source: test_matcher
    fact: Matcher session_dictated captures 83% of the cluster’s cases with low legit false positives
      (0.402 per 1,000).
    seen: true
  - source: get_cluster_overview
    fact: RUKO did not name the cluster (ruko_named_it is null), indicating the existing refund_qr rule
      missed these cases.
    seen: true
