name: contact_card_urgent_payment
title: Contact‑card payment request with dictation
status: review
summary: Scammer sends a contact (vCard) with a UPI ID, claims urgent need, and dictates a ₹1‑10k payment
  via the contact entry; repeats the request to new payees that appear in a run.
steps:
- Scammer shares a contact (vCard) containing a UPI ID via chat.
- Claims urgent personal need and asks victim to pay a specific amount (₹1‑10k).
- Victim opens UPI app, selects the contact entry, and is told the exact amount.
- Scammer dictates the payment amount while the victim follows on the phone.
- Victim confirms and sends payment to a new payee that appears in a run of similar scams.
- If the victim hesitates, the scammer repeats the request.
signals:
- ENTRY_CONTACT
- SESSION_DICTATED
- AMT_1K_10K
- PAYEE_IN_RUN
- NEW_PAYEE
- REPEAT_ATTEMPTS
reason_codes:
- R7_tranche_pattern
- R3_mule_like_payee
- R5_lure_message
advice_en: If you receive a payment request via a contact card, verify the person directly before paying.
advice_hi: यदि आपको संपर्क कार्ड के माध्यम से भुगतान अनुरोध मिले, तो भुगतान करने से पहले व्यक्ति की पहचान
  स्वयं जांचें।
ai_powered:
  likely: false
  why: No evidence of AI‑generated voice or deep‑fake content in the tokens.
confidence: high
open_questions: []
misnamed_as: null
