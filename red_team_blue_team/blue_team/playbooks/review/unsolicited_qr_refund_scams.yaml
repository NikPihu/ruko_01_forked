name: unsolicited_qr_refund_scams
title: Unsolicited QR refund scam
status: review
summary: Scammers send unsolicited QR codes promising refunds; victims scan and pay small amounts (<₹1k)
  to new unverified merchants, retry after failure, often after abandoning the session.
steps:
- Scammer sends a QR code via chat claiming a refund or prize.
- Victim scans QR and initiates a payment under ₹1,000 to a new merchant.
- Payment fails or victim is told to retry; they abandon the session.
- Victim attempts the payment again, often after a pause, leading to repeat attempts.
- Money is transferred to an unverified merchant account.
signals:
- ENTRY_QR
- AMT_UNDER_1K
- NEW_PAYEE
- REPEAT_ATTEMPTS
- SESSION_ABANDONED
- PAYEE_LISTED
reason_codes:
- R5_lure_message
advice_en: Do not scan or pay QR codes you did not request; verify the sender before any payment.
advice_hi: अनधिकृत QR कोड स्कैन न करें; भुगतान करने से पहले प्रेषक की पुष्टि करें।
ai_powered:
  likely: false
  why: No evidence of AI-generated voice or deepfake content in the data.
confidence: high
open_questions: How are victims initially contacted (e.g., WhatsApp, SMS) and what lure language is used?
misnamed_as: null
match:
- priority: 100
  rule:
    all:
    - feature: entry_method
      op: eq
      value: qr
    - feature: amount_inr
      op: <
      value: 1000
    - feature: first_time_payee
      op: is
      value: true
    - feature: attempts_72h
      op: '>='
      value: 2
    - feature: session_abandoned_30m
      op: '>='
      value: 1
    - feature: payee_verified_merchant
      op: is
      value: false
