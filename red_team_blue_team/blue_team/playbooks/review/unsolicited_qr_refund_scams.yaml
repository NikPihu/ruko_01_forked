analyst:
  verdict: new_scam
  nearest_playbook: refund_qr
  rationale: The evidence shows that the cluster's behavior (unsolicited QR codes received via chat, small
    repeated payments to new unverified merchants, and no phone call) does not match any existing playbook,
    including the closest 'refund_qr' which relies on a call. The low similarity score and distinct token
    set confirm a novel mechanism. Therefore the draft should be approved as a new scam, after adding
    details about the lure channel and the lack of a call to make the distinction clear.
  required_changes:
  - Add a section describing the typical lure channel (e.g., unsolicited QR code sent via WhatsApp or
    Telegram chat) since the current card only mentions a QR code but does not specify how victims receive
    it.
  - Clarify that no phone call is involved, distinguishing this scam from the known 'refund_qr' playbook
    which relies on an incoming call.
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
  evidence:
  - source: get_candidate
    fact: The matcher (ENTRY_QR AND AMT_UNDER_1K AND NEW_PAYEE AND REPEAT_ATTEMPTS AND SESSION_ABANDONED
      AND payee_verified_merchant is False) achieves 0.8 case recall and 0.329 legit per 1,000, indicating
      a distinct pattern.
    seen: true
  - source: compare_with_playbook
    fact: Centroid similarity with the known 'refund_qr' playbook is only 0.237 and key tokens differ
      (cluster has REPEAT_ATTEMPTS, AMT_UNDER_1K; playbook expects CALL_ON, CALLER_UNKNOWN).
    seen: true
  - source: get_cluster_overview
    fact: Cluster is marked as 'new', RUKO did not name it, and the nearest known playbook similarity
      is low (0.237).
    seen: true
  - source: get_cluster_overview
    fact: Typical case sequence lacks any CALL_ON or CALLER_UNKNOWN tokens, confirming the absence of
      a phone call.
    seen: true
  - source: get_cluster_overview
    fact: Distinctive tokens include ENTRY_QR, AMT_UNDER_1K, REPEAT_ATTEMPTS, SESSION_ABANDONED, indicating
      a repeat‑attempt QR‑code pattern not covered by existing playbooks.
    seen: true
