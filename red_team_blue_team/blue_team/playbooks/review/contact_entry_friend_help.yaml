name: contact_entry_friend_help
title: Contact‑entry “Help‑a‑Friend” Scam (low‑value, new payee, run‑linked)
status: review
summary: Victims receive a call from an unknown number claiming an urgent personal need and are asked
  to quickly send a small amount (<₹1k) to a contact selected from their address book. The payee is a
  newly created merchant account that belongs to a fraud run.
steps:
- Caller (unknown/VoIP) contacts victim, claims an urgent personal/family need.
- Victim is asked to quickly send money to help.
- Victim opens the contact list and selects the requested contact (ENTRY_CONTACT).
- A small amount (<₹1,000) is transferred to a newly‑created merchant payee (NEW_PAYEE).
- The payee is part of a fraud “run” (PAYEE_IN_RUN).
- Victim may hesitate but proceeds after the caller’s pressure.
signals:
- ENTRY_CONTACT
- AMT_UNDER_1K
- NEW_PAYEE
- PAYEE_IN_RUN
- PAYEE_IN_CONTACTS (false)
- PAYEE_VERIFIED_MERCHANT (false)
- PAYEE_LISTED (false)
reason_codes:
- R5_lure_message
- R6_new_payee_typed
- R7_tranche_pattern
- R8_intel_hit
advice_en: If a caller asks you to pay a contact for an urgent personal request, verify the request independently
  before sending any money.
advice_hi: यदि कोई कॉलर आपसे किसी संपर्क को तत्काल व्यक्तिगत अनुरोध के लिए भुगतान करने को कहे, तो पहले
  स्वयं सत्यापित करें, फिर ही पैसा भेजें।
ai_powered:
  likely: false
  why: All evidence is derived from token/field data; no AI‑generated voice or deep‑fake cues were observed.
confidence: high
open_questions: []
misnamed_as: null
match:
- priority: 100
  rule:
    all:
    - feature: entry_method
      op: eq
      value: contact
    - feature: amount_inr
      op: <
      value: 1000
    - feature: first_time_payee
      op: is
      value: true
    - feature: payee_in_run
      op: is
      value: true
    - not:
        feature: payee_in_contacts
        op: is
        value: true
    - feature: payee_holder_type
      op: eq
      value: merchant
    - feature: payee_verified_merchant
      op: is
      value: false
    - not:
        feature: payee_registry_listed
        op: is
        value: true
