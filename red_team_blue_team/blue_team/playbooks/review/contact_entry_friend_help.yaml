rule_in_words: (entry_method eq contact AND amount_inr < 1000 AND first_time_payee is True AND payee_in_run
  is True AND NOT payee_in_contacts is True AND payee_holder_type eq merchant AND payee_verified_merchant
  is False AND NOT payee_registry_listed is True)
