analyst:
  verdict: new_scam
  nearest_playbook: null
  rationale: The cluster's mechanism—an unsolicited caller urging a small payment to a contact that is
    actually a newly created merchant linked to a fraud run—does not match any existing playbook, as evidenced
    by low similarity scores and the absence of a matching known playbook. However, the current matcher
    is too permissive, risking many false positives. Adding constraints for unknown callers and victim
    hesitation will better target the scam while reducing legitimate matches.
  required_changes:
  - Add a condition that the caller is unknown or a VoIP call (caller_unknown eq true OR voip_call eq
    true) to ensure the scam involves unsolicited contact.
  - Require evidence of victim hesitation or pressure (e.g., SESSION_HESITATION token) to filter out legitimate
    small payments to contacts.
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
  evidence:
  - source: get_candidate
    fact: Matcher would name 2.39 legit payments per 1,000 (exceeds max 0.5), causing false positives.
    seen: true
  - source: get_cluster_overview
    fact: Signal similarity to known playbooks is low (nearest 0.119 to refund_qr), indicating a distinct
      mechanism.
    seen: true
  - source: get_case rep_008152
    fact: 'Tokens: ENTRY_CONTACT, AMT_UNDER_1K, NEW_PAYEE, PAYEE_IN_RUN – matches draft but lacks any
      lure or caller info.'
    seen: true
  - source: get_case rep_009479
    fact: Tokens include SESSION_HESITATION, indicating victim pressure, a key distinguishing factor.
    seen: true
  - source: list_playbooks
    fact: No known playbook describes a scam where an unknown caller asks a victim to send a small amount
      to a contact that is a newly created merchant.
    seen: true
