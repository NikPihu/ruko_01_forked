analyst:
  verdict: new_scam
  nearest_playbook: null
  rationale: The cluster c05 is characterized by a combination of QR code entry and a dictated payment
    session, a pattern not captured by any existing playbook. Similarity scores to known playbooks are
    well below the 0.8 threshold, and direct comparisons show missing key tokens (ENTRY_QR for fake_customer_care,
    SESSION_DICTATED for refund_qr). The matcher correctly captures most cases but the underlying mechanism—scammer
    sending a QR code and then dictating the payment over a call—is novel. Therefore this pattern should
    be recorded as a new scam rather than a variant of an existing one.
  required_changes:
  - Add a concise story describing the scammer's claim (e.g., a fake refund or prize) and how they dictated
    the session after the QR entry.
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
  evidence:
  - source: get_cluster_overview
    fact: ENTRY_QR appears in 75% of the cases and SESSION_DICTATED in 83% of the cases.
    seen: true
  - source: test_matcher
    fact: The matcher (session_dictated is True) names 83% of the cases with only 0.402 legit payments
      per 1,000.
    seen: false
  - source: get_candidate
    fact: Signal similarity to the nearest known playbooks is low (refund_qr 0.65, digital_arrest 0.59,
      others <0.6).
    seen: true
  - source: compare_with_playbook
    fact: Fake_customer_care playbook does not include ENTRY_QR token and rules did not name this cluster
      (0.0).
    seen: true
  - source: compare_with_playbook
    fact: Refund_qr playbook lacks SESSION_DICTATED token and rules did not name this cluster (0.0).
    seen: true
