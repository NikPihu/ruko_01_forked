advice_en: Other people reported payments like this as scams. Stop, check with someone you trust, and
  call 1930 if unsure.
advice_hi: दूसरे लोगों ने ऐसे भुगतानों को धोखा बताया है। रुकें, किसी भरोसेमंद व्यक्ति से पूछें, और शक
  हो तो 1930 पर कॉल करें।
