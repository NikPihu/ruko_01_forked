name: new_entry_qr_session_dictated
title: 'Unnamed pattern from 12 complaints: entry qr, session dictated, session hesitation, session abandoned,
  repeat attempts'
status: review
summary: '12 complaints from 12 users describe payments RUKO did not stop. Most share: entry qr, session
  dictated, session hesitation, session abandoned, repeat attempts. Median payment Rs 6,600; 14 payee
  accounts. Drafted without an LLM: an analyst should write the story.'
steps:
- 'Complaint pattern: entry qr, session dictated, session hesitation, session abandoned, repeat attempts'
- Victim pays a new payee the scammer chose
