name: unsolicited_qr_refund
title: Unsolicited QR code refund scam
status: review
summary: Scammers send unsolicited QR codes promising refunds or prizes; victims scan and pay a small
  amount to a new, listed payee.
steps:
- Scammer sends a QR code via message claiming a refund, cashback, or prize.
- Victim scans the QR code with a UPI app.
- The app shows a payment screen with a small amount (<₹1,000).
- Victim hesitates but proceeds to confirm the payment.
- Payment goes to a newly created, listed personal UPI ID that is part of a larger collection run.
- Victim later discovers the money is lost.
signals:
- ENTRY_QR
- AMT_UNDER_1K
- NEW_PAYEE
- PAYEE_IN_RUN
- SESSION_HESITATION
- PAYEE_LISTED
reason_codes:
- R5_lure_message
advice_en: Do not scan QR codes from unknown messages; verify the sender through a separate channel.
advice_hi: अज्ञात संदेशों में आए QR कोड को स्कैन न करें; भेजने वाले से अलग चैनल से पुष्टि करें।
ai_powered:
  likely: false
  why: No evidence of AI-generated voice or deepfake content in the data.
confidence: high
open_questions: []
misnamed_as: null
