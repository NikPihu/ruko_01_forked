analyst:
  verdict: new_scam
  nearest_playbook: null
  rationale: The evidence shows that the cluster's mechanism—unsolicited QR codes sent through messages,
    prompting victims to scan and pay a small amount—differs fundamentally from the known 'refund_qr'
    playbook, which relies on a phone call. The low similarity score (0.28) and absence of call-related
    signals confirm this is not a variant of an existing playbook. Therefore, a new playbook is required,
    with adjustments to its naming and inclusion of the messaging delivery channel.
  required_changes:
  - Rename the playbook to avoid confusion with existing 'refund_qr' which involves a phone call; e.g.,
    'unsolicited_qr_refund_message'.
  - Add a note that the lure arrives via messaging apps (WhatsApp/Telegram) rather than a voice call.
  - Include the signal 'MESSAGE_QR' to capture the delivery channel.
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
  evidence:
  - source: get_cluster_overview
    fact: All 14 payments used QR entry, were under ₹1,000, and involved new listed payees with session
      hesitation.
    seen: true
  - source: compare_with_playbook
    fact: Cluster lacks any call-related tokens (CALL_ON, CALLER_UNKNOWN) that are essential to the known
      'refund_qr' playbook.
    seen: true
  - source: get_candidate
    fact: Matcher rules for this cluster focus on ENTRY_QR, AMT_UNDER_1K, NEW_PAYEE, PAYEE_IN_RUN, SESSION_HESITATION,
      and PAYEE_LISTED, with no call conditions.
    seen: true
  - source: list_playbooks
    fact: No existing playbook describes unsolicited QR codes delivered via messaging apps; the closest
      'refund_qr' requires a phone call.
    seen: true
  - source: get_cluster_overview
    fact: Signal similarity to the nearest known playbook ('refund_qr') is only 0.28, well below the 0.8
      threshold for a variant.
    seen: true
