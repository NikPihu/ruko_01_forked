name: qr_small_amount_new_payee_mulehunter
title: QR small amount to new payee with high mule hunter score
status: review
summary: Victims receive a QR code from an unknown source for a small amount, which they scan and pay
  to a new payee with a high mule hunter score.
steps:
- Victim receives a QR code from an unknown source.
- Victim scans the QR code and pays a small amount.
- Payment is made to a new payee with a high mule hunter score.
signals:
- ENTRY_QR
- AMT_UNDER_1K
- NEW_PAYEE
- PAYEE_MULEHUNTER
reason_codes:
- R6_new_payee_typed
- R3_mule_like_payee
advice_en: Do not scan QR codes from unknown sources.
advice_hi: मानव सुत्रों से QR कोड को स्कैन न करें.
