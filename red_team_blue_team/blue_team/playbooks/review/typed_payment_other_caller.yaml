name: typed_payment_other_caller
title: Typed payment to new personal account after unknown listed call
status: review
summary: Scammer calls from a listed unknown number, claims a generic 'other' reason, and asks the victim
  to type a payment to a new personal UPI ID.
steps:
- Victim receives a call from an unknown number that appears in contacts (listed).
- Caller claims a generic 'other' reason and asks for a payment.
- Victim types the payment amount into the UPI app.
- Payment is sent to a new personal UPI ID not previously used.
- Victim may be asked to repeat or increase the payment.
signals:
- CALL_ON
- CALLER_UNKNOWN
- CALLER_LISTED
- ENTRY_TYPED
- SAYS_OTHER
- NEW_PAYEE
- PAYEE_PERSON
reason_codes:
- R6_new_payee_typed
- R5_lure_message
advice_en: Do not type payments to new personal accounts after a call from an unknown listed number.
advice_hi: अज्ञात सूचीबद्ध कॉल के बाद नए व्यक्तिगत खाते में टाइप किए गए भुगतान न करें।
ai_powered:
  likely: false
  why: No evidence of AI-generated voice or deepfake; all signals are standard phone call features.
confidence: high
open_questions: []
misnamed_as: digital_arrest
