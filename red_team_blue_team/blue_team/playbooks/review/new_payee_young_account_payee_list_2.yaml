name: new_payee_young_account_payee_list_2
title: 'Unnamed pattern from 16 complaints: payee young account, payee listed, payee pass through, repeat
  attempts, session paste after switch'
status: review
summary: '16 complaints from 16 users describe payments RUKO did not stop. Most share: payee young account,
  payee listed, payee pass through, repeat attempts, session paste after switch. Median payment Rs 7,170;
  37 payee accounts. Drafted without an LLM: an analyst should write the story.'
steps:
- 'Complaint pattern: payee young account, payee listed, payee pass through, repeat attempts, session
  paste after switch'
- Victim pays a new payee the scammer chose
signals:
- PAYEE_YOUNG_ACCOUNT
- PAYEE_LISTED
- PAYEE_PASS_THROUGH
- REPEAT_ATTEMPTS
- SESSION_PASTE_AFTER_SWITCH
- SAYS_COMPANY
reason_codes:
- R8_intel_hit
advice_en: Other people reported payments like this as scams. Stop, check with someone you trust, and
  call 1930 if unsure.
advice_hi: दूसरे लोगों ने ऐसे भुगतानों को धोखा बताया है। रुकें, किसी भरोसेमंद व्यक्ति से पूछें, और शक
  हो तो 1930 पर कॉल करें।
