analyst:
  verdict: new_scam
  nearest_playbook: task_job
  rationale: The cluster revolves around victims adding a newly created or "young" payee (often listed
    in the registry) and then being asked repeatedly to transfer money, with the scammer’s narrative typically
    involving a family‑member story (SAYS_COMPANY / SAYS_OTHER). This mechanism lacks the bait‑credit
    lure and escalating task deposits that define the task_job playbook, and none of the other known playbooks
    (fake_kyc_apk, fake_customer_care, digital_arrest, trading_group, refund_qr) match the observed signals.
    Therefore the pattern represents a new scam mechanism that requires its own playbook.
  required_changes:
  - Add a clear story describing the scammer's narrative (e.g., claiming a family member needs urgent
    help, using a young‑account payee, and repeatedly requesting payments).
  - Include the typical communication channel (e.g., WhatsApp/Telegram message or phone call) that initiates
    the new‑payee request.
  - Specify that no bait‑credit or “task” lure is observed, distinguishing it from the task_job playbook.
  - Mention that the victim is asked to type the payee details (entry_method=typed) and that the payee
    is often a newly created/young account.
  confidence: medium
  reviewed_by: openai.gpt-oss-120b-1:0
  evidence:
  - source: get_candidate
    fact: signal_similarity_lures_ignored shows 0.9 similarity to task_job, but this metric excludes lures
      and therefore does not capture the core story.
    seen: true
  - source: get_cluster_overview
    fact: nearest_known_playbook is task_job with similarity 0.465, indicating a weak overall match.
    seen: true
  - source: compare_with_playbook
    fact: Core task_job tokens such as BAIT_CREDITS and LURE_TASK_JOB are absent, while cluster‑specific
      tokens like PAYEE_LISTED, SESSION_DICTATED, and PAYEE_YOUNG_ACCOUNT are prominent.
    seen: true
  - source: get_cluster_overview
    fact: Distinctive tokens include PAYEE_YOUNG_ACCOUNT (2.73× lift), PAYEE_LISTED (1.93×), REPEAT_ATTEMPTS
      (1.7×), and SESSION_PASTE_AFTER_SWITCH (1.59×), a pattern not described in any known playbook.
    seen: true
  - source: test_matcher
    fact: The matcher (payee_registry_listed AND entry_method=typed) names 69% of the cases but yields
      only 0.236 legit payments per 1,000, showing the pattern is real but not covered by an existing
      playbook.
    seen: false
