name: on_call_remote_control
title: On‑call remote‑control payment scam
status: review
summary: Victims receive a phone call, are asked to install a remote‑control app, and while the call is
  active they are instructed to type a large payment to a new personal UPI ID.
steps:
- Victim receives a phone call (on‑call) from an unknown or familiar number.
- Caller asks the victim to install a remote‑control or screen‑sharing app, or takes control of the device.
- While the call remains active, the caller dictates a large typed payment to a new personal UPI ID.
- The amount is unusually high (10 k–50 k INR or more) and the payee is a first‑time recipient.
- Victim may be told the payment is for a company, verification, or other pretext; story may not match
  the claim.
- If the victim repeats the request quickly, additional payments may follow.
signals:
- CALL_ON
- REMOTE_CONTROL
- ENTRY_TYPED
- NEW_PAYEE
- PAYEE_IN_RUN
- AMT_10K_50K
- AMT_50K_PLUS
- AMT_UNUSUAL
reason_codes:
- R2_remote_control
- R4_unusual_amount
- R6_new_payee_typed
advice_en: If a call asks you to install remote‑control software and type a payment, end the call and
  verify the request independently.
advice_hi: यदि कॉल आपको रिमोट‑कंट्रोल ऐप इंस्टॉल करने और भुगतान टाइप करने को कहे, तो कॉल समाप्त करें और
  अनुरोध को स्वतंत्र रूप से जांचें।
