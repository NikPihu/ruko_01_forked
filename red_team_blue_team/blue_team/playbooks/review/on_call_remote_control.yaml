analyst:
  verdict: new_scam
  nearest_playbook: null
  rationale: 'The cluster exhibits a distinct pattern: victims receive an inbound phone call, are told
    to install a remote‑control app, and then type a large payment to a new personal UPI ID, often under
    a company pretext. This differs from fake_customer_care (outbound victim‑initiated calls) and digital_arrest
    (police/officer pretense with caller‑unknown cues). The similarity metrics are well below the 0.8
    threshold, and direct comparison shows missing hallmark tokens of the known playbooks. Therefore the
    mechanism is not described by any existing playbook and warrants a new playbook.'
  required_changes:
  - Add clarification that the call is inbound (victim receives call) rather than victim-initiated, distinguishing
    it from fake_customer_care.
  - Include the 'company' pretext token in the playbook title/summary to capture the distinct story mismatch
    pattern.
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
