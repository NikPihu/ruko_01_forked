name: qr_code_dictation_repeat
title: QR‑code dictation scam (repeat‑payment variant)
status: review
summary: Victims receive a call where the attacker dictates a QR‑code payment request; they scan and pay
  a modest amount to a new personal UPI ID, then are asked to repeat the payment within the same day.
steps:
- Caller (unknown or VoIP) contacts victim and claims a government or official issue.
- Victim is kept on the call; the caller dictates a QR‑code payment request.
- Victim scans the QR code and pays (entry = QR).
- Payee is a new personal UPI ID and is added to the victim’s run of payments.
- Within the same day, the caller asks for a second payment (repeat attempt).
- Process may repeat with the same or another new personal payee.
signals:
- ENTRY_QR
- SESSION_DICTATED
- REPEAT_ATTEMPTS
- NEW_PAYEE
- PAYEE_IN_RUN
- PAYEE_PERSON
- AMT_1K_10K
- AMT_10K_50K
reason_codes:
- R6_new_payee_typed
- R7_tranche_pattern
- R8_intel_hit
advice_en: If you receive a call where someone dictates a QR‑code payment, end the call and verify the
  request through official channels before paying.
advice_hi: यदि कोई कॉल आपको QR‑कोड भुगतान के लिए निर्देश देता है, तो कॉल समाप्त करें और आधिकारिक माध्यमों
  से सत्यापित करें, फिर ही भुगतान करें।
