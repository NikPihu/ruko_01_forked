name: remote_control_typed_payment
title: Remote‑control call scam with typed payments to new contacts
status: review
summary: Victim receives a call from an unknown number, the attacker takes remote control of the phone
  and directs the victim to type a large UPI payment to a new personal account, often claiming it is for
  a company or presenting a mismatched story.
steps:
- Victim receives an incoming call from an unknown number (CALL_ON).
- Caller gains remote control of the victim's phone (REMOTE_CONTROL).
- Attacker dictates a typed UPI payment (ENTRY_TYPED) to a brand‑new personal payee (NEW_PAYEE, PAYEE_PERSON).
- Payment amount is large or unusually high compared to the victim's history (AMT_10K_50K, AMT_50K_PLUS,
  AMT_UNUSUAL).
- Caller may claim the payment is for a company or give a story that does not match the victim's situation
  (SAYS_COMPANY, STORY_MISMATCH).
- Victim completes the payment; later files a complaint.
signals:
- CALL_ON
- REMOTE_CONTROL
- ENTRY_TYPED
- NEW_PAYEE
- PAYEE_IN_RUN
- PAYEE_PERSON
- SAYS_COMPANY
- STORY_MISMATCH
- AMT_UNUSUAL
reason_codes:
- R2_remote_control
- R6_new_payee_typed
- R9_story_mismatch
- R4_unusual_amount
advice_en: If a caller asks you to remote‑control your phone and type a payment, end the call and verify
  independently.
advice_hi: यदि कोई कॉलर आपके फ़ोन को रिमोट‑कंट्रोल करने को कहे और टाइपेड भुगतान करने को कहे, तो कॉल समाप्त
  करें और स्वतंत्र रूप से सत्यापित करें।
