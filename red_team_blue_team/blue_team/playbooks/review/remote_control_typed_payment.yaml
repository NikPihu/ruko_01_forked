analyst:
  verdict: new_scam
  nearest_playbook: null
  rationale: The cluster's pattern—receiving an incoming call, remote‑control of the phone, and a typed
    payment to a new personal payee with a story mismatch—does not align with any known playbook. Fake_customer_care
    expects the victim to initiate the call, and digital_arrest includes explicit arrest or authority
    threats, which are absent. Low overlap with known playbooks (0.006) and low similarity scores (<0.4)
    further support that this is a distinct scam mechanism. Therefore, a new playbook is warranted.
  required_changes: []
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
