name: copy_paste_investment_scam
title: Copy‑Paste Investment Scam (typed or QR entry)
status: review
summary: Victims are sent a copy‑paste or QR payment request for an alleged investment, then type or scan
  the amount and send it to a brand‑new personal UPI ID, often after installing a malicious app that requests
  accessibility or sideloaded APK.
steps:
- Victim receives a message promising an investment or quick‑cash tip.
- Message contains a pre‑filled UPI payment request (text or QR).
- Victim is told to copy‑paste the request or scan the QR into their UPI app.
- Victim types the amount (₹1,000‑₹50,000) and sends it to a brand‑new personal UPI ID.
- A malicious app may have been sideloaded or granted accessibility to auto‑fill the request.
- Victim may repeat the payment after the first success, believing the investment works.
signals:
- ENTRY_TYPED
- ENTRY_QR
- NEW_PAYEE
- PAYEE_PERSON
- SESSION_PASTE_AFTER_SWITCH
- ACCESSIBILITY
- SIDELOAD
- AMT_1K_10K
- AMT_10K_50K
reason_codes:
- R5_lure_message
- R6_new_payee_typed
- R7_tranche_pattern
- R8_intel_hit
advice_en: If a message asks you to copy‑paste or scan a payment request for an investment, verify the
  payee independently before sending any money.
advice_hi: यदि कोई संदेश निवेश के लिए भुगतान कॉपी‑पेस्ट या QR स्कैन करने को कहे, तो पहले प्राप्तकर्ता
  को स्वयं जांचें और फिर भुगतान करें।
ai_powered:
  likely: false
  why: No evidence of AI‑generated voice, deep‑fake video, or chatbot agent in the complaints.
confidence: high
open_questions: []
misnamed_as: null
match:
- priority: 100
  rule:
    all:
    - any:
      - feature: entry_method
        op: eq
        value: typed
      - feature: entry_method
        op: eq
        value: qr
    - feature: first_time_payee
      op: is
      value: true
    - feature: payee_holder_type
      op: eq
      value: person
    - any:
      - feature: session_pasted_after_switch
        op: is
        value: true
      - feature: untrusted_accessibility
        op: is
        value: true
      - feature: sideloaded_last_24h
        op: is
        value: true
    - any:
      - all:
        - feature: amount_inr
          op: '>='
          value: 1000
        - feature: amount_inr
          op: <
          value: 10000
      - all:
        - feature: amount_inr
          op: '>='
          value: 10000
        - feature: amount_inr
          op: <
          value: 50000
