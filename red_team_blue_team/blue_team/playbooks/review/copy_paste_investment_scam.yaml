analyst:
  verdict: new_scam
  nearest_playbook: null
  rationale: The cluster's dominant mechanism is a copy‑paste or QR investment request, with victims typing
    amounts (₹1k‑₹50k) to brand‑new personal UPI IDs after possibly installing a sideloaded or accessibility‑enabled
    app. None of the known playbooks (task_job, fake_kyc_apk, digital_arrest, etc.) capture this pattern;
    their matchers fail to name any cases and lack the investment‑specific signals. Although signal_similarity_lures_ignored
    shows a high similarity to task_job when lures are ignored, the core mechanism (investment copy‑paste)
    is distinct, indicating a new scam type. Therefore a new playbook is required, and the current matcher
    must be refined to meet naming thresholds.
  required_changes:
  - Improve matcher to reduce false positives (legit payments per 1k should be <=0.5) and increase coverage
    to >=60% of cases.
  - Add explicit condition for copy‑paste or QR investment requests (e.g., payer_says includes investment,
    session_pasted_after_switch true).
  - Consider separating accessibility/sideload signals into a sub‑matcher to avoid over‑broad naming.
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
  evidence:
  - source: get_candidate
    fact: Matcher names only 53% of the cluster's cases (needs 60%) and would name 1.15 legit payments
      per 1,000 (max 0.5).
    seen: true
  - source: get_cluster_overview
    fact: Cluster c04 has 17 complaints; typical case includes ENTRY_TYPED, NEW_PAYEE, PAYEE_PERSON, SESSION_PASTE_AFTER_SWITCH,
      AMT_1K_10K, and SAYS_INVESTMENT.
    seen: true
  - source: compare_with_playbook task_job
    fact: The task_job playbook's rule would name 0% of this cluster (playbook_rules_name_this_cluster
      = 0.0) and key tokens differ (e.g., LURE_TASK_JOB, BAIT_CREDITS missing).
    seen: true
  - source: compare_with_playbook fake_kyc_apk
    fact: The fake_kyc_apk playbook also would name 0% of this cluster and lacks investment‑related tokens.
    seen: true
  - source: compare_with_playbook digital_arrest
    fact: Digital_arrest playbook would name 0% of this cluster and key arrest‑threat tokens are absent.
    seen: true
