name: accessibility_sideloaded_typing_scam
title: Accessibility‑Sideloaded App Payment Scam
status: review
summary: Scammers sideload a malicious app, obtain accessibility permission, then guide victims to type
  payments to new person accounts, often repeated quickly and abandoned.
steps:
- Victim receives a message prompting installation of an app from outside the Play Store.
- Victim installs the side‑loaded app and grants accessibility (or other untrusted) permission.
- Scammer, via the app or a call, directs the victim to type a UPI payment to a new person payee.
- Payment is made quickly, often repeated within minutes, and the session may be abandoned or dictated.
- The payee is a person account, often part of a run, used to forward the stolen funds.
signals:
- ACCESSIBILITY
- SIDELOAD
- ENTRY_TYPED
- PAYEE_IN_RUN
- SESSION_DICTATED
- SESSION_ABANDONED
- REPEAT_ATTEMPTS
- SAYS_COMPANY
- SAYS_OTHER
reason_codes:
- R4_unusual_amount
- R7_tranche_pattern
advice_en: Never grant accessibility to unknown apps; stop if asked to type a payment after installing
  a side‑loaded app.
advice_hi: अज्ञात ऐप को एक्सेसिबिलिटी अनुमति न दें; साइड‑लोडेड ऐप इंस्टॉल करने के बाद टाइप पेमेंट की माँग
  पर रुकें।
ai_powered:
  likely: false
  why: No evidence of AI‑generated voice or deepfake content in the tokens.
confidence: high
open_questions: []
misnamed_as: null
