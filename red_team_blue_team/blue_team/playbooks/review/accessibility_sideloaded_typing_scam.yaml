analyst:
  verdict: variant_of_known
  nearest_playbook: fake_kyc_apk
  rationale: 'The cluster’s mechanism matches the fake_kyc_apk playbook: a sideloaded app that requests
    accessibility permission and then directs victims to type payments. The high similarity score (0.83)
    and the shared core steps confirm this. Differences are limited to missing explicit KYC lure tokens
    (likely delivered via non‑SMS channels) and the presence of repeat attempts, which can be captured
    in the matcher. Therefore the draft is a variant of the known fake_kyc_apk playbook, not a new scam.'
  required_changes:
  - Add a note that the KYC lure may be delivered via WhatsApp/Telegram or other non‑SMS channels, explaining
    the missing LURE_KYC token.
  - Mention that repeat attempts and session abandonment are common in this variant and should be reflected
    in the matcher description.
