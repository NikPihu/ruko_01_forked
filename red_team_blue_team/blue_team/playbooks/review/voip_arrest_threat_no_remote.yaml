name: voip_arrest_threat_no_remote
title: VoIP arrest‑threat scam without remote control
status: review
summary: Scammers call via VoIP, claim a family member is arrested, and pressure victims to pay typed
  transfers without installing remote‑control apps.
steps:
- Scammer calls via WhatsApp/VoIP, claiming victim's family member is under arrest.
- Victim is kept on the call, pressured not to involve others.
- Scammer asks for a typed UPI payment to a new personal account as "bail" or "verification".
- Victim may repeat attempts or involve family, but no remote‑control app is installed.
signals:
- CALL_VOIP
- ENTRY_TYPED
- SAYS_FAMILY
- SAYS_OTHER
- PAYEE_LISTED
- PAYEE_PERSON
- NEW_PAYEE
- AMT_1K_10K
- AMT_10K_50K
reason_codes:
- R10_bait_then_pay
- R1_live_unknown_call
advice_en: Do not pay; verify any arrest claim with official police before sending money.
advice_hi: यदि आपको अज्ञात नंबर से पुलिस द्वारा गिरफ्तारी का दावा सुनाई दे, तो भुगतान न करें; आधिकारिक
  पुलिस से सत्यापित करें।
ai_powered:
  likely: false
  why: No evidence of AI‑generated voice or deepfake; calls are standard VoIP.
confidence: high
open_questions: []
misnamed_as: digital_arrest
