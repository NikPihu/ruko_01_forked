analyst:
  verdict: variant_of_known
  nearest_playbook: digital_arrest
  rationale: The cluster was originally flagged by the digital_arrest rule, and its nearest known playbook
    is digital_arrest (fit 0.709). The complaints share the core narrative of an arrest threat via a VoIP
    call and typed payments, which is exactly what digital_arrest describes. The main difference is the
    absence of a remote‑control app; instead the scammers rely on session dictation, which is already
    covered by the digital_arrest playbook's optional remote‑control conditions. Because the mechanism
    is not fundamentally new, the draft should be merged as a variant of digital_arrest rather than creating
    a new playbook.
  required_changes:
  - Rename the playbook to indicate it is a variant of the existing 'digital_arrest' playbook rather than
    a new one.
  - Update the matcher to include SESSION_DICTATED (or other remote‑control signals) as optional, reflecting
    that remote‑control apps may be absent but dictation is used.
  - Adjust the description to note that the scam relies on VoIP arrest threats without installing a remote‑control
    app, but still uses session dictation, which is covered by the digital_arrest playbook.
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
