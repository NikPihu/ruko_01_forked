name: fake_company_remote_control
title: Fake company call with remote control dictation
status: review
summary: Scammer calls, takes remote control, and forces typed payments to a new personal UPI ID, often
  claiming to be a company.
steps:
- Scammer calls the victim, claiming to be from a company.
- Caller keeps the victim on the line and gains remote control of the phone.
- Victim is instructed to type a payment to a new personal UPI ID.
- Payment amount is unusually large or the story given mismatches known facts.
- If the victim hesitates, the scammer may repeat the request.
signals:
- CALL_ON
- REMOTE_CONTROL
- ENTRY_TYPED
- STORY_MISMATCH
- AMT_UNUSUAL
- SAYS_COMPANY
- NEW_PAYEE
- PAYEE_PERSON
reason_codes:
- R2_remote_control
- R6_new_payee_typed
- R9_story_mismatch
advice_en: If a call asks you to install remote‑control software and type a payment, hang up and verify
  independently.
advice_hi: यदि कॉल में रिमोट‑कंट्रोल ऐप इंस्टॉल करने और टाइप करके भुगतान करने को कहा जाए, तो कॉल काटें
  और स्वतंत्र रूप से सत्यापित करें।
ai_powered:
  likely: false
  why: No evidence of AI‑generated voice or deep‑fake content in the data.
confidence: high
open_questions: []
misnamed_as: null
