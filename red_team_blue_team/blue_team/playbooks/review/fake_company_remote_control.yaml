  nearest_playbook: null
  rationale: All four complaints involve inbound calls (CALL_ON) where the scammer claims to represent
    a legitimate company, takes remote control of the victim’s phone, and forces the victim to type a
    payment to a new personal UPI ID. The story mismatch token and unusually large amounts further indicate
    fraudulent intent. The similarity scores to existing playbooks are well below the 0.8 threshold, meaning
    this mechanism is not captured by any known playbook (digital_arrest focuses on government threats,
    fake_customer_care on outbound helpline calls). Therefore the cluster represents a distinct scam pattern
    that requires its own playbook.
  required_changes:
  - Add clarification that the scam involves inbound calls claiming to be from a legitimate company, not
    a customer‑care helpline.
  - Include the inbound CALL_ON token in the matcher (currently uses on_call is true, which is correct)
    and note that outgoing_to_unknown is not required.
  - Specify that the story mismatch often involves the victim being told the company’s story is different
    from reality.
