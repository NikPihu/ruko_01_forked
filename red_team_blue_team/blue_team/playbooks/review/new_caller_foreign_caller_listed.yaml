analyst:
  verdict: new_scam
  nearest_playbook: null
  rationale: The cluster is defined by a foreign, listed caller that is unknown to the victim, with the
    call active and then abandoned after the victim makes a payment to a new payee. No remote‑control,
    screen‑sharing, or typical arrest‑threat narrative is present, and similarity to the closest known
    playbook (digital_arrest) is only 0.599, far below the 0.8 variant threshold. The matcher has a very
    low false‑positive rate, confirming the pattern is distinct. Therefore this pattern represents a new
    scam mechanism not covered by existing playbooks.
  required_changes:
  - Add a narrative describing what the foreign listed caller told the victim (e.g., urgent payment request,
    impersonation, etc.)
  - Specify whether any remote‑control or screen‑sharing was attempted, even if absent, to clarify difference
    from digital_arrest
  - Include the typical payment amount range and timing (e.g., small one‑off payment after call)
  - Provide a clear step‑by‑step flow (call received → caller listed/foreign → victim pays new payee →
    call ends)
  - Add any observed lure channel (e.g., WhatsApp, SMS) if known
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
  evidence:
  - source: get_candidate
    fact: The matcher 'caller_registry_listed is True' names 100% of the cases with only 0.134 legit payments
      per 1,000
    seen: true
  - source: get_cluster_overview
    fact: Distinctive tokens CALLER_FOREIGN (lift 14), CALLER_LISTED (lift 14) and CALLER_UNKNOWN (lift
      6.36) appear in 80‑100% of the complaints
    seen: true
  - source: get_cluster_overview
    fact: Nearest known playbook is digital_arrest with similarity 0.599, well below the 0.8 threshold
      for a variant
    seen: true
  - source: compare_with_playbook
    fact: Key digital_arrest signals such as SESSION_DICTATED, AMT_UNUSUAL, and remote control are absent,
      while the cluster shows CALLER_FOREIGN and CALLER_LISTED
    seen: true
  - source: compare_with_playbook
    fact: Fake_customer_care expects remote‑control or dictated sessions, which the cluster does not exhibit
    seen: true
