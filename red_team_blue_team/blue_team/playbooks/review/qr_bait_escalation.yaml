analyst:
  verdict: new_scam
  nearest_playbook: null
  rationale: The evidence shows that the cluster’s payment pattern (small QR payment followed by a larger
    QR after a session is abandoned or dictated) does not align closely with any existing playbook. Signal
    similarity scores are well below the 0.8 variant threshold, and the matcher isolates the cluster with
    negligible overlap with known scams. Therefore the mechanism is novel and warrants a new playbook,
    with the suggested clarifications to the draft card.
  required_changes:
  - Add explicit description of the two‑stage QR escalation mechanism (tiny QR payment followed by larger
    QR after session abandonment or dictation) to differentiate from refund_qr and task_job.
  - Include example victim statements and attacker communication channels (e.g., follow‑up call or chat
    prompting the larger QR).
  - Provide guidance to verify QR codes and confirm recipient before any subsequent payment.
