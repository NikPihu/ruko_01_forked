name: qr_bait_escalation
title: QR Bait Escalation Scam
status: review
summary: Victims are sent a QR code for a tiny payment, then later urged to pay a larger amount via QR
  to the same new payee, often after a call or chat where the session is abandoned or dictated.
steps:
- Scammer sends a QR code for a tiny payment (under ₹1,000).
- Victim pays the small amount, creating a new payee and repeat attempt flag.
- Scammer contacts the victim (call/chat) and asks for a larger payment (₹1,000‑₹10,000) using the same
  or a new QR code.
- Victim makes the larger QR payment, often after the session is abandoned or dictated.
signals:
- ENTRY_QR
- AMT_UNDER_1K
- AMT_1K_10K
- NEW_PAYEE
- REPEAT_ATTEMPTS
- PAYEE_IN_RUN
- SESSION_ABANDONED
- SESSION_DICTATED
reason_codes:
- R7_tranche_pattern
- R5_lure_message
advice_en: Verify any QR payment request before sending larger amounts; do not follow up without confirming
  the recipient.
advice_hi: छोटा QR भुगतान करने से पहले अनुरोध की पुष्टि करें; बिना जाँच के बड़े भुगतान न करें।
ai_powered:
  likely: false
  why: No evidence of AI‑generated voice or deepfake content in the data.
confidence: high
open_questions: []
misnamed_as: null
match:
- priority: 100
  rule:
    all:
    - feature: entry_method
      op: eq
      value: qr
    - all:
      - feature: amount_inr
        op: '>='
        value: 1000
      - feature: amount_inr
