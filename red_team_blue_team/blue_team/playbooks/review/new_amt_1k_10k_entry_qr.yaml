analyst:
  verdict: new_scam
  nearest_playbook: null
  rationale: The cluster consists of small (₹1k‑10k) QR‑based payments to new payees, but none of the
    cases involve a phone call or any explicit refund/ prize lure. Known QR‑based scams (refund_qr) always
    include a call, and similarity scores are far below the variant threshold, indicating a distinct mechanism.
    Moreover, the matcher as written would generate a high false‑positive rate, confirming it does not
    capture a known playbook safely. Therefore this pattern represents a new scam that is not covered
    by existing playbooks and requires a more specific rule.
  required_changes:
  - Add a condition requiring an incoming or outgoing call (on_call true) or a payer_says token indicating
    a refund/prize to narrow the matcher, as current rule over‑names legitimate QR payments.
  - Consider adding a token check for a lure context (e.g., "refund", "cashback", "prize") to differentiate
    scam QR scans from normal QR payments.
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
  evidence:
  - source: get_cluster_overview
    fact: All 4 cases share AMT_1K_10K, ENTRY_QR, NEW_PAYEE and PAYEE_IN_RUN tokens.
    seen: true
  - source: get_case rep_007452
    fact: The payment entry method is QR, with no call data (on_call missing) and no payer_says token.
    seen: true
  - source: list_playbooks
    fact: The only known QR‑based playbook (refund_qr) requires an on_call flag, which is absent in this
      cluster.
    seen: true
  - source: get_candidate
    fact: Signal similarity to all known playbooks is low (max 0.306 to refund_qr), well below the 0.8
      variant threshold.
    seen: true
  - source: test_matcher
    fact: The proposed matcher would name 49.69 legitimate payments per 1,000, exceeding the allowed 0.5
      threshold.
    seen: false
