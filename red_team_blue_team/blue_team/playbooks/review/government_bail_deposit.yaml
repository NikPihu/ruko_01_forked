analyst:
  verdict: variant_of_known
  nearest_playbook: digital_arrest
  rationale: The cluster’s mechanism—unknown/VoIP caller claiming to be a government officer, keeping
    the victim on a remote‑control session, and demanding a large typed UPI payment to a new personal
    account—is exactly the behavior captured by the known playbook digital_arrest. Although the cluster
    emphasizes unusually large amounts (≥ ₹50 k) and explicitly mentions "government", these are variations
    within the same fraud pattern, not a fundamentally new mechanism. The low similarity score (0.4) reflects
    token weighting but does not outweigh the mechanistic match. The drafted matcher only captures 25 %
    of cases, so it needs to be broadened to meet the 60 % coverage rule. Renaming the playbook as a variant
    of digital_arrest avoids unnecessary proliferation of playbooks.
  required_changes:
  - Expand the matcher to include the remote‑control/session‑dictated condition as optional (any) rather
    than required, and add a lower‑amount clause (e.g., amount ≥ 10 k) to capture the smaller payments
    seen in the cluster. This will raise coverage from 25 % to the required ≥ 60 % of cases.
  - Rename the playbook to align with the existing known playbook “digital_arrest”, e.g., “digital_arrest
    – bail deposit variant”, rather than creating a brand‑new playbook.
