name: government_bail_deposit
title: Fake-government bail deposit scam
status: review
summary: Victims receive a call from an unknown/VoIP number claiming to be a government officer, who keeps
  the line open (remote control or screen sharing) and demands a large typed UPI payment to a new personal
  account as bail or verification.
steps:
- Unknown or VoIP caller claims to be a government officer and threatens arrest.
- Caller keeps the victim on the line, often using remote‑control or screen‑sharing.
- Victim is told to pay a large “bail” or “verification” amount.
- Victim makes a typed UPI payment to a newly created personal UPI ID.
- Payment is unusually large (≥ ₹50 k) or unusually high for the user.
- Caller may add urgency or claim a story mismatch and request repeat payments.
signals:
- ENTRY_TYPED
- PAYEE_IN_RUN
- AMT_50K_PLUS
- AMT_UNUSUAL
- REMOTE_CONTROL
- SESSION_DICTATED
- SESSION_PASTE_AFTER_SWITCH
- SAYS_GOVERNMENT
- SAYS_OTHER
reason_codes:
- R10_bait_then_pay
- R1_live_unknown_call
- R2_remote_control
- R4_unusual_amount
- R5_lure_message
- R6_new_payee_typed
- R9_story_mismatch
advice_en: If a caller claims to be a government officer and asks you to pay money, hang up and verify
  the request through official channels.
advice_hi: यदि कोई कॉलर सरकारी अधिकारी होने का दावा करके पैसे देने को कहे, तो कॉल काटें और आधिकारिक माध्यमों
  से सत्यापित करें।
