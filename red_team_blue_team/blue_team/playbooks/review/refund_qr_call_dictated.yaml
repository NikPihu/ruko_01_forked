  rationale: The complaints revolve around a QR code sent during a phone call, with the victim kept on
    the line while the scammer dictates the payment. This matches the existing 'refund_qr' playbook, which
    already covers QR‑code scams on calls. The additional dictation step is a minor variation, not a new
    mechanism. The cluster was incorrectly labeled 'digital_arrest' by RUKO, as the story lacks police
    threats, remote‑control, or typed entry. Therefore the draft playbook is a variant of the known 'refund_qr'
    playbook, not a new scam.
