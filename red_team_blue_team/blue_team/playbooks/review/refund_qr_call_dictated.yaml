name: refund_qr_call_dictated
title: Refund QR code scam with call dictation
status: review
summary: Victims receive a QR code for a supposed refund while on a call; they are kept on the line and
  the scammer dictates the payment, leading to repeated QR payments to new payees.
steps:
- Scammer calls victim from unknown or VoIP number claiming a refund or prize.
- During the call, the scammer sends a QR code (or image) for the victim to scan.
- Victim is kept on the line while the scammer dictates the payment amount.
- Victim scans the QR and authorizes a payment to a new, unverified payee.
- Scammer may repeat the request, leading to multiple payments.
signals:
- CALL_ON
- CALLER_UNKNOWN
- ENTRY_QR
- NEW_PAYEE
- SESSION_DICTATED
- SESSION_ABANDONED
- AMT_UNUSUAL
reason_codes:
- R5_lure_message
- R9_story_mismatch
advice_en: Do not pay any QR code request received during a call; verify the sender independently.
advice_hi: कॉल के दौरान प्राप्त QR कोड अनुरोध को भुगतान न करें; प्रेषक को स्वतंत्र रूप से सत्यापित करें।
ai_powered:
  likely: false
  why: No evidence of AI-generated voice or deepfake; scam uses human caller.
confidence: high
open_questions: []
misnamed_as: digital_arrest
match:
- priority: 39
  rule:
    all:
    - feature: on_call
      op: is
      value: true
    - any:
      - feature: caller_unknown
        op: is
        value: true
      - all:
        - feature: voip_call
          op: is
          value: true
        - feature: caller_unknown
          op: is_null
    - feature: entry_method
      op: eq
      value: qr
    - any:
      - feature: session_dictated
        op: is
        value: true
      - feature: session_abandoned_30m
        op: '>='
        value: 1
    - feature: first_time_payee
      op: is
      value: true
