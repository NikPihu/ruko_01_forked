name: caller_listed_typed_new_payee
title: Caller Listed, Typed Entry, New Payee
status: review
summary: This scam involves a call from a listed caller, a typed payment entry, and a new payee. The caller
  may pose as a family member or friend to gain trust.
steps:
- The victim receives a call from a listed caller.
- The caller poses as a family member or friend.
- The victim is instructed to make a payment.
- The payment is entered via typed method.
- The payee is new.
