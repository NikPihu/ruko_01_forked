name: foreign_relative_urgent_money
title: Foreign caller urges urgent money transfer to new personal UPI ID
status: review
summary: Victim receives a call from an unknown foreign number claiming urgent personal need and is asked
  to type payments to a new person UPI ID, often multiple times.
steps:
- Unknown foreign caller contacts victim and claims an urgent personal emergency.
- Victim stays on the call while the caller asks for immediate money.
- Victim is instructed to type a payment to a new person UPI ID.
- Caller may request a second payment shortly after the first.
- Victim sends one or more typed payments to the new payee.
signals:
- CALLER_FOREIGN
- CALLER_LISTED
- CALLER_UNKNOWN
- CALL_ON
- ENTRY_TYPED
- NEW_PAYEE
- PAYEE_IN_RUN
- PAYEE_PERSON
reason_codes:
- R1_live_unknown_call
- R5_lure_message
- R6_new_payee_typed
advice_en: Hang up and verify any money request from unknown foreign callers before paying.
advice_hi: अज्ञात विदेशी कॉल से पैसे की मांग पर कॉल काटें और अनुरोध की पुष्टि करें।
