name: qr_refund_small_payment
title: QR code small‑payment scam to new personal UPI IDs
status: review
summary: Scammers send a QR code promising a refund, prize or urgent payment, prompting the victim to
  pay a small amount (<₹1k) to a newly created personal UPI ID that quickly forwards the money.
steps:
- Victim receives a call or message claiming a refund, prize, or urgent payment and is sent a QR code.
- Victim scans the QR code and is prompted to pay a small amount (usually under ₹1,000) using a new personal
  UPI ID.
- The payment is made to the newly created personal account.
- The payee quickly forwards the money to another account or cashes out, indicated by high pass‑through
  rate.
- Victim may be asked to repeat the process for additional small amounts.
signals:
- ENTRY_QR
- AMT_UNDER_1K
- NEW_PAYEE
- PAYEE_PERSON
- PAYEE_PASS_THROUGH
reason_codes:
- R5_lure_message
- R7_tranche_pattern
advice_en: Do not scan QR codes from unknown sources; verify the request through official channels before
  paying.
advice_hi: अज्ञात स्रोत से मिले QR कोड को स्कैन न करें; भुगतान करने से पहले आधिकारिक चैनल से पुष्टि करें।
ai_powered:
  likely: false
  why: No evidence of AI‑generated voice or deepfake content in the complaints.
confidence: high
open_questions: []
misnamed_as: null
match:
- priority: 100
  rule:
    all:
    - feature: entry_method
      op: eq
      value: qr
    - feature: amount_inr
      op: <
      value: 1000
    - feature: first_time_payee
      op: is
      value: true
    - feature: payee_holder_type
      op: eq
      value: person
    - feature: payee_pass_through_24h
      op: '>='
      value: 0.5
