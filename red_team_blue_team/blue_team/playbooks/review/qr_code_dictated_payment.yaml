name: qr_code_dictated_payment
title: QR code dictation scam
status: review
summary: Victims receive a QR code promising a refund or prize, then a call where the scammer dictates
  the payment amount, leading to a QR‑based payment to a new payee.
steps:
- Scammer sends a QR code claiming a refund, cashback or prize.
- Victim scans the QR code, opening the UPI app.
- Scammer calls the victim and dictates the amount to pay.
- Victim enters the dictated amount and confirms the payment.
- Payment goes to a newly created payee that is part of a cash‑out chain.
signals:
- ENTRY_QR
- SESSION_DICTATED
- NEW_PAYEE
- PAYEE_IN_RUN
- AMT_1K_10K
reason_codes:
- R5_lure_message
- R3_mule_like_payee
advice_en: If you receive a QR code and a call dictating the amount, verify the request before paying.
advice_hi: यदि आपको QR कोड और कॉल में राशि बताई जाए, तो भुगतान करने से पहले अनुरोध की पुष्टि करें।
