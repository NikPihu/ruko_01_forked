analyst:
  verdict: variant_of_known
  nearest_playbook: refund_qr
  rationale: The core mechanism—receiving a QR code from a caller and paying via a UPI app—is exactly
    the scenario described in the known 'refund_qr' playbook. The only notable difference is that the
    scammer dictates the amount after the QR scan, which is a minor procedural variation rather than a
    new fraud mechanism. Because the similarity to 'refund_qr' is the highest among known playbooks and
    the underlying flow matches, the cluster should be treated as a variant of 'refund_qr' rather than
    a brand‑new scam. Updating the card to reflect this relationship will keep the playbook set concise
    and avoid duplication.
  required_changes:
  - Note that this cluster is a variant of the existing 'refund_qr' playbook, adding a dictation step
    after the QR scan.
  - Update the playbook title to reflect it as a 'refund_qr with dictation' variant or merge into the
    existing refund_qr card.
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
