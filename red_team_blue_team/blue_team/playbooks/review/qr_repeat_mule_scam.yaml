analyst:
  verdict: new_scam
  nearest_playbook: null
  rationale: The evidence shows that cluster c16 exhibits a repeat‑QR payment pattern that is not captured
    by any known playbook. The nearest playbook (task_job) shares only a weak similarity (0.218) and lacks
    the QR entry and session‑dictated characteristics. No call‑related lure tokens are present, ruling
    out refund_qr, fake_customer_care, or digital_arrest. The matcher’s high recall and low false‑positive
    rate further confirm a coherent, unique mechanism. Therefore the draft playbook describes a new scam
    type and should be approved as a new_scam.
  required_changes: []
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
  evidence:
  - source: get_cluster_overview
    fact: Cluster c16 has 7 missed complaints, all showing ENTRY_QR, AMT_1K_10K, NEW_PAYEE, REPEAT_ATTEMPTS,
      PAYEE_IN_RUN, SESSION_DICTATED and no call-related tokens.
    seen: true
  - source: test_matcher
    fact: Matcher with six tokens (QR entry, repeat attempts, amount 1k‑10k, first‑time payee, payee_in_run,
      session_dictated) achieves 0.714 case recall and only 0.07 legit payments per 1,000.
    seen: true
  - source: compare_with_playbook
    fact: Similarity to the nearest known playbook (task_job) is only 0.218, with many key tokens (LURE_TASK_JOB,
      EPISODE_WATCHING, BAIT_CREDITS) absent from the cluster.
    seen: true
  - source: list_playbooks
    fact: No existing playbook describes a pattern of repeated QR‑based payments to new payees without
      a preceding call or lure.
    seen: true
  - source: get_candidate
    fact: The draft card’s matcher recalls 75% of the cluster’s payments and flags virtually no legitimate
      traffic, indicating a distinct, high‑precision pattern.
    seen: true
