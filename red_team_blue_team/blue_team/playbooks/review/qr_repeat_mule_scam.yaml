name: qr_repeat_mule_scam
title: QR repeat payment mule recruitment
status: review
summary: Scammers send QR payment requests for small 1k‑10k amounts, victims pay repeatedly to new payees
  while the app dictates the payment, creating a mule network.
steps:
- Scammer sends a QR code or payment request via messaging app.
- Victim scans QR and the app auto‑dictates the payment amount (1k‑10k INR).
- Payment is made to a newly created payee (first‑time payee).
- Scammer repeats the request multiple times, each payment dictated by the session.
- Payee is part of an active scam network (payee_in_run).
signals:
- REPEAT_ATTEMPTS
- ENTRY_QR
- AMT_1K_10K
- NEW_PAYEE
- PAYEE_IN_RUN
- SESSION_DICTATED
reason_codes:
- R7_tranche_pattern
- R3_mule_like_payee
advice_en: Do not scan or pay QR codes from unknown sources; verify with your bank before sending money.
advice_hi: अज्ञात स्रोत से QR कोड स्कैन या भुगतान न करें; भुगतान करने से पहले अपने बैंक से पुष्टि करें।
ai_powered:
  likely: false
  why: No evidence of AI‑generated voice or deepfake content in the tokens.
confidence: high
open_questions: []
misnamed_as: null
match:
- priority: 100
  rule:
    all:
    - feature: attempts_72h
      op: '>='
      value: 2
    - feature: entry_method
      op: eq
      value: qr
    - all:
      - feature: amount_inr
        op: '>='
        value: 1000
      - feature: amount_inr
        op: <
        value: 10000
    - feature: first_time_payee
      op: is
      value: true
    - feature: payee_in_run
      op: is
      value: true
    - feature: session_dictated
      op: is
      value: true
