name: qr_tranche_scam
title: QR Tranche Scam – Small first payment followed by larger repeat QR request
status: review
summary: Victims are sent a QR code for a tiny payment to a new merchant, then later receive another QR
  for a larger amount from the same merchant and are persuaded to pay again.
steps:
- Victim receives a QR code for a tiny payment (< ₹1,000) to a new merchant.
- Victim scans and pays, often hesitating or abandoning the session.
- Within the same day the victim receives another QR code from the same merchant for a larger amount (₹1,000‑₹10,000).
- Victim repeats the payment after follow‑up prompting.
- Funds are transferred to the merchant, which may forward to cash‑out channels.
signals:
- ENTRY_QR
- AMT_UNDER_1K
- NEW_PAYEE
- PAYEE_IN_RUN
- SESSION_ABANDONED
- AMT_1K_10K
- SESSION_HESITATION
- GAP_UNDER_1D
reason_codes:
- R7_tranche_pattern
advice_en: Do not scan QR codes from unknown sources; confirm the payee and amount before paying.
advice_hi: अज्ञात स्रोत से QR कोड स्कैन न करें; भुगतान से पहले प्राप्तकर्ता और राशि की पुष्टि करें।
ai_powered:
  likely: false
  why: No evidence of AI‑generated voice or deep‑fake content in the tokens.
confidence: high
open_questions: What social channel delivers the QR codes (e.g., WhatsApp, SMS) and how victims are prompted
  for the second payment?
misnamed_as: null
match:
- priority: 100
  rule:
    all:
    - feature: entry_method
      op: eq
      value: qr
    - all:
      - feature: amount_inr
        op: '>='
        value: 1000
      - feature: amount_inr
        op: <
        value: 10000
    - feature: payee_in_run
      op: is
      value: true
    - feature: session_hesitation
      op: is
      value: true
