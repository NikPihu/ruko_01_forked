analyst:
  verdict: new_scam
  nearest_playbook: null
  rationale: 'The evidence shows a distinct mechanism: victims receive a QR code for a tiny payment to
    a new merchant, then later receive a second QR code from the same merchant for a larger amount. This
    pattern occurs without any phone call, which differentiates it from the existing `refund_qr` playbook
    that relies on a caller. Signal similarity scores are far below the variant threshold, and the cluster
    is classified as "new" by RUKO. Therefore, the mechanism is not captured by any known playbook and
    constitutes a new scam type.'
  required_changes:
  - Add explicit description of the delivery channel for the QR codes (e.g., WhatsApp, email, or SMS)
    and how the victim is prompted for the second, larger payment.
  - Clarify that there is no phone call or voice interaction involved, distinguishing this pattern from
    the existing `refund_qr` playbook.
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
  evidence:
  - source: get_cluster_overview
    fact: Cluster c11 is marked as "new" with no existing RUKO playbook name and a low similarity (0.18)
      to the nearest known playbook (digital_arrest).
    seen: true
  - source: get_candidate
    fact: Signal similarity to all known playbooks is low (e.g., task_job 0.15, digital_arrest 0.11) and
      no playbook reaches the 0.8 threshold for variant classification.
    seen: true
  - source: get_case rep_013627
    fact: 'Two payments were made via QR entry: a small < ₹1 000 payment followed by a larger ₹1 000‑10 000
      payment from the same new merchant, with session hesitation and abandonment recorded.'
    seen: true
  - source: get_case rep_014539
    fact: Same QR‑tranche pattern repeats with a different merchant, showing the repeat‑attempt behavior
      and session hesitation on the second payment.
    seen: true
  - source: compare_with_playbook refund_qr
    fact: The cluster lacks the key tokens of the `refund_qr` playbook (CALL_ON, CALLER_UNKNOWN, VOIP_CALL)
      and instead shows tokens like SESSION_HESITATION and GAP_UNDER_1D that are not common in `refund_qr`.
    seen: true
