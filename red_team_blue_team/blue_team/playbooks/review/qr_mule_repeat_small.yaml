name: qr_mule_repeat_small
title: QR code mule recruitment with repeat small payments
status: review
summary: Victims receive unsolicited QR code payment requests, scan and pay small amounts repeatedly to
  newly created mule accounts that forward funds, often abandoning the session after each attempt.
steps:
- Victim receives an unsolicited QR code request (e.g., refund, order) via message.
- Victim scans the QR code and pays a small amount (<₹1,000).
- Payment appears to fail or victim is told it didn't go through, prompting another attempt.
- Repeated payments are made within 72 hours to the same newly created payee.
- The payee is a mule account that forwards funds to cash‑out channels.
- Victim may abandon the session after each attempt, leading to multiple attempts.
signals:
- ENTRY_QR
- AMT_UNDER_1K
- NEW_PAYEE
- REPEAT_ATTEMPTS
- PAYEE_MULEHUNTER
- PAYEE_PASS_THROUGH
- SESSION_ABANDONED
reason_codes:
- R7_tranche_pattern
- R3_mule_like_payee
advice_en: Verify QR code source before paying; ask the sender to share payment details via a trusted
  channel.
advice_hi: QR कोड का स्रोत जांचें; भुगतान करने से पहले भरोसेमंद माध्यम से विवरण पूछें।
