analyst:
  verdict: variant_of_known
  nearest_playbook: refund_qr
  rationale: The pattern of small‑amount QR payments to new payees matches the known "refund_qr" scam
    where victims are sent a QR code after a phone call promising a refund. Although the cluster lacks
    explicit call tokens, this is likely due to missed episode data rather than a new mechanism. The current
    matcher is overly broad, naming hundreds of legitimate payments, so it should be tightened to the
    refund‑QR story. Therefore the cluster is a variant of the existing refund_qr playbook, not a new
    scam.
  required_changes:
  - Add narrative that victims were told about a refund or prize and were sent a QR code, typically accompanied
    by a phone call (even if the call token was missed).
  - Refine the matcher to require an on‑call or caller_unknown flag (or at least a recent call event)
    in addition to amount <1000 and entry_method=qr, to avoid naming many legitimate QR payments.
  - Include a step describing the scammer’s promise of a refund/prize and the victim scanning the QR while
    on the call.
  confidence: medium
  reviewed_by: openai.gpt-oss-120b-1:0
  evidence:
  - source: get_candidate
    fact: The rule would name 517.635 legit payments per 1,000 (far above the 0.5 max) and matches 51%
      of known‑playbook payments (exceeds 30% limit).
    seen: true
  - source: get_cluster_overview
    fact: Cluster c08 has 13 complaints, all with AMT_UNDER_1K, ENTRY_QR, NEW_PAYEE, PAYEE_IN_RUN; nearest
      known playbook similarity is 0.132 (digital_arrest).
    seen: true
  - source: compare_with_playbook
    fact: Compared with refund_qr, the cluster lacks call‑related tokens (CALLER_UNKNOWN, CALL_ON, etc.)
      but shares the QR entry method and low amount.
    seen: true
