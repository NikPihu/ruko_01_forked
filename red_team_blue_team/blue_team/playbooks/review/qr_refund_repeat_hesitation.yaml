analyst:
  verdict: new_scam
  nearest_playbook: null
  rationale: 'The cluster exhibits a distinct mechanism: victims receive QR codes via messaging, scan
    them, and are urged to repeat small payments despite hesitation. This pattern lacks the call‑based
    element of the known ''refund_qr'' playbook and does not align with any other existing playbooks,
    as shown by low similarity scores and token differences. The matcher reliably captures these cases,
    supporting the need for a new playbook.'
  required_changes:
  - Add clarification that the scam is delivered via messaging platforms (e.g., WhatsApp, Telegram) rather
    than a phone call, distinguishing it from the known 'refund_qr' playbook.
  - Include the repeat‑payment pattern and victim hesitation as core signals, and note that the QR code
    is often presented as a 'verification' or 'refund' request without any accompanying call.
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
  evidence:
