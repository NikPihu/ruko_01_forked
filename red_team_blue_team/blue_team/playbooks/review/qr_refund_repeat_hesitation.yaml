name: qr_refund_repeat_hesitation
title: QR‑code refund/verification scam with repeat payments
status: review
summary: Scammers send QR codes via messages promising refunds or verification; victims scan and pay small
  amounts to new payees, are urged to repeat payments despite hesitation, resulting in multiple low‑value
  transfers to accounts in a run.
steps:
- Victim receives a message containing a QR code claiming a refund or verification.
- Victim scans the QR code, sees a payment request and pays a small amount to a new payee.
- Scammer asks the victim to repeat the payment for a larger verification amount.
- Despite hesitation, the victim makes multiple low‑value transfers to the same payee run.
signals:
- ENTRY_QR
- PAYEE_IN_RUN
- SESSION_HESITATION
- REPEAT_ATTEMPTS
- NEW_PAYEE
reason_codes:
- R5_lure_message
- R7_tranche_pattern
advice_en: Do not scan QR codes from unknown messages; verify the request through official channels before
  paying.
advice_hi: अज्ञात संदेशों से QR कोड स्कैन न करें; भुगतान करने से पहले आधिकारिक चैनल से सत्यापित करें।
ai_powered:
  likely: false
  why: No evidence of AI‑generated voice or deepfake content in the complaints.
confidence: high
open_questions: []
misnamed_as: null
