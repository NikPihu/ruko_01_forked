      the cluster uniquely shows REPEAT_ATTEMPTS and SESSION_HESITATION.
    seen: true
  - source: get_candidate
    fact: Signal similarity to all known playbooks is low (max 0.22 to task_job), and the matcher (ENTRY_QR
