name: accessibility_sideload_typing_scam
title: Suspicious Accessibility + Sideload + Typed‑Entry Payments
status: review
summary: Victims install a sideloaded app that requests accessibility permission, then are forced to type
  a payment to a new personal UPI ID. Payments are repeated quickly, often unusually large, and the story
  often mismatches the request.
steps:
- Victim receives a message claiming urgent KYC or account‑block and a link to an APK.
- Victim installs the sideloaded app.
- App requests accessibility permission.
- App forces the victim to type a payment to a new personal UPI ID.
- Victim may repeat the payment quickly, often with unusually large amounts.
- Story given by the app often mismatches the request.
signals:
- ACCESSIBILITY
- SIDELOAD
- ENTRY_TYPED
- PAYEE_PERSON
- PAYEE_IN_RUN
- REPEAT_ATTEMPTS
- SESSION_ABANDONED
- AMT_UNUSUAL
reason_codes:
- R6_new_payee_typed
- R4_unusual_amount
- R9_story_mismatch
advice_en: If an app asks for accessibility permission, do not enter any payment details.
advice_hi: यदि कोई ऐप एक्सेसिबिलिटी अनुमति माँगता है, तो भुगतान विवरण कभी न दर्ज करें।
ai_powered:
  likely: false
  why: No evidence of AI‑generated voice, deep‑fake video, or chatbot interaction in the data.
confidence: high
open_questions: []
misnamed_as: null
