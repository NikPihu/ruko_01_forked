analyst:
  verdict: variant_of_known
  nearest_playbook: fake_kyc_apk
  rationale: The cluster's dominant signals (ACCESSIBILITY, SIDELOAD, typed entry) align closely with
    the known fake_kyc_apk playbook, and the similarity score of 0.83 (above the 0.8 threshold) strongly
    suggests it is a variant rather than a new mechanism. The only missing element is the explicit KYC
    lure token, which can be absent when the lure is delivered via non‑SMS channels. Therefore, the draft
    should be merged into the existing fake_kyc_apk playbook with minor wording adjustments, not created
    as a new playbook.
  required_changes:
  - Rename the playbook to indicate it is a variant of the existing 'fake_kyc_apk' playbook.
  - Adjust the description to note that the lure (KYC request) is not captured in the data, but the mechanism
    matches fake_kyc_apk (accessibility + sideload + typed entry).
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
