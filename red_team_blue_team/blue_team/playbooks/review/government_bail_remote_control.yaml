  rationale: The cluster c04 consists of victims who were contacted by callers claiming to be government
    officials, kept on the line while the scammer used remote‑control or dictation to enter large typed
    payments to new personal UPI accounts. This pattern is exactly what the known 'digital_arrest' playbook
    describes (fake police/customs officer, bail/verification payments, remote control). The similarity
    scores and step‑by‑step comparison confirm the mechanism is not new, just a specific story variant.
    Therefore the draft playbook should be merged with or renamed to the existing digital_arrest playbook
    rather than created as a new one.
  required_changes:
