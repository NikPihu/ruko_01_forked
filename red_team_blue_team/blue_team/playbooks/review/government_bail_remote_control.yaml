name: government_bail_remote_control
title: Government bail scam with remote‑control dictation
status: review
summary: Scammers pose as government officials, use remote‑control or dictation to make victims type large
  payments to new personal UPI accounts, often in quick succession.
steps:
- Scammer calls, claiming to be a government officer and threatens arrest or bail.
- Victim is kept on the line while the scammer uses remote‑control or dictation to enter payment details.
- Victim is asked to type a large payment (≥10,000 ₹) to a new personal UPI account.
- Additional smaller payments may follow quickly, often with the same remote‑control session.
signals:
- ENTRY_TYPED
- PAYEE_IN_RUN
- AMT_50K_PLUS
- AMT_10K_50K
- NEW_PAYEE
- SESSION_DICTATED
- SESSION_PASTE_AFTER_SWITCH
- SESSION_HESITATION
- SESSION_ABANDONED
reason_codes:
- R4_unusual_amount
- R6_new_payee_typed
- R7_tranche_pattern
- R12_coached_session
- R9_story_mismatch
advice_en: If a caller claims to be a government officer and asks you to type a large payment, hang up
  and verify with the official agency before paying.
advice_hi: यदि कोई कॉलर खुद को सरकारी अधिकारी बताता है और बड़ी राशि टाइप करने को कहे, तो कॉल काटें और
  आधिकारिक एजेंसी से सत्यापित करें।
ai_powered:
  likely: false
  why: No evidence of AI‑generated voice or deepfake; the scam relies on remote‑control and social engineering.
confidence: high
open_questions: []
misnamed_as: null
match:
- priority: 100
  rule:
    all:
    - feature: entry_method
      op: eq
      value: typed
    - feature: payee_in_run
      op: is
      value: true
    - any:
      - feature: amount_inr
        op: '>='
        value: 50000
      - all:
        - feature: amount_inr
          op: '>='
          value: 10000
        - feature: amount_inr
          op: <
          value: 50000
    - feature: first_time_payee
      op: is
      value: true
    - any:
      - feature: session_dictated
        op: is
        value: true
      - feature: session_pasted_after_switch
        op: is
        value: true
      - feature: session_hesitation
        op: is
        value: true
      - feature: session_abandoned_30m
        op: '>='
        value: 1
