name: government_remote_control_bait
title: Government‑official remote‑control payment scam
status: review
summary: Scammers pose as government officials, use remote‑control or dictation, and force victims to
  type large payments to new personal UPI IDs, followed by quick smaller payments.
steps:
- Scammer calls, pretends to be a government officer and threatens arrest or legal action.
- Victim is kept on the call while the scammer gains remote control or dictates the payment.
- Victim is instructed to type a large payment to a new personal UPI ID.
- Additional smaller payments are requested quickly, often using dictation or paste‑after‑switch.
signals:
- SAYS_GOVERNMENT
- AMT_50K_PLUS
- REMOTE_CONTROL
- SESSION_DICTATED
- NEW_PAYEE
reason_codes:
- R10_bait_then_pay
- R11_ring_link
- R12_coached_session
advice_en: If a caller claims to be a government officer and asks you to remote‑control your phone or
  type a payment, hang up and verify independently.
advice_hi: यदि कॉलर खुद को सरकारी अधिकारी बताता है और रिमोट‑कंट्रोल या भुगतान करने को कहे, तो कॉल काटें
  और स्वतंत्र रूप से सत्यापित करें।
ai_powered:
  likely: false
  why: No evidence of AI‑generated voice or deep‑fake content in the data.
confidence: high
open_questions: []
misnamed_as: null
match:
- priority: 100
  rule:
