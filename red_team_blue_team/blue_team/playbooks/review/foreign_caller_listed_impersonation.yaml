name: foreign_caller_listed_impersonation
title: Foreign Caller Listed Impersonation
status: review
summary: A foreign caller with a listed number pressures victims on a call to type a modest payment to
  a new personal UPI ID, often using bait credits and short gaps.
steps:
- Victim receives a call from an unknown foreign number that appears in caller ID (listed).
- Caller keeps the call on, often using urgency or bait credits to hold attention.
- Caller asks the victim to type a payment of modest amount (₹1,000‑₹10,000) to a new personal UPI ID.
- Victim makes the payment quickly, usually within minutes of the call.
- The payee is a newly created personal account that is part of a run of similar victims.
signals:
- CALLER_FOREIGN
- CALLER_LISTED
- CALL_ON
- ENTRY_TYPED
- AMT_1K_10K
- NEW_PAYEE
- PAYEE_IN_RUN
- PAYEE_PERSON
reason_codes:
- R1_live_unknown_call
- R6_new_payee_typed
- R7_tranche_pattern
- R8_intel_hit
advice_en: Never pay on a call from an unknown foreign number; verify the request through official channels.
advice_hi: अज्ञात विदेशी नंबर से कॉल पर भुगतान न करें; आधिकारिक चैनल से सत्यापित करें।
