    a QR code that, when scanned, results in a small payment to a new payee. This mechanism is identical
    to the known 'refund_qr' playbook. The additional signals (bait credits, episode watching, session
    hesitation) are ancillary and do not constitute a new mechanism. Therefore the cluster should be treated
    as a variant of the existing refund_qr playbook rather than a new scam.
