name: qr_bait_refund
title: QR Bait Refund Scam on Call
status: review
summary: Scammer calls, shows QR code promising a refund or reward, victim scans and pays a small amount
  to a new payee in an ongoing run.
steps:
- Scammer calls the victim (often via VoIP) and claims a pending refund, reward, or bail payment.
- Scammer displays a QR code on the screen, saying scanning it will release the money.
- Victim scans the QR code, which redirects to a UPI payment request for a small amount (<₹1,000).
- Payment is sent to a newly created payee that is part of an ongoing fraud run.
- Victim may hesitate or ask questions, but the call continues until payment is made.
signals:
- EPISODE_WATCHING
- BAIT_CREDITS
- ENTRY_QR
- AMT_UNDER_1K
- PAYEE_IN_RUN
- SESSION_HESITATION
reason_codes:
- R5_lure_message
- R7_tranche_pattern
advice_en: If a caller asks you to scan a QR code to receive a refund, verify the request through official
  channels before paying.
advice_hi: यदि कॉल करने वाला आपको रिफंड पाने के लिए QR कोड स्कैन करने को कहे, तो आधिकारिक चैनलों से पुष्टि
  करें और भुगतान न करें।
ai_powered:
  likely: false
  why: No evidence of AI‑generated voice or deep‑fake media in the tokens.
confidence: high
open_questions: []
misnamed_as: null
match:
- priority: 100
  rule:
    all:
    - feature: episode_state
      op: eq
      value: 1
    - feature: episode_bait_credits
      op: '>='
      value: 1
    - feature: entry_method
      op: eq
      value: qr
    - feature: amount_inr
      op: <
      value: 1000
    - feature: payee_in_run
      op: is
      value: true
    - any:
      - feature: session_hesitation
        op: is
        value: true
      - feature: payee_registry_listed
        op: is
        value: true
