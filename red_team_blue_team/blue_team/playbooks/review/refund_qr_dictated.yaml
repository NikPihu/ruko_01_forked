name: refund_qr_dictated
title: Dictated QR Refund Scam
status: review
summary: Scammers send a QR code claiming a refund or prize and dictate via voice or call that the victim
  should scan and pay. The victim is guided to pay an unusually large amount to a new payee, then the
  session is abandoned. The scam relies on dictation and the victim's trust in the urgent request.
steps:
- Scammer contacts victim (call or chat) claiming a refund, prize, or urgent payment.
- Scammer sends a QR code and dictating voice note instructing the victim to scan and pay.
- Victim scans the QR and pays an unusually large amount to a new payee.
- Victim leaves the app, ending the session (abandoned).
signals:
- ENTRY_QR
- AMT_UNUSUAL
- SESSION_DICTATED
- SESSION_ABANDONED
- NEW_PAYEE
- PAYEE_IN_RUN
reason_codes:
- R12_coached_session
advice_en: Do not scan QR codes or pay when instructed by a voice note or call without verifying the request
  first.
advice_hi: कॉल या आवाज़ नोट में निर्देश मिलने पर बिना जाँच के QR कोड स्कैन या भुगतान न करें।
ai_powered:
  likely: false
  why: No evidence of AI-generated voice or deepfake; scam uses simple dictation.
confidence: high
open_questions: []
misnamed_as: null
match:
- priority: 100
  rule:
    all:
    - feature: entry_method
      op: eq
      value: qr
    - feature: session_dictated
      op: is
      value: true
    - feature: session_abandoned_30m
      op: '>='
      value: 1
    - feature: first_time_payee
      op: is
      value: true
    - feature: payee_in_run
      op: is
      value: true
    - feature: amount_to_max_90d
      op: '>='
      value: 1.5
