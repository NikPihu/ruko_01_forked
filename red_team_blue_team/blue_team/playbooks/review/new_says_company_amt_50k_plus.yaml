name: new_says_company_amt_50k_plus
title: 'Unnamed pattern from 8 complaints: says company, amt 50k plus, payee listed, story mismatch, repeat
  attempts'
status: review
summary: '8 complaints from 8 users describe payments RUKO did not stop. Most share: says company, amt
  50k plus, payee listed, story mismatch, repeat attempts. Median payment Rs 7,600; 23 payee accounts.
  Drafted without an LLM: an analyst should write the story.'
steps:
- 'Complaint pattern: says company, amt 50k plus, payee listed, story mismatch, repeat attempts'
- Victim pays a new payee the scammer chose
signals:
- SAYS_COMPANY
- AMT_50K_PLUS
- PAYEE_LISTED
- STORY_MISMATCH
- REPEAT_ATTEMPTS
- SAYS_OTHER
reason_codes:
- R12_coached_session
- R8_intel_hit
advice_en: Other people reported payments like this as scams. Stop, check with someone you trust, and
  call 1930 if unsure.
advice_hi: दूसरे लोगों ने ऐसे भुगतानों को धोखा बताया है। रुकें, किसी भरोसेमंद व्यक्ति से पूछें, और शक
  हो तो 1930 पर कॉल करें।
ai_powered:
  likely: false
  why: not assessed offline
confidence: low
open_questions:
- What story did the scammer tell? (no LLM draft)
