drafted_by: offline (the apac.amazon.nova-pro-v1:0 investigator submitted no valid card in 12 turns)
analyst:
  verdict: new_scam
  nearest_playbook: trading_group
  rationale: The cluster has distinctive tokens such as 'SAYS_COMPANY', 'AMT_50K_PLUS', 'PAYEE_LISTED',
    'STORY_MISMATCH', and 'REPEAT_ATTEMPTS'. The nearest known playbook 'trading_group' has a low similarity
    of 0.502, and the cases reviewed show that the matcher is correctly identifying scam payments. Therefore,
    this appears to be a new scam mechanism.
  required_changes: null
  confidence: medium
