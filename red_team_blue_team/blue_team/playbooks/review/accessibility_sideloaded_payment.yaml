name: accessibility_sideloaded_payment
title: Accessibility‑Sideloaded App Payment Scam
status: review
summary: Victims install a sideloaded app that requests accessibility, then are prompted to type payments
  to new personal accounts, often repeated quickly.
steps:
- Victim receives a link to download a non‑Play‑Store app
- App requests accessibility permission and victim grants it
- App instructs victim to type a payment to a new personal UPI ID
- Victim makes the payment, often repeating within minutes
- Session may be abandoned or dictated, indicating pressure
signals:
- ACCESSIBILITY
- SIDELOAD
- ENTRY_TYPED
- PAYEE_IN_RUN
- PAYEE_PERSON
reason_codes:
- R6_new_payee_typed
- R7_tranche_pattern
- R3_mule_like_payee
advice_en: Do not grant accessibility to unknown apps; verify payment requests before typing.
advice_hi: अज्ञात ऐप को एक्सेसिबिलिटी अनुमति न दें; भुगतान अनुरोध की पुष्टि करें।
ai_powered:
  likely: false
  why: No evidence of AI‑generated voice or deepfake content in the data.
confidence: high
open_questions: []
misnamed_as: null
match:
- priority: 100
  rule:
    all:
    - feature: untrusted_accessibility
      op: is
      value: true
    - feature: sideloaded_last_24h
      op: is
      value: true
    - feature: entry_method
      op: eq
      value: typed
    - feature: payee_in_run
      op: is
