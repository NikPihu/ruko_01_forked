analyst:
  verdict: variant_of_known
  nearest_playbook: fake_kyc_apk
  rationale: The cluster’s core mechanism—installing a sideloaded app that requests accessibility and
    then prompting typed payments to new personal payees—matches the fake_kyc_apk playbook. The high lures‑ignored
    similarity (0.83) confirms it is a variant rather than a new scam. The main difference is the absence
    of an explicit KYC lure token, which can happen when the lure is delivered via non‑SMS channels or
    missed by the classifier. Therefore the draft should be merged into the existing fake_kyc_apk playbook
    with adjustments to the matcher to make the lure condition optional.
  required_changes:
  - Rename the playbook to indicate it is a variant of the known 'fake_kyc_apk' playbook (e.g., 'fake_kyc_apk_variant_accessibility_sideload')
  - Add a note that the KYC lure token is often missing (e.g., the SMS may be delivered via WhatsApp/Telegram
    or the classifier missed it)
  - Make the matcher’s lure condition optional (remove strict requirement for LURE_KYC) so the rule fires
    on these cases
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
  evidence:
  - source: get_candidate
    fact: signal_similarity_lures_ignored for fake_kyc_apk is 0.83, indicating strong similarity when
      lures are ignored
    seen: true
  - source: compare_with_playbook
    fact: Cluster c01 lacks the LURE_KYC token (diff -1.0) that is present in the fake_kyc_apk playbook
    seen: true
  - source: get_cluster_overview
    fact: Nearest known playbook reported is fake_kyc_apk with similarity 0.639 and the cluster’s distinctive
      tokens are ACCESSIBILITY, SIDELOAD, ENTRY_TYPED, PAYEE_IN_RUN, PAYEE_PERSON
    seen: true
  - source: test_matcher
    fact: Matcher recall is 1.0 with legit naming rate 0.11 per 1,000 and only 0.02 overlap with known
      playbook payments
    seen: false
  - source: get_candidate
