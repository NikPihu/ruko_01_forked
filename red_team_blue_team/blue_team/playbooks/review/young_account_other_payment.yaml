name: young_account_other_payment
title: Payment to a young account with payer says 'other'
status: review
summary: Victims are making payments to young accounts with the payer saying 'other'. The payments are
  typically small amounts and involve new payees.
steps:
- Victim receives a message or call from an unknown source
- Victim is instructed to make a payment to a UPI ID
- Payment is made to a young account with the payer saying 'other'
signals:
- PAYEE_YOUNG_ACCOUNT
- SAYS_OTHER
reason_codes:
- R6_new_payee_typed
- R4_unusual_amount
advice_en: Verify the reason for the payment before proceeding.
advice_hi: से पेमेंट करने की वजह से पहले से पहलें.
ai_powered:
  likely: false
  why: No evidence of AI tools.
confidence: medium
open_questions: []
