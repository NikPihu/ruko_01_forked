analyst:
  verdict: new_scam
  nearest_playbook: null
  rationale: The c18 cluster is defined by a QR code sent via chat combined with a dictation (screen‑share)
    session where the scammer verbally directs the victim to scan and pay. Known playbooks either require
    an incoming call (refund_qr, fake_customer_care, digital_arrest) or lack the dictation element (task_job,
    trading_group). Similarity scores are low (≤0.35) and token‑level comparison shows missing call tokens
    and the presence of SESSION_DICTATED, a token absent from the nearest playbooks. Therefore the mechanism
    is not captured by any existing playbook and constitutes a new scam pattern.
  required_changes: []
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
  evidence:
  - source: get_candidate
    fact: Matcher (ENTRY_QR & SESSION_DICTATED & PAYEE_IN_RUN & PAYEE_LISTED) captures all cluster cases
      with 1.0 recall and 0.004 false positives per 1k legit.
    seen: true
  - source: get_cluster_overview
    fact: Nearest known playbook similarity is 0.26 (refund_qr) and signal_similarity_lures_ignored maxes
      at 0.35, indicating low similarity to any known playbook.
    seen: true
  - source: compare_with_playbook refund_qr
    fact: Cluster lacks call-related tokens (CALL_ON, CALLER_UNKNOWN) present in refund_qr and adds SESSION_DICTATED,
      showing a different mechanism.
    seen: true
  - source: compare_with_playbook fake_customer_care
    fact: No reference cases for fake_customer_care and cluster tokens (ENTRY_QR, PAYEE_LISTED, SESSION_DICTATED)
      are not common to that playbook.
    seen: true
