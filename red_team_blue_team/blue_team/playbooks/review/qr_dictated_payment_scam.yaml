name: qr_dictated_payment_scam
title: QR Dictated Payment Scam
status: review
summary: Scammer sends a QR code via chat, then initiates a dictation session (screen‑share or remote
  control) and verbally directs the victim to scan and pay, often abandoning the call after a while.
steps:
- Scammer sends a QR code via chat (WhatsApp/Telegram).
- Victim opens a dictation or screen‑share session with the scammer.
- Scammer verbally instructs the victim to scan the QR and confirm the payment.
- Victim pays a modest amount (₹1‑5 k) to a new, listed merchant.
- Scammer often abandons the session after the payment.
signals:
- SESSION_DICTATED
- PAYEE_LISTED
- ENTRY_QR
- NEW_PAYEE
- PAYEE_IN_RUN
- AMT_1K_10K
- SESSION_ABANDONED
- LURE_KYC
reason_codes:
- R5_lure_message
- R3_mule_like_payee
advice_en: Do not follow payment instructions given during a dictation session; verify QR codes independently.
advice_hi: डिक्टेशन सत्र में दी गई भुगतान निर्देशों का पालन न करें; QR कोड को स्वतंत्र रूप से सत्यापित
  करें।
ai_powered:
  likely: false
  why: No evidence of AI‑generated voice or deepfake content in the data.
confidence: high
open_questions: []
misnamed_as: null
