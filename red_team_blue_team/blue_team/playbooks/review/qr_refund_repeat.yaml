name: qr_refund_repeat
title: Repeated QR‑code “refund” scams with abandoned sessions
status: review
summary: Victims receive a call from an unknown/VoIP number claiming a refund or prize, are sent a QR
  code, pay via the QR, the caller stays on the line, the session is later abandoned, and the scam repeats
  within minutes with the same payee.
steps:
- Victim receives an unknown or VoIP call (CALL_ON + CALLER_UNKNOWN).
- Caller claims a refund, prize or “government” payment and sends a QR code (ENTRY_QR).
- Victim scans the QR and pays the amount (AMT_1K_10K or AMT_10K_50K).
- The caller stays on the line; the session is later abandoned (SESSION_ABANDONED).
- Within minutes the caller repeats the request (REPEAT_ATTEMPTS), often with a higher amount.
signals:
- CALL_ON
- CALLER_UNKNOWN
- ENTRY_QR
- REPEAT_ATTEMPTS
- SESSION_ABANDONED
- AMT_1K_10K
- AMT_10K_50K
- NEW_PAYEE
- PAYEE_IN_RUN
reason_codes:
- R5_lure_message
- R7_tranche_pattern
- R8_intel_hit
advice_en: If a caller sends a QR code for a “refund”, hang up and verify the claim through official channels
  before paying.
advice_hi: यदि कॉलर आपको “रिफ़ंड” के लिए QR कोड भेजे, तो आधिकारिक चैनल से सत्यापित करें और भुगतान न करें।
ai_powered:
  likely: false
  why: All evidence comes from token patterns; no audio, deep‑fake voice, or chatbot indicators were observed.
confidence: high
open_questions: []
misnamed_as: digital_arrest
