analyst:
  verdict: new_scam
  nearest_playbook: refund_qr
  rationale: The cluster's mechanism—multiple QR‑code refund requests within a short window, followed
    by session abandonment—is not captured by any known playbook. Similarity scores to existing playbooks
    are well below the 0.8 threshold, and token analysis shows several distinctive features (SESSION_ABANDONED,
    REPEAT_ATTEMPTS, CALLER_LISTED) absent from both digital_arrest and refund_qr. Therefore this represents
    a new scam pattern that requires its own playbook rather than being a variant of an existing one.
  required_changes:
  - Rename the playbook from 'qr_refund_repeat' to a distinct name reflecting repeated QR refund attempts,
    e.g., 'qr_refund_repeat' is acceptable but must be linked as a new playbook rather than a variant
    of 'refund_qr'.
  - Add explicit mention of session abandonment and repeat attempts within 72 h as core steps, differentiating
    it from the existing 'refund_qr' playbook.
  - Update the matcher to require REPEAT_ATTEMPTS and SESSION_ABANDONED conditions, and ensure it does
    not fire on single‑instance refund_qr cases.
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
  evidence:
  - source: get_candidate
    fact: 'Signal similarity to known playbooks: digital_arrest 0.72, refund_qr 0.63 (both below the 0.8
      variant threshold).'
    seen: true
  - source: get_cluster_overview
    fact: Cluster m_digital_arrest_1 is misnamed as digital_arrest but its distinctive tokens are ENTRY_QR,
      SESSION_ABANDONED, REPEAT_ATTEMPTS, which do not appear in digital_arrest cases.
    seen: true
  - source: compare_with_playbook
    fact: Tokens more common in the cluster than in the 'refund_qr' playbook include CALLER_LISTED, AMT_1K_10K,
      SESSION_DICTATED, SESSION_ABANDONED, REPEAT_ATTEMPTS.
    seen: true
  - source: test_matcher
    fact: Matcher requiring CALL_ON, CALLER_UNKNOWN, ENTRY_QR, REPEAT_ATTEMPTS, SESSION_ABANDONED achieves
      0.75 case recall and only 0.009 overlap with known digital_arrest payments.
    seen: false
  - source: list_playbooks
    fact: No existing playbook describes repeated QR‑code refund scams with session abandonment; the closest
      is 'refund_qr' which lacks repeat‑attempt logic.
    seen: true
