drafted_by: openai.gpt-oss-120b-1:0
analyst:
  verdict: new_scam
  nearest_playbook: digital_arrest
  rationale: The cluster’s complaints describe an incoming call from a known‑number contact that is actually
    unknown, where the attacker dictates the amount and UPI ID, and the victim types the amount and pastes
    the ID after switching apps. Unlike the digital_arrest playbook, there is no police or authority threat,
    no remote‑control or screen‑sharing, and the victim reports the caller as "other" rather than a government
    official. The similarity score to digital_arrest (0.67) is moderate but below the 0.8 variant threshold,
    and the token analysis shows key differences. Therefore this mechanism is not captured by any existing
    playbook and should be treated as a new scam.
  required_changes:
  - Rename the playbook to reflect that the scam involves voice phishing with dictation of payment details,
    not an impersonated authority figure.
  - Update the story description to note that the caller pretends to be a personal contact or other non‑government
    entity (e.g., a friend or relative) and does not request remote‑control or screen‑sharing.
  - Add the distinctive token SAYS_OTHER and the absence of remote_control/video_call to the matcher criteria.
  confidence: high
  reviewed_by: openai.gpt-oss-120b-1:0
  evidence:
  - source: get_candidate
    fact: Signal similarity to digital_arrest is 0.67, below the 0.8 threshold for a strong variant.
    seen: true
  - source: get_cluster_overview
    fact: Cluster is misnamed digital_arrest; victims report SAYS_OTHER and CALLER_LISTED, with no remote_control
      or video call.
    seen: true
  - source: compare_with_playbook
    fact: Tokens common in digital_arrest (REMOTE_CONTROL, VIDEO_CALL, STORY_MISMATCH) are absent, while
      cluster shows CALLER_LISTED, SAYS_OTHER, ENTRY_TYPED, SESSION_PASTE_AFTER_SWITCH.
    seen: true
  - source: test_matcher
    fact: Matcher for voice_phishing_dictated_payment achieves 100% cluster recall, indicating a distinct
      pattern.
    seen: false
