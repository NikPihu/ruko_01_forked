name: voice_phishing_dictated_payment
title: Dictated payment scam via known-number call
status: review
summary: Victims get a call from a known-number caller who is actually unknown, dictating a payment to
  a new personal UPI ID; they type the amount and paste the ID after switching apps, sending money to
  a fresh payee.
steps:
- Victim receives an incoming call from a number that appears in contacts.
- Caller claims urgent need for money and dictates the amount and UPI ID.
- Victim types the amount and, after switching apps, pastes the UPI ID.
- Payment is sent to a new personal account not previously used.
signals:
- CALL_ON
- CALLER_UNKNOWN
- CALLER_LISTED
- ENTRY_TYPED
- SESSION_DICTATED
- NEW_PAYEE
- PAYEE_PERSON
reason_codes:
- R1_live_unknown_call
- R6_new_payee_typed
advice_en: Hang up and verify any request for money with the person through a trusted channel before paying.
advice_hi: कॉल काटें और पैसे भेजने से पहले भरोसेमंद माध्यम से अनुरोध की पुष्टि करें।
ai_powered:
  likely: false
  why: No evidence of AI‑generated voice or deepfake; scam uses human caller.
confidence: high
open_questions: []
misnamed_as: digital_arrest
match:
- priority: 39
  rule:
    all:
    - feature: on_call
      op: is
      value: true
    - any:
      - feature: caller_unknown
        op: is
        value: true
      - all:
        - feature: voip_call
          op: is
          value: true
        - feature: caller_unknown
          op: is_null
    - feature: caller_registry_listed
      op: is
      value: true
    - feature: entry_method
      op: eq
      value: typed
    - feature: session_dictated
      op: is
      value: true
    - feature: first_time_payee
      op: is
      value: true
    - feature: payee_holder_type
      op: eq
      value: person
