name: fake_kyc_apk
title: "'Your KYC has expired' SMS with a link to a fake bank app (APK) that steals control"
status: known
source: "rules: data/playbooks/playbooks.yaml (the engine's list); this card: the story for the agents"
summary: >
  An SMS says the bank account or SIM will be blocked unless KYC is updated, and links to an APK.
  The sideloaded app asks for accessibility or SMS permissions, then the victim is guided to pay.
steps:
  - KYC / account-block SMS with a link
  - App installed from outside the Play Store
  - Accessibility or SMS permission granted
  - Payment to a new account
reason_codes: [R5_lure_message, R2_remote_control, R6_new_payee_typed]
advice_en: "Banks never send app links for KYC. Uninstall the app you just installed and call your bank."
advice_hi: "बैंक KYC के लिए ऐप का लिंक नहीं भेजते। अभी डाला गया ऐप हटाएँ और अपने बैंक को कॉल करें।"
