<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Team Console</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1b1f24; --muted: #5d6673; --line: #e1e4e9; --side: #eef0f3;
    --accent: #2457c5; --accent-ink: #fff; --good: #1e7a46; --good-bg: #e5f4eb; --bad: #b42318; --bad-bg: #fdecea;
    --warn: #8a5a00; --warn-bg: #fff3d6; --chip: #eef1f5; --code: #f1f3f6; --dec: #eaf0ff;
    --k-new: #2a78d6; --k-known: #eb6834; --k-mis: #1baf7a; --k-none: #8b929c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111419; --panel: #191d24; --ink: #e6e9ed; --muted: #98a1ac; --line: #2a3039; --side: #151920;
      --accent: #6b9bff; --accent-ink: #0c0f15; --good: #6fd39b; --good-bg: #17321f; --bad: #ff8a80; --bad-bg: #3a1c1a;
      --warn: #f2c46b; --warn-bg: #3a2e14; --chip: #242a33; --code: #1f242c; --dec: #1c2740;
      --k-new: #3987e5; --k-known: #d95926; --k-mis: #199e70; --k-none: #7d8590;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; }
  .app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
  @media (max-width: 820px) { .app { grid-template-columns: 1fr; } nav.side { position: static !important; height: auto !important; } }
  nav.side { background: var(--side); border-right: 1px solid var(--line); padding: 14px 10px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  nav.side .brand { font-weight: 700; padding: 4px 8px 2px; } nav.side .tag { color: var(--muted); font-size: 12px; padding: 0 8px 12px; }
  nav.side a { display: flex; gap: 10px; align-items: baseline; padding: 7px 8px; border-radius: 7px; color: var(--ink); text-decoration: none; }
  nav.side a .num { color: var(--muted); font-size: 12px; width: 14px; } nav.side a .sub { display: block; color: var(--muted); font-size: 12px; }
  nav.side a:hover { background: var(--chip); } nav.side a.on { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
  nav.side .foot { border-top: 1px solid var(--line); margin-top: 12px; padding: 12px 8px 0; font-size: 12.5px; color: var(--muted); }
  .top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 20px;
         border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 3; }
  .top .ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13.5px; }
  select, input, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  textarea { width: 100%; min-height: 64px; }
  .content { padding: 18px 22px 60px; max-width: 1250px; }
  @media (max-width: 820px) { .content { padding: 14px 16px 60px; } }
  h1 { font-size: 21px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 0 0 6px; }
  .explain { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0 16px; color: var(--muted); }
  .explain b { color: var(--ink); } .explain .refs { margin-top: 6px; font-size: 12.5px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 6px; vertical-align: middle; }
  .chip { background: var(--chip); color: var(--muted); border-radius: 999px; padding: 1px 9px; font-size: 12.5px; white-space: nowrap; }
  .chip.good { background: var(--good-bg); color: var(--good); } .chip.bad { background: var(--bad-bg); color: var(--bad); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); } .chip.acc { background: var(--dec); color: var(--accent); }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  a.ref { color: var(--accent); cursor: pointer; text-decoration: none; } a.ref:hover { text-decoration: underline; }
  pre { background: var(--code); border-radius: 8px; padding: 9px 11px; overflow: auto; font-size: 12.5px; margin: 6px 0; white-space: pre-wrap; word-break: break-word; max-height: 420px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; } tr.click { cursor: pointer; } tr.click:hover td { background: var(--chip); }
  .scroll { overflow-x: auto; }
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { display: grid; grid-template-columns: 34px 92px 1fr; gap: 8px; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  .tl li.decision { background: var(--dec); } .tl li.warning, .tl li.filtered { background: var(--warn-bg); } .tl li.error { background: var(--bad-bg); }
  .tl .seq { color: var(--muted); font-size: 12px; } .tl .stage { font-size: 12px; color: var(--muted); }
  .tl .body .refs { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  details summary { cursor: pointer; color: var(--accent); font-size: 12.5px; }
  .split { display: grid; grid-template-columns: 280px 1fr; gap: 14px; }
  @media (max-width: 980px) { .split { grid-template-columns: 1fr; } }
  .pick .it { padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; } .pick .it:hover { background: var(--chip); }
  .pick .it.on { background: var(--chip); box-shadow: inset 3px 0 0 var(--accent); } .pick .it .n { font-weight: 600; }
  .turn { border-left: 3px solid var(--line); padding: 4px 0 6px 12px; margin: 10px 0; }
  .turn .h { font-size: 12px; color: var(--muted); } .turn .thought { font-style: italic; }
  .ev { list-style: none; padding: 0; margin: 6px 0; } .ev li { padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0; }
  .stat { background: var(--chip); border-radius: 8px; padding: 7px 12px; min-width: 120px; }
  .stat b { display: block; font-size: 17px; } .stat span { font-size: 12px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
  .advice { background: var(--chip); border-radius: 8px; padding: 9px 12px; } .advice .lang { font-size: 12px; color: var(--muted); }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 13px; border-radius: 7px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.danger { color: var(--bad); border-color: var(--bad); } button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .msg { padding: 9px 12px; border-radius: 8px; margin-top: 8px; } .msg.ok { background: var(--good-bg); color: var(--good); } .msg.err { background: var(--bad-bg); color: var(--bad); }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; margin-top: 6px; }
  .flow span.s { background: var(--chip); padding: 3px 9px; border-radius: 6px; } .flow span.a { color: var(--muted); }
  .viz { position: relative; } .viz svg { width: 100%; height: auto; display: block; background: var(--panel); border-radius: 8px; }
  .viz .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
              padding: 7px 10px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.15); max-width: 300px; display: none; z-index: 2; }
  .viz .tip b { display: block; } .viz .tip .m { color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); margin: 4px 0 8px; align-items: center; }
  .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .legend .sq { border-radius: 2px; } .legend .hollow { background: none !important; border: 1.5px solid var(--k-none); }
  label.f { display: block; font-size: 12.5px; color: var(--muted); margin: 8px 0 3px; }
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <div>
    <div class="top">
      <div class="ctl"><label for="runsel">Run</label><select id="runsel"></select><span id="runstate" class="chip"></span></div>
      <div class="ctl"><label for="analyst">Analyst</label><input id="analyst" size="12" placeholder="your name" autocomplete="off"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<script>
// ---------------------------------------------------------------- helpers
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k !== null && k !== undefined && k !== false) n.append(k instanceof Node ? k : String(k));
  return n;
}
// replaceChildren does not flatten lists and turns null into text: put() does both properly.
function put(node, ...kids) { node.replaceChildren(...kids.flat(Infinity).filter(k => k !== null && k !== undefined && k !== false)); return node; }
const chip = (t, k) => el("span", { class: "chip" + (k ? " " + k : "") }, t);
const pct = x => (x === null || x === undefined) ? "–" : Math.round(x * 100) + "%";
const inr = x => (x === null || x === undefined) ? "–" : "₹" + Number(x).toLocaleString("en-IN", { maximumFractionDigits: 0 });
const store = { get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json().catch(() => ({})) : await r.text();
  if (!r.ok) throw new Error((data && data.detail) || ("HTTP " + r.status));
  return data;
}
function go(page, params) { location.hash = "#/" + page + (params ? "?" + new URLSearchParams(params) : ""); }
function ref(text, page, params) { return el("a", { class: "ref", onclick: () => go(page, params) }, text); }
function caseLinks(ids, max) {
  max = max || 12; const out = [];
  (ids || []).slice(0, max).forEach((id, i) => { if (i) out.push(" "); out.push(ref(id, "complaints", { case: id })); });
  if ((ids || []).length > max) out.push(` … +${ids.length - max} more`);
  return out;
}
const VERDICT = { new_scam: "new scam", variant_of_known: "known scam, new form", lookalike_not_scam: "look-alike, not a scam", insufficient_evidence: "not enough evidence" };
const verdictChip = v => chip(VERDICT[v] || v || "–", v === "new_scam" ? "good" : v === "variant_of_known" ? "acc" : "");
const kindChip = (k, was) => k === "misnamed" ? chip("misnamed? RUKO said " + (was || "?"), "warn") : k === "new" ? chip("new pattern", "good") : chip(k || "–");
function explain(what, how, refs) {
  return el("div", { class: "explain" }, el("div", {}, el("b", {}, "What happens here: "), what),
    how ? el("div", {}, el("b", {}, "How it decides: "), how) : null,
    refs ? el("div", { class: "refs" }, "Code / config: ", refs) : null);
}
function evidenceList(ev) {
  if (!ev || !ev.length) return el("p", { class: "muted" }, "No evidence listed.");
  return el("ul", { class: "ev" }, ev.map(e => el("li", {},
    e.seen === false ? chip("source not found in its tool calls", "bad") : chip("checked", "good"), " ",
    el("span", { class: "mono" }, e.source), " — ", e.fact)));
}

// ---------------------------------------------------------------- state
const who = document.getElementById("analyst");
who.value = store.get("ruko.analyst"); who.addEventListener("input", () => store.set("ruko.analyst", who.value));
let demoTimer = null;
let runs = [], run = null, pollTimer = null, buildTimer = null, lastSeq = 0, timeline = [];
const cache = {};
async function data(kind) {
  if (!run) return null;
  const key = run + ":" + kind;
  if (!cache[key]) cache[key] = await api(`/api/runs/${run}/${kind}`);
  return cache[key];
}
async function loadRuns(select) {
  runs = await api("/api/runs");
  const sel = document.getElementById("runsel"); put(sel);
  if (!runs.length) sel.append(el("option", { value: "" }, "no runs yet"));
  for (const r of runs) sel.append(el("option", { value: r.run_id }, `${r.run_id} · ${r.state}${r.cases ? " · " + r.cases + " complaints" : ""}`));
  if (select) run = select; else if (!run || !runs.find(r => r.run_id === run)) run = runs.length ? runs[0].run_id : null;
  sel.value = run || "";
  const st = runs.find(r => r.run_id === run);
  const rs = document.getElementById("runstate");
  rs.textContent = st ? st.state + (st.agents ? " · agents: " + st.agents : "") : ""; rs.className = "chip" + (st && st.state === "done" ? " good" : st && st.state === "failed" ? " bad" : " warn");
}
document.getElementById("runsel").addEventListener("change", e => { run = e.target.value; lastSeq = 0; timeline = []; route(); loadRuns(run); });

// ---------------------------------------------------------------- sidebar
const PAGES = [
  ["demo", "Demo: the whole loop", "new scams → you approve → rerun"],
  ["redteam", "Red team", "the attacks (Nikunj's 50)"],
  ["run", "Run & timeline", "start, watch every step"],
  ["complaints", "Complaints", "where the shield broke"],
  ["hdbscan", "HDBSCAN", "grouping the breaches"],
  ["generator", "Generator agent", "investigates, drafts"],
  ["analyst", "Analyst agent", "second opinion"],
  ["playbooks", "Playbooks", "final card · human review"],
  ["database", "Playbook database", "what is stored"],
  ["scorecard", "Scorecard", "red team vs blue team"],
];
function renderSide(page) {
  const s = document.getElementById("side");
  put(s, el("div", { class: "brand" }, "RUKO blue team"), el("div", { class: "tag" }, "find the scams the shield missed"),
    PAGES.map(([k, t, sub], i) => el("a", { href: "#/" + k, class: k === page ? "on" : "" }, el("span", { class: "num" }, i === 0 ? "◆" : i), el("span", {}, t, el("span", { class: "sub" }, sub)))),
    el("div", { class: "foot" }, "Every decision links to its evidence: complaint ids, cluster ids, the agent's tool calls, and config keys in ", el("span", { class: "mono" }, "blue_team/config.yaml"), "."));
}

// ---------------------------------------------------------------- router
async function route() {
  const [p, q] = (location.hash.replace(/^#\//, "") || "run").split("?");
  const page = PAGES.find(x => x[0] === p) ? p : "run";
  const params = Object.fromEntries(new URLSearchParams(q || ""));
  renderSide(page);
  if (pollTimer && page !== "run") { clearInterval(pollTimer); pollTimer = null; }
  if (buildTimer && page !== "redteam") { clearInterval(buildTimer); buildTimer = null; }
  if (demoTimer && page !== "demo") { clearInterval(demoTimer); demoTimer = null; }
  const c = document.getElementById("content");
  put(c, el("div", { class: "empty" }, "Loading…"));
  try { put(c, ...await PAGE[page](params)); }
  catch (e) { put(c, el("div", { class: "msg err" }, e.message)); }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
const noRun = () => [el("div", { class: "empty" }, "No run selected. Start one on ", ref("Run & timeline", "run"), ".")];

const PAGE = {};

// ---------------------------------------------------------------- demo: the whole loop (scenario.py)
PAGE.demo = async () => {
  const d = await api("/api/scenario");
  const sc = d.scenario || {}, set = d.settings, step = sc.step || "none";
  const order = ["world", "round1", "review", "round2", "done"];
  const at = order.indexOf(step);
  const stepChip = (i, now) => (d.running && order[i] === step) ? chip("running", "warn")
    : (step === "done" || at > i) ? chip("done", "good") : at === i ? chip(now || "now", "warn") : chip("waiting");
  const msg = el("div");
  const act = async (path, body) => {
    try { await api(path, body || {}); put(msg); route(); } catch (e) { put(msg, el("div", { class: "msg err" }, e.message)); }
  };
  const llm = el("select", {}, el("option", { value: "auto" }, "agents: Bedrock if available, else offline"),
    el("option", { value: "bedrock" }, "agents: Bedrock only"), el("option", { value: "offline" }, "agents: offline"));
  const startBtn = el("button", { class: "primary", disabled: (!d.mode || d.running) ? "disabled" : null, onclick: () => {
    if (sc.step && !confirm("Start a new demo? The current demo world, its drafts and approvals are deleted (your real playbook database is not touched).")) return;
    act("/api/scenario/start", { llm: llm.value });
  } }, sc.step ? "Start a new demo" : "Start the demo");
  const rerunBtn = el("button", { class: "primary", disabled: (!d.mode || d.running || !d.approved.length) ? "disabled" : null,
    onclick: () => act("/api/scenario/rerun") }, "Rerun the same payments with the approved playbooks");
  const redraftBtn = el("button", { disabled: (!d.mode || d.running || !sc.before) ? "disabled" : null,
    onclick: () => act("/api/scenario/redraft", { llm: llm.value }) }, "Redraft (blue team again on the same complaints)");

  let table = el("p", { style: "color:var(--muted)" }, "No payments yet.");
  if (sc.before) {
    const types = Object.keys(sc.before.types).sort((a, b) => (sc.new.includes(b) - sc.new.includes(a)) || a.localeCompare(b));
    const cell = x => x ? `${x.interrupted}/${x.payments}` : "–";
    const result = x => x.interrupted === 0 ? chip("got through", "bad")
      : x.interrupted === x.payments ? chip("all stopped", "good") : chip(`${pct(x.interrupted / x.payments)} stopped`, "warn");
    table = el("table", {},
      el("tr", {}, ["scam type", "", "scam payments", "stopped (T2+) in round 1", "after your approval", "named as", "result"].map(h => el("th", {}, h))),
      types.map(k => {
        const b = sc.before.types[k], a = sc.after ? sc.after.types[k] : null;
        return [el("tr", {}, el("td", { class: "mono" }, k), el("td", {}, sc.new.includes(k) ? chip("new to RUKO", "acc") : chip("known")),
          el("td", {}, b.payments), el("td", {}, cell(b)), el("td", {}, a ? cell(a) : "–"),
          el("td", {}, Object.entries((a || b).named_as).map(([n, c]) => `${n} ${c}`).join(", ") || "–"), el("td", {}, result(a || b))),
          Object.keys((a || b).missed_because || {}).length ? el("tr", {}, el("td", {}), el("td", { colspan: 6, style: "font-size:12.5px;color:var(--muted)" },
            "not stopped: ", Object.entries((a || b).missed_because).map(([w, n]) => `${n} × ${w}`).join(" · "))) : null];
      }),
      el("tr", {}, el("td", { colspan: 3 }, el("b", {}, "honest payments interrupted per 1,000")),
        el("td", {}, sc.before.honest_interrupted_per_1000), el("td", {}, sc.after ? sc.after.honest_interrupted_per_1000 : "–"),
        el("td", { colspan: 2 }, `${sc.before.honest_payments.toLocaleString()} honest payments`)));
  }

  const steps = el("ol", {},
    el("li", {}, stepChip(0), " ", el("b", {}, "A world where two new scams and three known ones attack"),
      ` — ${set.users} users × ${set.days} days. New to RUKO (Nikunj's red team): ${set.new.join(", ")}. Known: ${set.known.join(", ")}.`),
    el("li", {}, stepChip(1), " ", el("b", {}, "Round 1: every payment through the real engine"),
      ", as the phone sends it (Nikunj's record stream). The table shows what got through."),
    el("li", {}, stepChip(2, "your turn"), " ", el("b", {}, "The blue team learns from the victims' complaints: "),
      sc.run_id ? [ref("timeline", "run"), " → ", ref("HDBSCAN groups", "hdbscan"), " → ", ref("generator agent", "generator"), " → ",
                   ref("analyst agent", "analyst"), ` (agents: ${sc.agents || "?"})`] : "not yet",
      el("div", { style: "margin-top:6px" }, el("b", {}, "You authorise: "), "open ", ref("Playbooks", "playbooks"),
        " and approve each playbook with two different analyst names (type a name at the top right, Approve, change the name, Approve again). ",
        `${d.queued.length} waiting · ${d.approved.length} approved · ${d.rejected.length} rejected.`),
      d.drafts.length ? el("ul", { style: "font-size:13px;margin:6px 0" }, d.drafts.map(x => el("li", {}, el("span", { class: "mono" }, x.name), " ",
        x.gate_failures.length ? [chip("cannot be approved", "bad"), " ", x.gate_failures.join("; "),
          " — no rule over what RUKO measures separates these payments from honest ones; it needs a new signal"]
          : [chip("ready for your approval", "good"), " ", x.warns ? chip(`warns (${x.families.join("+")})`, "good") : chip("names only (one family)", "warn"),
             ` names ${pct(x.recall)} of its complaints`]))) : null,
      d.approved.length ? el("div", { class: "mono", style: "font-size:12.5px" }, "approved: " + d.approved.join(", ")) : null,
      el("div", { style: "margin-top:6px" }, redraftBtn)),
    el("li", {}, stepChip(3), " ", el("b", {}, "Round 2: the same payments again"),
      ", the engine's playbook file now holding your approved playbooks. One whose conditions span two signal families lifts its payments to a warning (T2), even when the model scored them low. ",
      rerunBtn));

  const logBox = el("pre", { style: "max-height:260px" }, d.log.join("\n") || "no log yet");
  if (d.running) {
    if (demoTimer) clearInterval(demoTimer);
    demoTimer = setInterval(async () => {
      try {
        const s = await api("/api/scenario");
        if (s.scenario.run_id && !runs.some(r => r.run_id === s.scenario.run_id)) await loadRuns(s.scenario.run_id);
        if (!s.running) { clearInterval(demoTimer); demoTimer = null; route(); } else { logBox.textContent = s.log.join("\n"); }
      } catch (e) { /* server restarting */ }
    }, 3000);
  }

    explain(["Two scams RUKO has never seen get through; three known ones are caught. Victims complain; the blue team groups the complaints, the ",

// ---------------------------------------------------------------- map (scatter)
const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs) { const n = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v); return n; }
// points: [{case_id, x, y, group, strength}] in 0..1; kindOf(group) -> "new" | "known" | "misnamed" | null
function scatter(points, kindOf, caseById, title) {
  const W = 640, H = 400, P = 26;
  const X = x => P + x * (W - 2 * P), Y = y => P + (1 - y) * (H - 2 * P);
  const color = k => k === "new" ? "var(--k-new)" : k === "known" ? "var(--k-known)" : k === "misnamed" ? "var(--k-mis)" : "var(--k-none)";
  const box = el("div", { class: "viz" });
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": title });
  const tip = el("div", { class: "tip" });
  const marks = [];
  let hl = null;   // set once the outlines exist
  const highlight = g => { marks.forEach(m => { m.node.style.opacity = !g || m.p.group === g ? m.base : 0.12; }); if (hl) hl(g); };

    node.setAttribute("stroke-width", filled ? 1.5 : 1.5);
    const base = filled ? 0.5 + 0.5 * (p.strength || 0) : 0.9;
    node.style.opacity = base; node.style.cursor = "pointer"; node.style.transition = "opacity .12s";
    // a bigger, invisible hit target than the mark
    const hit = svg("circle", { cx, cy, r: 9, fill: "transparent" }); hit.style.cursor = "pointer";
    const enter = ev => {
      highlight(p.group);
      put(tip, el("b", {}, p.case_id), el("div", {}, p.group ? `group ${p.group}` : "one-off (noise)", c.status ? ` · ${c.status}` : ""),
        c.max_tier ? el("div", { class: "m" }, `RUKO: ${c.max_tier}${c.named && c.named.length ? " · " + c.named.join(", ") : ""} · lost ${inr(c.total_inr)}`) : null,
        p.group ? el("div", { class: "m" }, `membership strength ${Math.round((p.strength || 0) * 100)}%`) : null,
        c.payments ? el("div", { class: "m" }, (c.payments[0].signals || []).slice(0, 7).join(" ")) : null);
      tip.style.display = "block";
      const r2 = box.getBoundingClientRect(), sx = r2.width / W;
      let left = cx * sx + 12, top = cy * sx + 12;
      if (left + 300 > r2.width) left = cx * sx - 312;
      tip.style.left = Math.max(0, left) + "px"; tip.style.top = top + "px";
    };
    const leave = () => { highlight(null); tip.style.display = "none"; };
    for (const n of [node, hit]) { n.addEventListener("mouseenter", enter); n.addEventListener("mouseleave", leave); n.addEventListener("click", () => go("complaints", { case: p.case_id })); }
    s.append(node, hit);
    marks.push({ node, p, base });
  }

  const groups = {};
  for (const p of points) if (p.group) (groups[p.group] = groups[p.group] || []).push(p);
  // a faint outline around each group's dots (convex hull), drawn under the dots: membership by shape
  const hullOf = pts => {
    const q = pts.map(p => [X(p.x), Y(p.y)]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const half = arr => { const h = []; for (const p of arr) { while (h.length >= 2 && cross(h[h.length - 2], h[h.length - 1], p) <= 0) h.pop(); h.push(p); } h.pop(); return h; };
    return q.length < 3 ? q : half(q).concat(half(q.slice().reverse()));
  };

  for (const [g, ps] of Object.entries(groups)) {
    const k = kindOf(g);
    if (!k || ps.length < 2) continue;
    const h = hullOf(ps);
    const shape = h.length >= 3 ? svg("polygon", { points: h.map(p => p.join(",")).join(" ") })
                                : svg("line", { x1: h[0][0], y1: h[0][1], x2: h[h.length - 1][0], y2: h[h.length - 1][1] });
    shape.setAttribute("fill", color(k)); shape.setAttribute("fill-opacity", 0.07);
    shape.setAttribute("stroke", color(k)); shape.setAttribute("stroke-opacity", 0.35);
    shape.setAttribute("stroke-width", 10); shape.setAttribute("stroke-linejoin", "round"); shape.setAttribute("stroke-linecap", "round");

  hl = g => hulls.forEach(h => { h.shape.style.opacity = !g || h.g === g ? 1 : 0.15; });
  for (const [g, ps] of Object.entries(groups)) {
    const mx = ps.reduce((a, p) => a + p.x, 0) / ps.length, my = ps.reduce((a, p) => a + p.y, 0) / ps.length;
    const label = svg("text", { x: X(mx), y: Y(my) - 10, "text-anchor": "middle", "font-size": 12, "font-weight": 600,
      fill: "var(--ink)", stroke: "var(--panel)", "stroke-width": 3, "paint-order": "stroke" });
    label.textContent = g.replace(/^m_[a-z_]+?_(\d+)$/, "m$1").replace(/: fits$/, "");
    label.style.cursor = "pointer";
    label.addEventListener("mouseenter", () => highlight(g)); label.addEventListener("mouseleave", () => highlight(null));
    label.addEventListener("click", () => { const n = document.getElementById("g-" + g); if (n) n.scrollIntoView({ block: "center" }); });
    s.append(label);
  }

}

  const workers = el("input", { size: 3, value: r.workers }), users = el("input", { size: 5, placeholder: "300" }), victims = el("input", { size: 4, placeholder: "20" });
  const rerun = el("input", { type: "checkbox" });
  const rState = el("div", { class: "row" }), rLog = el("pre", { style: "max-height:220px" }), rMsg = el("div");
  const verdictBox = el("div", { class: "scroll" }), inboxStats = el("div", { class: "stats" });
  const drawRunner = s => {
    const todo = s.total - s.skipped;
    put(rState, chip(s.state, s.state === "done" ? "good" : s.state === "running" ? "warn" : s.state === "stopped" ? "bad" : ""),
      s.total ? el("span", {}, ` ${s.done}/${todo} judged this time` + (s.skipped ? `, ${s.skipped} already in the inbox` : "")) : null,
      s.running.length ? el("span", { style: "color:var(--muted)" }, " · now: " + s.running.join(", ")) : null,
      s.stopping ? chip("stopping after the running ones", "warn") : null);
    rLog.textContent = s.log.join("\n") || "no red-team run yet";
    const vs = Object.values(s.verdicts);
    put(inboxStats,
      el("div", { class: "stat" }, el("b", {}, vs.length), el("span", {}, "playbooks judged by the runner")),
      el("div", { class: "stat" }, el("b", {}, s.breakthroughs.length), el("span", {}, "breakthroughs in the blue-team inbox")),
      el("div", { class: "stat" }, el("b", {}, vs.length ? pct(vs.reduce((a, v) => a + v.scam_called_normal, 0) / Math.max(1, vs.reduce((a, v) => a + v.scam_payments_judged, 0))) : "–"), el("span", {}, "of their scam payments RUKO called normal")));
    const tech = Object.fromEntries(d.playbooks.map(pb => [pb.name, pb.techniques]));
    put(verdictBox, vs.length ? el("table", {}, el("tr", {}, ["playbook", "verdict", "scam payments called normal", "false alarms on honest payments", "tricks"].map(h => el("th", {}, h))),
      vs.sort((a, b) => b.miss_rate - a.miss_rate).map(v => el("tr", {}, el("td", { class: "mono" }, v.playbook),
        el("td", {}, v.breakthrough ? chip("breakthrough → blue team", "bad") : chip("caught", "good")),
        el("td", {}, `${v.scam_called_normal}/${v.scam_payments_judged} (${pct(v.miss_rate)})`),
        el("td", {}, `${v.normal_flagged}/${v.normal_payments_judged} (${(100 * v.false_alarm_rate).toFixed(1)}%)`),
        el("td", {}, el("span", { class: "chips" }, (tech[v.playbook] || []).map(x => chip(TECH_SHORT[x] || x)))))))
      : el("div", { class: "empty" }, "Nothing judged yet."));
  };
  drawRunner(r);
  const startRunner = el("button", { class: "primary", onclick: async () => {
    try {
      const body = { playbooks: setSel.value, workers: Number(workers.value) || null, rerun: rerun.checked };
      if (users.value) body.users = Number(users.value); if (victims.value) body.victims = Number(victims.value);
      drawRunner(await api("/api/redteam/runner", body)); put(rMsg); poll();
    } catch (e) { put(rMsg, el("div", { class: "msg err" }, e.message)); }
  } }, "Run the red team");
  const stopRunner = el("button", { class: "danger", onclick: async () => { drawRunner(await api("/api/redteam/runner/stop", {})); } }, "Stop");

  // ---- step 2: the attack world from the breakthroughs
  const inputs = { users: el("input", { size: 6, value: df.users }), days: el("input", { size: 4, value: df.days }),
                   victim_rate: el("input", { size: 4, value: df.victim_rate }), red_boost: el("input", { size: 4, value: df.red_boost }) };
  const srcSel = el("select", {}, el("option", { value: "breakthroughs" }, "only the breakthroughs in the inbox"), el("option", { value: "all" }, "all 50 red-team playbooks"));
  const bState = el("div", { class: "row" }), bLog = el("pre", { style: "max-height:220px" }), bMsg = el("div");
  const drawBuild = s => {
    put(bState, chip(s.state, s.state === "done" ? "good" : s.state === "failed" ? "bad" : s.state === "running" ? "warn" : ""), s.step ? el("span", {}, " " + s.step) : null);
    bLog.textContent = (s.log || []).join("\n") || "no build yet";
  };
  drawBuild(d.build);
  const startBuild = el("button", { class: "primary", onclick: async () => {
    try {
      const body = { source: srcSel.value }; for (const [k, i] of Object.entries(inputs)) body[k] = Number(i.value);
      drawBuild(await api("/api/redteam/build", body)); put(bMsg); poll();
    } catch (e) { put(bMsg, el("div", { class: "msg err" }, e.message)); }
  } }, "Build the attack world");

  const poll = () => {
    if (buildTimer) clearInterval(buildTimer);
    buildTimer = setInterval(async () => {
      try {
        const [rs, bs] = await Promise.all([api("/api/redteam/runner"), api("/api/redteam/build")]);
        drawRunner(rs); drawBuild(bs);
        if (rs.state !== "running" && bs.state !== "running") { clearInterval(buildTimer); buildTimer = null; if (bs.state === "done") route(); }
      } catch (e) { /* server restarting */ }
    }, 2500);
  };
  if (r.state === "running" || d.build.state === "running") poll();

  // ---- the playbooks
  let open = p.pb || null;
  const table = el("table", {});
  const drawTable = () => {
    put(table, el("tr", {}, ["playbook", "what it pretends to be", "evasion tricks (read from its script)", "runner: called normal", "Nikunj's claim"].map(h => el("th", {}, h))),
      d.playbooks.map(pb => { const v = r.verdicts[pb.name]; return [el("tr", { class: "click", onclick: () => { open = open === pb.name ? null : pb.name; drawTable(); } },
        el("td", { class: "mono" }, pb.name), el("td", {}, pb.title), el("td", {}, el("span", { class: "chips" }, pb.techniques.map(x => chip(TECH_SHORT[x] || x)))),
        el("td", {}, v ? [pct(v.miss_rate), " ", v.breakthrough ? chip("breakthrough", "bad") : chip("caught", "good")] : "not run yet"),
        el("td", {}, pb.claimed_ml_missed === null ? "–" : pct(pb.claimed_ml_missed))),
        open === pb.name ? el("tr", {}, el("td", { colspan: 5 },
          el("div", { style: "font-size:12.5px;color:var(--muted)" }, `weight ${pb.weight} · mule slots ${(pb.mules || {}).slots ?? "default"} · mule kinds ${JSON.stringify(pb.mule_kinds || {})} · red_team/playbooks/${pb.file}`),
          el("ol", {}, pb.steps_detail.map(s => el("li", {}, el("b", {}, s.id), " — ", stepText(s)))))) : null]; }));
  };
  drawTable();

  return [el("h1", {}, "Red team: the attacks"),
    explain(["Nikunj's ", el("b", {}, "red-team runner"), " (", el("span", { class: "mono" }, "synthetic_playbook/interface_script"), ") plays each scam playbook against the ", el("b", {}, "real RUKO engine"),
             " in its own small world and judges every reply: a threat score of 70 or less is RUKO calling the payment normal. If 75% of a playbook's scam payments come back normal, it is a ",
             el("b", {}, "breakthrough"), ", and his blue-team sink drops it into this team's inbox."],
      ["Then the blue team builds ", el("b", {}, "one attack world"), " where all the breakthroughs run at once (as in real life), replays it through RUKO, and works only from the victims' complaints: Complaints → HDBSCAN → agents → humans. The playbooks are data, never executed; the tricks below are read from each script."],
      [el("span", { class: "mono" }, "interface_script (judge.py, sinks.py) · blue_team/inbox.py · redteam.py")]),
    el("div", { class: "flow" }, ["Red-team playbooks", "Nikunj's runner vs RUKO", "Breakthroughs → inbox", "Attack world + replay", "Blue-team run", "Scorecard"]
      .flatMap((s, i) => i ? [el("span", { class: "a" }, "→"), el("span", { class: "s" }, s)] : [el("span", { class: "s" }, s)])),
    el("div", { class: "card" }, el("h2", {}, "1 · Run the red team (Nikunj's runner against the real engine)"),
      el("p", { style: "color:var(--muted);font-size:13px" }, "Each playbook takes about 4 minutes in its own 300-user world; several run at once. Playbooks already in the inbox are skipped unless you tick re-run, so you can stop and continue later."),
      el("div", { class: "row" }, setSel, "at a time", workers, "users", users, "victims", victims, el("label", {}, rerun, " re-run judged ones"), startRunner, stopRunner),
      rMsg, rState, rLog),
    el("div", { class: "card" }, el("h2", {}, "2 · The blue-team inbox"), inboxStats, verdictBox),
    el("div", { class: "card" }, el("h2", {}, "3 · Build the attack world"),
      w.built ? el("p", {}, chip("built", "good"), ` from ${w.meta.source === "all" ? "all" : (w.meta.red_team || []).length} red-team playbooks: ${w.meta.users} users × ${w.meta.days} days, ${w.journeys} scam journeys, ${w.red_journeys} by the red team (${w.red_types} playbooks), ${w.red_paid} victims paid, ${w.red_reported} reported. `,
                       w.replayed ? chip("replayed through RUKO", "good") : chip("not replayed yet", "warn"))
              : el("p", {}, chip("not built", "warn")),
      el("div", { class: "row" }, "attack with", srcSel, "users", inputs.users, "days", inputs.days, "victim rate", inputs.victim_rate, "red weight ×", inputs.red_boost, startBuild),
      bMsg, bState, bLog,
      w.replayed ? el("p", {}, "Next: ", ref("start a blue-team run on the red-team world", "run"), ", then the ", ref("Scorecard", "scorecard"), ".") : null),
    el("div", { class: "stats" }, Object.entries(d.techniques).map(([k, v]) => el("div", { class: "stat", title: v }, el("b", {}, techCount[k] || 0), el("span", {}, TECH_SHORT[k] + " — " + v)))),
    el("div", { class: "card scroll" }, el("h2", {}, "The red-team playbooks (click one for its script)"), table)];
};

// ---------------------------------------------------------------- scorecard
PAGE.scorecard = async () => {
  if (!run) return noRun();
  const st = runs.find(r => r.run_id === run) || {};
  let s;
  try { s = await api(`/api/runs/${run}/scorecard`); }
  catch (e) { return [el("h1", {}, "Scorecard"), el("div", { class: "msg err" }, e.message)]; }
  if (s.error) return [el("h1", {}, "Scorecard"), el("div", { class: "msg err" }, s.error)];
  const sm = s.summary, rows = s.rows.slice().sort((a, b) => (b.red_team - a.red_team) || (b.complaints - a.complaints));
  const outcome = r => r.blue_team === "drafted" ? chip("playbook drafted", "good") : r.blue_team === "grouped" ? chip("grouped, not majority", "acc")
    : r.blue_team === "complaints, no group" ? chip("one-off complaints", "warn") : chip("no complaint yet");
  const t = el("table", {}, el("tr", {}, ["playbook", "journeys", "scam payments", "RUKO interrupted (in the attack world)", "runner: called normal (alone)", "complaints (missed / unnamed / held)", "blue team", "drafted playbook · analyst verdict"].map(h => el("th", {}, h))),
    rows.map(r => el("tr", {},
      el("td", {}, el("span", { class: "mono" }, r.playbook), r.red_team ? null : el("div", { style: "font-size:12px;color:var(--muted)" }, "known to RUKO (baseline)")),
      el("td", {}, r.journeys), el("td", {}, r.scam_payments),
      el("td", {}, r.ruko_interrupted === null ? "–" : pct(r.ruko_interrupted), Object.keys(r.ruko_named).length ? el("div", { style: "font-size:12px;color:var(--muted)" }, "named: " + Object.entries(r.ruko_named).map(([k, v]) => `${k} ×${v}`).join(", ")) : null),
      el("td", {}, r.runner ? [pct(r.runner.miss_rate), " ", r.runner.breakthrough ? chip("breakthrough", "bad") : chip("caught", "good")]
                            : r.red_team && r.claimed !== null && r.claimed !== undefined ? `claim ${pct(r.claimed)}` : "–"),
      el("td", {}, r.complaints ? `${r.complaints} (${r.status.missed || 0} / ${r.status.unnamed || 0} / ${r.status.held || 0})` : "0"),
      el("td", {}, outcome(r), r.groups.length ? el("div", { style: "font-size:12px" }, r.groups.slice(0, 3).map((g, i) => [i ? ", " : "", ref(g.group, "hdbscan", { c: g.group }), ` (${g.complaints})`])) : null),
      el("td", {}, r.drafted.length ? r.drafted.map(dd => el("div", {}, ref(dd.playbook, "playbooks", { name: dd.playbook }), " · ", verdictChip(dd.verdict))) : "–"))));
  return [el("h1", {}, "Scorecard: red team vs blue team"),
    explain(["For every scam playbook in run ", el("span", { class: "mono" }, run), "'s world: how many of its scam payments RUKO interrupted, how many victims complained and where those complaints went, and whether the blue team drafted a playbook for a group it dominates."],
      ["This page is the only one that uses the simulator's ", el("b", {}, "answer key"), " (which journey ran which playbook), to grade the run. The pipeline itself never sees it (CLAUDE.md rule 9). A red-team playbook counts as caught when it is the majority of a group the agents drafted a playbook for."],
      [el("span", { class: "mono" }, "redteam.scorecard() · runs/<id>/payment_tiers.parquet")]),
    s.is_red_world ? el("div", { class: "stats" },
      el("div", { class: "stat" }, el("b", {}, `${sm.red_with_journeys}/${sm.red_playbooks}`), el("span", {}, "red-team playbooks that attacked")),
      el("div", { class: "stat" }, el("b", {}, pct(sm.red_ruko_interrupted)), el("span", {}, `of ${sm.red_scam_payments} red-team scam payments RUKO interrupted`)),
      el("div", { class: "stat" }, el("b", {}, sm.red_with_complaints), el("span", {}, "red-team playbooks with complaints")),
      el("div", { class: "stat" }, el("b", {}, sm.red_grouped), el("span", {}, "of them grouped by HDBSCAN")),
      el("div", { class: "stat" }, el("b", {}, sm.red_drafted), el("span", {}, "got a drafted playbook")),
      el("div", { class: "stat" }, el("b", {}, sm.red_drafted_new_scam), el("span", {}, "of those judged a new scam by the analyst")))
      : el("div", { class: "msg err" }, "This run's world is not the red-team world: rows are sim_v2's own scam types. Start a run on the red-team world for the red-team grades."),
    el("p", { style: "color:var(--muted);font-size:13px" }, `World: ${st.world || "?"}. Complaints arrive days after the scam, so short worlds leave many playbooks without enough complaints to group: that limit is the data's, not the blue team's.`),
    el("div", { class: "card scroll" }, t)];
};

// ---------------------------------------------------------------- go
(async () => {
  try { await loadRuns(); } catch (e) { /* the server is starting or stopped: the page says so below */ }
  route();
  setInterval(() => loadRuns(run).catch(() => {}), 10000);
})();
</script>
</body>
</html>
