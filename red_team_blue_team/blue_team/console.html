<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUKO Analyst Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D0F12; --panel: #14171C; --raise: #1A1E24; --sunk: #101317; --line: #22262D; --line2: #2C313A; --rowline: #1D2127;
    --ink: #E7E9EC; --ink2: #C9CED5; --muted: #8C939E; --dim: #3A404A;
    --accent: #F2A93B; --accent-ink: #0D0F12; --good: #5CC9A0; --bad: #F0828C; --warn: #F2A93B; --info: #6CA6F5;
    --good-bg: rgba(92,201,160,.10); --bad-bg: rgba(240,130,140,.10); --warn-bg: rgba(242,169,59,.10); --info-bg: rgba(108,166,245,.10);
    --k-new: #6CA6F5; --k-known: #F2A93B; --k-mis: #5CC9A0; --k-none: #6B7380;
    --sans: Inter, system-ui, "Segoe UI", Roboto, sans-serif; --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
  .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; } nav.side { position: static !important; height: auto !important; } }

  nav.side { border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
  nav.side .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 22px; }
  nav.side .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  nav.side .brand b { display: block; font-size: 14px; letter-spacing: .2px; } nav.side .brand span { display: block; font-size: 12px; color: var(--muted); }
  nav.side a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px; color: #AEB4BD; text-decoration: none; }
  nav.side a:hover { background: var(--raise); color: var(--ink); } nav.side a.on { background: var(--raise); color: var(--ink); font-weight: 500; }
  nav.side a svg { flex: none; }
  nav.side a .n { margin-left: auto; font: 12px var(--mono); color: var(--muted); }
  nav.side a .n.hot { color: var(--accent-ink); background: var(--accent); border-radius: 10px; padding: 1px 7px; }
  nav.side .group { font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); padding: 18px 10px 6px; }
  nav.side a.small { padding: 7px 10px; font-size: 13px; }
  nav.side .foot { margin-top: auto; padding: 14px 10px 4px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
  nav.side .foot .mono { color: var(--ink2); font-size: 12px; }

  .top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: flex-end; padding: 12px 36px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 3; background: var(--bg); }
  .top .ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  select, input, textarea { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; min-height: 36px; }
  select:focus, input:focus, textarea:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea { width: 100%; min-height: 64px; background: var(--sunk); }
  .content { padding: 28px 36px 60px; max-width: 1320px; display: flex; flex-direction: column; gap: 18px; }
  @media (max-width: 860px) { .content, .top { padding-left: 16px; padding-right: 16px; } }
  h1 { font-size: 22px; font-weight: 600; margin: 0; } h2 { font-size: 13px; font-weight: 600; margin: 0 0 12px; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; } .head .acts { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .explain, .flow { display: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
  .card.flush { padding: 0; overflow: hidden; } .card.flush > h2 { padding: 16px 20px; margin: 0; border-bottom: 1px solid var(--line); }
  .card.alert { background: #1C1416; border-color: #3A2A2E; } .card.okay { background: #121C18; border-color: #24392F; }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 6px; vertical-align: middle; }
  .chip { background: var(--raise); color: var(--ink2); border: 1px solid var(--line2); border-radius: 6px; padding: 1px 8px; font-size: 12px; white-space: nowrap; }
  .chip.good { background: var(--good-bg); color: var(--good); border-color: transparent; } .chip.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
  .chip.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; } .chip.acc { background: var(--info-bg); color: var(--info); border-color: transparent; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .muted { color: var(--muted); } .good { color: var(--good); } .bad { color: var(--bad); } .accent { color: var(--accent); }
  a.ref { color: var(--accent); cursor: pointer; text-decoration: none; } a.ref:hover { text-decoration: underline; }
  pre { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow: auto; font: 12px/1.5 var(--mono); margin: 8px 0; white-space: pre-wrap; word-break: break-word; max-height: 420px; color: var(--ink2); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 11px 12px; border-top: 1px solid var(--rowline); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; border-top: 0; } td.num, th.num { text-align: right; font-family: var(--mono); }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--raise); }
  .card.flush table th:first-child, .card.flush table td:first-child { padding-left: 20px; } .card.flush table th:last-child, .card.flush table td:last-child { padding-right: 20px; }
  .scroll { overflow-x: auto; }
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { display: grid; grid-template-columns: 34px 92px 1fr; gap: 10px; padding: 10px 6px; border-top: 1px solid var(--rowline); }
  .tl li.decision .body { color: var(--ink); } .tl li.warning .stage, .tl li.filtered .stage { color: var(--warn); } .tl li.error .stage { color: var(--bad); }
  .tl .seq { color: var(--muted); font: 12px var(--mono); } .tl .stage { font-size: 12px; color: var(--muted); }
  .tl .body { color: var(--ink2); } .tl .body .refs { font-size: 12px; color: var(--muted); margin-top: 3px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; } details summary:hover { color: var(--ink); }
  .split { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .split { grid-template-columns: 1fr; } }
  .pick { padding: 0; overflow: hidden; } .pick .it { padding: 12px 16px; border-top: 1px solid var(--rowline); cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
  .pick .it:first-child { border-top: 0; } .pick .it:hover { background: var(--raise); } .pick .it.on { background: var(--raise); box-shadow: inset 2px 0 0 var(--accent); }
  .pick .it .n { font: 12.5px var(--mono); }
  .turn { border-left: 2px solid var(--line2); padding: 4px 0 6px 12px; margin: 10px 0; }
  .turn .h { font-size: 12px; color: var(--muted); } .turn .thought { font-style: italic; color: var(--ink2); }
  .ev { list-style: none; padding: 0; margin: 0; } .ev li { padding: 8px 0; border-top: 1px solid var(--rowline); color: var(--ink2); } .ev li:first-child { border-top: 0; }
  .stats, .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 0; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column-reverse; justify-content: flex-end; gap: 6px; min-width: 0; }
  .stat b { display: block; font: 500 24px/1.2 var(--mono); } .stat span { font-size: 12px; color: var(--muted); }
  .stat small { font-size: 12px; color: var(--muted); order: -1; }
  .card .stats .stat { background: var(--sunk); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
  .advice { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; line-height: 1.55; } .advice .lang { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .advice.hi { font-family: "Noto Sans Devanagari", var(--sans); }
  button { font: inherit; font-size: 13px; border: 1px solid var(--line2); background: transparent; color: var(--ink); padding: 0 16px; min-height: 36px; border-radius: 8px; cursor: pointer; }
  button:hover { background: var(--raise); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; } button.primary:hover { filter: brightness(1.06); }
  button.danger { color: var(--bad); border-color: #3A2A2E; } button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .msg { padding: 10px 12px; border-radius: 8px; margin-top: 8px; font-size: 13px; } .msg.ok { background: var(--good-bg); color: var(--good); } .msg.err { background: var(--bad-bg); color: var(--bad); }
  .empty { color: var(--muted); padding: 32px; text-align: center; }
  .viz { position: relative; } .viz svg { width: 100%; height: auto; display: block; background: var(--sunk); border-radius: 8px; }
  .viz .tip { position: absolute; pointer-events: none; background: var(--raise); border: 1px solid var(--line2); border-radius: 8px;
              padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 18px rgba(0,0,0,.4); max-width: 300px; display: none; z-index: 2; }
  .viz .tip b { display: block; } .viz .tip .m { color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin: 0 0 10px; align-items: center; }
  .legend .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .legend .sq { border-radius: 2px; } .legend .hollow { background: none !important; border: 1.5px solid var(--k-none); }
  label.f { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .pipe { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  @media (max-width: 860px) { .pipe { grid-template-columns: 1fr 1fr; gap: 14px; } }
  .pipe > div { display: flex; flex-direction: column; gap: 8px; padding-right: 12px; } .pipe .bar { height: 4px; border-radius: 2px; background: #5A6270; }
  .pipe .bar.on { background: var(--accent); } .pipe span { font-size: 12px; color: var(--muted); } .pipe b { font: 400 14px var(--mono); }
  .rule { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; } .rule .leaf { font: 12.5px var(--mono); background: var(--raise); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 10px; }
  .rule .or { font-size: 12px; color: var(--muted); } .rule .grp { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; border: 1px dashed var(--line2); border-radius: 8px; padding: 5px; }
  .bars { display: grid; grid-template-columns: 130px 1fr 32px; gap: 10px; align-items: center; font-size: 12px; }
  .bars .t { height: 6px; border-radius: 3px; background: var(--line2); } .bars .t > i { display: block; height: 6px; border-radius: 3px; background: #9AA1AB; }
  .cols { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; } .cols > .main { flex: 999 1 540px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .cols > .side { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .signer { display: flex; align-items: center; gap: 10px; font-size: 13px; } .signer .dot { width: 22px; height: 22px; border-radius: 11px; border: 1px dashed var(--dim); flex: none; }
  .signer .dot.done { border: 0; background: var(--good-bg); }
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side" aria-label="Main"></nav>
  <div>
    <div class="top">
      <div class="ctl"><label for="runsel">Run</label><select id="runsel"></select><span id="runstate" class="chip"></span></div>
      <div class="ctl"><label for="analyst">Analyst</label><input id="analyst" size="12" placeholder="your name" autocomplete="off"></div>
    </div>
    <main class="content" id="content"></main>
  </div>
</div>
<script>
// ---------------------------------------------------------------- helpers
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k !== null && k !== undefined && k !== false) n.append(k instanceof Node ? k : String(k));
  return n;
}
// replaceChildren does not flatten lists and turns null into text: put() does both properly.
function put(node, ...kids) { node.replaceChildren(...kids.flat(Infinity).filter(k => k !== null && k !== undefined && k !== false)); return node; }
const chip = (t, k) => el("span", { class: "chip" + (k ? " " + k : "") }, t);
const pct = x => (x === null || x === undefined) ? "–" : Math.round(x * 100) + "%";
const inr = x => (x === null || x === undefined) ? "–" : "₹" + Number(x).toLocaleString("en-IN", { maximumFractionDigits: 0 });
const store = { get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json().catch(() => ({})) : await r.text();
  if (!r.ok) throw new Error((data && data.detail) || ("HTTP " + r.status));
  return data;
}
function go(page, params) { location.hash = "#/" + page + (params ? "?" + new URLSearchParams(params) : ""); }
function ref(text, page, params) { return el("a", { class: "ref", onclick: () => go(page, params) }, text); }
function caseLinks(ids, max) {
  max = max || 12; const out = [];
  (ids || []).slice(0, max).forEach((id, i) => { if (i) out.push(" "); out.push(ref(id, "complaints", { case: id })); });
  if ((ids || []).length > max) out.push(` … +${ids.length - max} more`);
  return out;
}
const VERDICT = { new_scam: "new scam", variant_of_known: "known scam, new form", lookalike_not_scam: "look-alike, not a scam", insufficient_evidence: "not enough evidence" };
const verdictChip = v => chip(VERDICT[v] || v || "–", v === "new_scam" ? "good" : v === "variant_of_known" ? "acc" : "");
const kindChip = (k, was) => k === "misnamed" ? chip("misnamed? RUKO said " + (was || "?"), "warn") : k === "new" ? chip("new pattern", "good") : chip(k || "–");
// Pages used to open with long explanations; the console is for analysts now, so they are not shown.
function explain() { return null; }
function evidenceList(ev) {
  if (!ev || !ev.length) return el("p", { class: "muted" }, "No evidence listed.");
  return el("ul", { class: "ev" }, ev.map(e => el("li", {},
    e.seen === false ? chip("source not found in its tool calls", "bad") : chip("checked", "good"), " ",
    el("span", { class: "mono" }, e.source), " — ", e.fact)));
}

// ---------------------------------------------------------------- state
const who = document.getElementById("analyst");
who.value = store.get("ruko.analyst"); who.addEventListener("input", () => store.set("ruko.analyst", who.value));
let demoTimer = null;
let runs = [], run = null, pollTimer = null, buildTimer = null, lastSeq = 0, timeline = [];
const cache = {};
async function data(kind) {
  if (!run) return null;
  const key = run + ":" + kind;
  if (!cache[key]) cache[key] = await api(`/api/runs/${run}/${kind}`);
  return cache[key];
}
async function loadRuns(select) {
  runs = await api("/api/runs");
  const sel = document.getElementById("runsel"); put(sel);
  if (!runs.length) sel.append(el("option", { value: "" }, "no runs yet"));
  for (const r of runs) sel.append(el("option", { value: r.run_id }, `${r.run_id} · ${r.state}${r.cases ? " · " + r.cases + " complaints" : ""}`));
  if (select) run = select; else if (!run || !runs.find(r => r.run_id === run)) run = runs.length ? runs[0].run_id : null;
  sel.value = run || "";
  const st = runs.find(r => r.run_id === run);
  const rs = document.getElementById("runstate");
  rs.textContent = st ? st.state + (st.agents ? " · agents: " + st.agents : "") : ""; rs.className = "chip" + (st && st.state === "done" ? " good" : st && st.state === "failed" ? " bad" : " warn");
}
document.getElementById("runsel").addEventListener("change", e => { run = e.target.value; lastSeq = 0; timeline = []; route(); loadRuns(run); });

// ---------------------------------------------------------------- sidebar
const ICONS = {
  grid: ["M3 3h7v9H3z", "M14 3h7v5h-7z", "M14 12h7v9h-7z", "M3 16h7v5H3z"],
  list: ["M4 5h16", "M4 12h16", "M4 19h10"],
  dots: ["M10 8a3 3 0 1 1-6 0a3 3 0 1 1 6 0", "M19 7a2 2 0 1 1-4 0a2 2 0 1 1 4 0", "M18.5 17a3.5 3.5 0 1 1-7 0a3.5 3.5 0 1 1 7 0"],
  check: ["M9 11l3 3 8-8", "M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"],
  doc: ["M5 4h11l3 3v13H5z", "M9 12h6", "M9 16h6"],
  pulse: ["M3 12h4l3-8 4 16 3-8h4"],
  shield: ["M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"],
};
function icon(name) {
  const s = svg("svg", { width: 16, height: 16, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": 1.8,
    "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" });
  for (const d of ICONS[name] || []) s.append(svg("path", { d }));
  return s;
}
const PAGES = [
  ["overview", "Overview", "grid"],
  ["complaints", "Complaints", "list"],
  ["hdbscan", "Patterns", "dots"],
  ["playbooks", "Review", "check"],
  ["database", "Playbooks", "doc"],
  ["demo", "Live check", "pulse"],
  ["redteam", "Red team", "shield"],
];
const DETAIL_PAGES = [["run", "Timeline"], ["generator", "Generator agent"], ["analyst", "Analyst agent"], ["scorecard", "Scorecard"]];
const sideCounts = {};
async function updateCounts() {
  try {
    const [cards, cl] = await Promise.all([api("/api/cards"), run ? data("clusters") : null]);
    sideCounts.review = cards.review.filter(s => s.gates_pass && (!run || s.run_id === run)).length;
    const sm = (cl && cl.summary) || {};
    sideCounts.complaints = sm.cases ?? null;
    sideCounts.hdbscan = sm.clusters ? sm.clusters.length : null;
    sideCounts.database = cards.approved.length || null;
  } catch (e) { /* counts are decoration */ }
}
function renderSide(page) {
  const s = document.getElementById("side");
  const r = runs.find(x => x.run_id === run) || {};
  const count = k => {
    const v = k === "playbooks" ? sideCounts.review : sideCounts[k];
    if (v === null || v === undefined) return null;
    return el("span", { class: "n" + (k === "playbooks" && v ? " hot" : "") }, String(v));
  };
  put(s,
    el("div", { class: "brand" }, el("div", { class: "logo", "aria-hidden": "true" }, "R"), el("div", {}, el("b", {}, "RUKO"), el("span", {}, "Analyst Console"))),
    PAGES.map(([k, t, ic]) => el("a", { href: "#/" + k, class: k === page ? "on" : "", "aria-current": k === page ? "page" : null }, icon(ic), t, count(k))),
    el("div", { class: "group" }, "This run"),
    DETAIL_PAGES.map(([k, t]) => el("a", { href: "#/" + k, class: "small" + (k === page ? " on" : ""), "aria-current": k === page ? "page" : null }, t)),
    el("div", { class: "foot" },
      el("span", {}, "Engine ", el("span", { class: "mono" }, "lgbm-0.2")),
      el("span", {}, "Agents ", el("span", { class: "mono" }, r.agents || "–"))));
}

// ---------------------------------------------------------------- router
async function route() {
  const [p, q] = (location.hash.replace(/^#\//, "") || "overview").split("?");
  const known = [...PAGES, ...DETAIL_PAGES].map(x => x[0]);
  const page = known.includes(p) ? p : "overview";
  const params = Object.fromEntries(new URLSearchParams(q || ""));
  renderSide(page);
  if (pollTimer && page !== "run") { clearInterval(pollTimer); pollTimer = null; }
  if (buildTimer && page !== "redteam") { clearInterval(buildTimer); buildTimer = null; }
  if (demoTimer && page !== "demo") { clearInterval(demoTimer); demoTimer = null; }
  const c = document.getElementById("content");
  put(c, el("div", { class: "empty" }, "Loading…"));
  try { put(c, ...await PAGE[page](params)); }
  catch (e) { put(c, el("div", { class: "msg err" }, e.message)); }
  window.scrollTo(0, 0);
  updateCounts().then(() => renderSide(page));
}
window.addEventListener("hashchange", route);

}

      if (users.value) body.users = Number(users.value); if (victims.value) body.victims = Number(victims.value);
      drawRunner(await api("/api/redteam/runner", body)); put(rMsg); poll();
    } catch (e) { put(rMsg, el("div", { class: "msg err" }, e.message)); }
  } }, "Run the red team");
  const stopRunner = el("button", { class: "danger", onclick: async () => { drawRunner(await api("/api/redteam/runner/stop", {})); } }, "Stop");

  // ---- step 2: the attack world from the breakthroughs
  const inputs = { users: el("input", { size: 6, value: df.users }), days: el("input", { size: 4, value: df.days }),
                   victim_rate: el("input", { size: 4, value: df.victim_rate }), red_boost: el("input", { size: 4, value: df.red_boost }) };
  const srcSel = el("select", {}, el("option", { value: "breakthroughs" }, "only the breakthroughs in the inbox"), el("option", { value: "all" }, "all 50 red-team playbooks"));
  const bState = el("div", { class: "row" }), bLog = el("pre", { style: "max-height:220px" }), bMsg = el("div");
  const drawBuild = s => {
    put(bState, chip(s.state, s.state === "done" ? "good" : s.state === "failed" ? "bad" : s.state === "running" ? "warn" : ""), s.step ? el("span", {}, " " + s.step) : null);
    bLog.textContent = (s.log || []).join("\n") || "no build yet";
  };
  drawBuild(d.build);
  const startBuild = el("button", { class: "primary", onclick: async () => {
    try {
      const body = { source: srcSel.value }; for (const [k, i] of Object.entries(inputs)) body[k] = Number(i.value);
      drawBuild(await api("/api/redteam/build", body)); put(bMsg); poll();
    } catch (e) { put(bMsg, el("div", { class: "msg err" }, e.message)); }
  } }, "Build the attack world");

  const poll = () => {
    if (buildTimer) clearInterval(buildTimer);
    buildTimer = setInterval(async () => {
      try {
        const [rs, bs] = await Promise.all([api("/api/redteam/runner"), api("/api/redteam/build")]);
        drawRunner(rs); drawBuild(bs);
        if (rs.state !== "running" && bs.state !== "running") { clearInterval(buildTimer); buildTimer = null; if (bs.state === "done") route(); }
      } catch (e) { /* server restarting */ }
    }, 2500);
  };
  if (r.state === "running" || d.build.state === "running") poll();

  // ---- the playbooks
  let open = p.pb || null;
  const table = el("table", {});
  const drawTable = () => {
    put(table, el("tr", {}, ["playbook", "what it pretends to be", "evasion tricks (read from its script)", "runner: called normal", "Nikunj's claim"].map(h => el("th", {}, h))),
      d.playbooks.map(pb => { const v = r.verdicts[pb.name]; return [el("tr", { class: "click", onclick: () => { open = open === pb.name ? null : pb.name; drawTable(); } },
        el("td", { class: "mono" }, pb.name), el("td", {}, pb.title), el("td", {}, el("span", { class: "chips" }, pb.techniques.map(x => chip(TECH_SHORT[x] || x)))),
        el("td", {}, v ? [pct(v.miss_rate), " ", v.breakthrough ? chip("breakthrough", "bad") : chip("caught", "good")] : "not run yet"),
        el("td", {}, pb.claimed_ml_missed === null ? "–" : pct(pb.claimed_ml_missed))),
        open === pb.name ? el("tr", {}, el("td", { colspan: 5 },
          el("div", { style: "font-size:12.5px;color:var(--muted)" }, `weight ${pb.weight} · mule slots ${(pb.mules || {}).slots ?? "default"} · mule kinds ${JSON.stringify(pb.mule_kinds || {})} · red_team/playbooks/${pb.file}`),
          el("ol", {}, pb.steps_detail.map(s => el("li", {}, el("b", {}, s.id), " — ", stepText(s)))))) : null]; }));
  };
  drawTable();

  return [el("h1", {}, "Red team"),
    explain(["Nikunj's ", el("b", {}, "red-team runner"), " (", el("span", { class: "mono" }, "synthetic_playbook/interface_script"), ") plays each scam playbook against the ", el("b", {}, "real RUKO engine"),
             " in its own small world and judges every reply: a threat score of 70 or less is RUKO calling the payment normal. If 75% of a playbook's scam payments come back normal, it is a ",
             el("b", {}, "breakthrough"), ", and his blue-team sink drops it into this team's inbox."],
      ["Then the blue team builds ", el("b", {}, "one attack world"), " where all the breakthroughs run at once (as in real life), replays it through RUKO, and works only from the victims' complaints: Complaints → HDBSCAN → agents → humans. The playbooks are data, never executed; the tricks below are read from each script."],
      [el("span", { class: "mono" }, "interface_script (judge.py, sinks.py) · blue_team/inbox.py · redteam.py")]),
    el("div", { class: "flow" }, ["Red-team playbooks", "Nikunj's runner vs RUKO", "Breakthroughs → inbox", "Attack world + replay", "Blue-team run", "Scorecard"]
      .flatMap((s, i) => i ? [el("span", { class: "a" }, "→"), el("span", { class: "s" }, s)] : [el("span", { class: "s" }, s)])),
    el("div", { class: "card" }, el("h2", {}, "1 · Run the red team (Nikunj's runner against the real engine)"),
      el("p", { style: "color:var(--muted);font-size:13px" }, "Each playbook takes about 4 minutes in its own 300-user world; several run at once. Playbooks already in the inbox are skipped unless you tick re-run, so you can stop and continue later."),
      el("div", { class: "row" }, setSel, "at a time", workers, "users", users, "victims", victims, el("label", {}, rerun, " re-run judged ones"), startRunner, stopRunner),
      rMsg, rState, rLog),
    el("div", { class: "card" }, el("h2", {}, "2 · The blue-team inbox"), inboxStats, verdictBox),
    el("div", { class: "card" }, el("h2", {}, "3 · Build the attack world"),
      w.built ? el("p", {}, chip("built", "good"), ` from ${w.meta.source === "all" ? "all" : (w.meta.red_team || []).length} red-team playbooks: ${w.meta.users} users × ${w.meta.days} days, ${w.journeys} scam journeys, ${w.red_journeys} by the red team (${w.red_types} playbooks), ${w.red_paid} victims paid, ${w.red_reported} reported. `,
                       w.replayed ? chip("replayed through RUKO", "good") : chip("not replayed yet", "warn"))
              : el("p", {}, chip("not built", "warn")),
      el("div", { class: "row" }, "attack with", srcSel, "users", inputs.users, "days", inputs.days, "victim rate", inputs.victim_rate, "red weight ×", inputs.red_boost, startBuild),
      bMsg, bState, bLog,
      w.replayed ? el("p", {}, "Next: ", ref("start a blue-team run on the red-team world", "run"), ", then the ", ref("Scorecard", "scorecard"), ".") : null),
    el("div", { class: "stats" }, Object.entries(d.techniques).map(([k, v]) => el("div", { class: "stat", title: v }, el("b", {}, techCount[k] || 0), el("span", {}, TECH_SHORT[k] + " — " + v)))),
    el("div", { class: "card scroll" }, el("h2", {}, "The red-team playbooks (click one for its script)"), table)];
};

// ---------------------------------------------------------------- scorecard
PAGE.scorecard = async () => {
  if (!run) return noRun();
  const st = runs.find(r => r.run_id === run) || {};
  let s;
  try { s = await api(`/api/runs/${run}/scorecard`); }
  catch (e) { return [el("h1", {}, "Scorecard"), el("div", { class: "msg err" }, e.message)]; }
  if (s.error) return [el("h1", {}, "Scorecard"), el("div", { class: "msg err" }, s.error)];
  const sm = s.summary, rows = s.rows.slice().sort((a, b) => (b.red_team - a.red_team) || (b.complaints - a.complaints));
  const outcome = r => r.blue_team === "drafted" ? chip("playbook drafted", "good") : r.blue_team === "grouped" ? chip("grouped, not majority", "acc")
    : r.blue_team === "complaints, no group" ? chip("one-off complaints", "warn") : chip("no complaint yet");
  const t = el("table", {}, el("tr", {}, ["playbook", "journeys", "scam payments", "RUKO interrupted (in the attack world)", "runner: called normal (alone)", "complaints (missed / unnamed / held)", "blue team", "drafted playbook · analyst verdict"].map(h => el("th", {}, h))),
    rows.map(r => el("tr", {},
      el("td", {}, el("span", { class: "mono" }, r.playbook), r.red_team ? null : el("div", { style: "font-size:12px;color:var(--muted)" }, "known to RUKO (baseline)")),
      el("td", {}, r.journeys), el("td", {}, r.scam_payments),
      el("td", {}, r.ruko_interrupted === null ? "–" : pct(r.ruko_interrupted), Object.keys(r.ruko_named).length ? el("div", { style: "font-size:12px;color:var(--muted)" }, "named: " + Object.entries(r.ruko_named).map(([k, v]) => `${k} ×${v}`).join(", ")) : null),
      el("td", {}, r.runner ? [pct(r.runner.miss_rate), " ", r.runner.breakthrough ? chip("breakthrough", "bad") : chip("caught", "good")]
                            : r.red_team && r.claimed !== null && r.claimed !== undefined ? `claim ${pct(r.claimed)}` : "–"),
      el("td", {}, r.complaints ? `${r.complaints} (${r.status.missed || 0} / ${r.status.unnamed || 0} / ${r.status.held || 0})` : "0"),
      el("td", {}, outcome(r), r.groups.length ? el("div", { style: "font-size:12px" }, r.groups.slice(0, 3).map((g, i) => [i ? ", " : "", ref(g.group, "hdbscan", { c: g.group }), ` (${g.complaints})`])) : null),
      el("td", {}, r.drafted.length ? r.drafted.map(dd => el("div", {}, ref(dd.playbook, "playbooks", { name: dd.playbook }), " · ", verdictChip(dd.verdict))) : "–"))));
  return [el("h1", {}, "Scorecard"),
    explain(["For every scam playbook in run ", el("span", { class: "mono" }, run), "'s world: how many of its scam payments RUKO interrupted, how many victims complained and where those complaints went, and whether the blue team drafted a playbook for a group it dominates."],
      ["This page is the only one that uses the simulator's ", el("b", {}, "answer key"), " (which journey ran which playbook), to grade the run. The pipeline itself never sees it (CLAUDE.md rule 9). A red-team playbook counts as caught when it is the majority of a group the agents drafted a playbook for."],
      [el("span", { class: "mono" }, "redteam.scorecard() · runs/<id>/payment_tiers.parquet")]),
    s.is_red_world ? el("div", { class: "stats" },
      el("div", { class: "stat" }, el("b", {}, `${sm.red_with_journeys}/${sm.red_playbooks}`), el("span", {}, "red-team playbooks that attacked")),
      el("div", { class: "stat" }, el("b", {}, pct(sm.red_ruko_interrupted)), el("span", {}, `of ${sm.red_scam_payments} red-team scam payments RUKO interrupted`)),
      el("div", { class: "stat" }, el("b", {}, sm.red_with_complaints), el("span", {}, "red-team playbooks with complaints")),
      el("div", { class: "stat" }, el("b", {}, sm.red_grouped), el("span", {}, "of them grouped by HDBSCAN")),
      el("div", { class: "stat" }, el("b", {}, sm.red_drafted), el("span", {}, "got a drafted playbook")),
      el("div", { class: "stat" }, el("b", {}, sm.red_drafted_new_scam), el("span", {}, "of those judged a new scam by the analyst")))
      : el("div", { class: "msg err" }, "This run's world is not the red-team world: rows are sim_v2's own scam types. Start a run on the red-team world for the red-team grades."),
    el("p", { style: "color:var(--muted);font-size:13px" }, `World: ${st.world || "?"}. Complaints arrive days after the scam, so short worlds leave many playbooks without enough complaints to group: that limit is the data's, not the blue team's.`),
    el("div", { class: "card scroll" }, t)];
};

// ---------------------------------------------------------------- go
(async () => {
  try { await loadRuns(); } catch (e) { /* the server is starting or stopped: the page says so below */ }
  route();
  setInterval(() => loadRuns(run).catch(() => {}), 10000);
})();
</script>
</body>
