<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUKO Analyst Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Red / Blue console (docs/design/red-blue-console/README.md): a light ground, a glass top bar, a
     navy band under it that the first cards overlap, glass cards, one orange accent. */
  :root {
    --ground: #eef1f5; --navy: #0f1620; --bar: rgba(15,22,32,0.88);
    --card: rgba(255,255,255,0.86); --card-solid: #ffffff; --sunk: #f5f7fa; --track: #e3e8ee;
    --line: rgba(15,23,42,0.08); --rowline: rgba(15,23,42,0.06);
    --ink: #0f141a; --ink2: #414d5c; --muted: #5f6b7a; --faint: #8a96a3; --on-navy: #9aa6b4;
    --accent: #ff9900; --accent-soft: rgba(255,153,0,0.10); --link: #0972d3;
    --bad: #d91515; --bad-ink: #b0120d; --bad-bg: #fdecea;
    --info: #0972d3; --info-ink: #0758a8; --info-bg: #e8f2fd;
    --new: #7a3fd0; --new-ink: #5b2ca0; --new-bg: #f1ebfb;
    --wait-ink: #7a5300; --wait-bg: #fff4d6; --good-ink: #036b0a; --good-bg: #e7f5e9; --plain-bg: #eef1f5;
    --shadow: 0 1px 2px rgba(15,23,42,0.04), 0 12px 32px rgba(15,23,42,0.06);
    --sans: Inter, system-ui, "Segoe UI", Roboto, sans-serif; --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--link); text-decoration: none; cursor: pointer; } a:hover { text-decoration: underline; }
  button, select, input, textarea { font: inherit; font-size: 13px; color: var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .muted { color: var(--muted); } .ink2 { color: var(--ink2); }

  /* top bar */
  header.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 28px; flex-wrap: wrap; padding: 0 28px; min-height: 56px;
    background: var(--bar); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); border-bottom: 1px solid rgba(255,255,255,0.08); }
  .brand { display: flex; align-items: center; gap: 10px; color: #fff !important; text-decoration: none !important; }
  .brand b { letter-spacing: .02em; } .brand span { color: var(--on-navy); font-size: 13px; }
  nav.tabs { display: flex; align-self: stretch; gap: 2px; flex-wrap: wrap; }
  nav.tabs a { display: flex; align-items: center; gap: 8px; padding: 0 14px; color: #c3ccd6; font-size: 14px; text-decoration: none; }
  nav.tabs a .n { font-size: 11px; color: var(--faint); }
  nav.tabs a.on { color: #fff; font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); } nav.tabs a.on .n { color: #ffb84d; }
  nav.tabs a .badge { background: var(--accent); color: var(--ink); border-radius: 999px; font-size: 11px; font-weight: 700; padding: 1px 7px; }
  .topacts { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; }
  .topacts select, .topbtn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); color: #e6ebf0; }
  .topacts select option { color: var(--ink); }
  .topbtn { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; }
  .topbtn.icon { width: 32px; justify-content: center; padding: 0; font-weight: 600; }

  /* navy band + content */
  .band { background: var(--navy); padding: 32px 32px 104px; }
  .band .in { max-width: 1376px; margin: 0 auto; display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .band .t { flex: 1 1 480px; min-width: 0; } .band .eyebrow { color: var(--on-navy); font-size: 13px; }
  .band h1 { margin: 6px 0 0; color: #fff; font-size: 30px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
  .band h1.mono { font-size: 26px; font-weight: 500; } .band p { margin: 8px 0 0; color: #c3ccd6; font-size: 15px; max-width: 80ch; }
  .band .crumb { color: var(--on-navy); font-size: 13px; margin-bottom: 4px; } .band .crumb a { color: #9cc8f5; }
  main.content { max-width: 1376px; margin: -76px auto 0; padding: 0 32px 56px; display: flex; flex-direction: column; gap: 20px; }
  @media (max-width: 760px) { .band, main.content, header.top { padding-left: 16px; padding-right: 16px; } }

  /* buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid rgba(15,23,42,0.16);
    background: #fff; color: var(--ink); font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none !important; }
  .btn:hover { background: var(--sunk); } .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--ink); font-weight: 600; } .btn.primary:hover { filter: brightness(1.04); }
  .btn.dark { background: var(--navy); border-color: var(--navy); color: #fff; } .btn.dark:hover { background: #1b2533; }
  .btn.big { height: 40px; padding: 0 18px; border-radius: 10px; font-size: 14px; }
  .band .btn.ghost { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.18); color: #fff; }
  .btn.danger { color: var(--bad-ink); }

  /* cards */
  .card { background: var(--card); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); min-width: 0; }
  .card.pad { padding: 20px 22px; } .card.flush { overflow: hidden; }
  .card > .hd { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .card > .hd h2, h2.h { margin: 0; font-size: 17px; font-weight: 600; } h3.h { margin: 0; font-size: 14px; font-weight: 600; }
  .hd .right { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; padding: 10px 20px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); align-items: center; }
  .sq { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .chip { font-size: 11.5px; font-weight: 600; white-space: nowrap; border-radius: 999px; padding: 3px 9px; background: var(--plain-bg); color: var(--ink2); display: inline-block; }
  .chip.bad { background: var(--bad-bg); color: var(--bad-ink); } .chip.info { background: var(--info-bg); color: var(--info-ink); }
  .chip.new { background: var(--new-bg); color: var(--new-ink); } .chip.wait { background: var(--wait-bg); color: var(--wait-ink); }
  .chip.good { background: var(--good-bg); color: var(--good-ink); }
  .tag { font-size: 11.5px; border-radius: 6px; padding: 2px 8px; background: #fff; border: 1px solid rgba(15,23,42,0.12); color: var(--ink2); white-space: nowrap; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg { display: flex; padding: 3px; border-radius: 10px; background: var(--plain-bg); flex-wrap: wrap; }
  .seg button { height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--ink2); cursor: pointer; }
  .seg button.on { background: #fff; box-shadow: 0 1px 2px rgba(15,23,42,0.1); color: var(--ink); font-weight: 600; }
  .field { display: flex; flex-direction: column; gap: 4px; } .field label { font-size: 12px; color: var(--muted); }
  .field input, .field select, .field textarea, input.in, select.in { height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid rgba(15,23,42,0.16); background: #fff; }
  .field textarea { height: auto; padding: 8px 10px; resize: vertical; }
  .field { min-width: 0; max-width: 100%; } .field select, select.in { max-width: 100%; text-overflow: ellipsis; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 1100px) { .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .grid4 { grid-template-columns: 1fr; } }
  .split { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; } .split > .main { flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
  .split > .side { flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .split > .list { flex: 1 1 320px; min-width: 0; }
  .bar { display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: var(--track); } .bar > span { display: block; height: 100%; }
  .bar.caught { background: var(--info); } .bar > .red { background: var(--bad); } .bar > .blue { background: var(--info); } .bar > .amber { background: #f0b429; } .bar > .ink { background: var(--navy); }
  .stat { padding: 12px; border-radius: 12px; background: var(--sunk); } .stat b { display: block; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; } .stat span { font-size: 12px; color: var(--muted); }
  table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.t th { text-align: left; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; padding: 10px 12px; }
  table.t td { padding: 11px 12px; border-top: 1px solid var(--rowline); vertical-align: top; }
  table.t th:first-child, table.t td:first-child { padding-left: 20px; } table.t th:last-child, table.t td:last-child { padding-right: 20px; }
  table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: rgba(238,241,245,0.6); }
  .scroll { overflow-x: auto; }
  .empty { color: var(--muted); padding: 28px; text-align: center; }
  .msg { padding: 10px 12px; border-radius: 10px; font-size: 13px; } .msg.ok { background: var(--good-bg); color: var(--good-ink); } .msg.err { background: var(--bad-bg); color: var(--bad-ink); }
  pre.code { background: var(--navy); color: #dfe6ee; border-radius: 10px; padding: 12px; font: 12px/1.5 var(--mono); overflow: auto; max-height: 420px; white-space: pre-wrap; word-break: break-word; margin: 8px 0 0; }
  details > summary { cursor: pointer; color: var(--link); font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; }

  /* loop strip */
  .step { display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; text-decoration: none !important; color: var(--ink);
    background: rgba(255,255,255,0.82); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--line); box-shadow: 0 12px 32px rgba(15,23,42,0.08); }
  .step.on { border-color: rgba(255,153,0,0.7); box-shadow: 0 0 0 3px rgba(255,153,0,0.18), 0 12px 32px rgba(15,23,42,0.08); }
  .step .dot { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--plain-bg); color: var(--ink2); }
  .step.on .dot { background: var(--accent); color: var(--ink); }
  .step .big { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; } .step .sub { font-size: 13px; color: var(--ink2); }

  /* group cards */
  .gcard { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 14px; text-decoration: none !important; color: var(--ink); background: rgba(255,255,255,0.9); border: 1px solid var(--line); }
  .gcard.new { background: rgba(246,241,253,0.92); border-color: rgba(122,63,208,0.28); }
  .gcard:hover { box-shadow: 0 6px 18px rgba(15,23,42,0.08); }
  .gcard .nm { flex: 1; font-weight: 600; font-size: 14.5px; line-height: 1.3; } .gcard .big { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; }
  .gcard .foot { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12.5px; flex-wrap: wrap; }

  /* lists */
  .li { display: flex; flex-direction: column; gap: 6px; padding: 12px 18px; border-bottom: 1px solid var(--rowline); cursor: pointer; }
  .li:hover { background: rgba(238,241,245,0.6); } .li.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .grow { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 20px; border: 0; border-bottom: 1px solid var(--line); background: transparent; cursor: pointer; text-align: left; }
  .grow:hover { background: rgba(238,241,245,0.5); }
  .mrow { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1.6fr) 150px 110px; align-items: center; gap: 14px; padding: 10px 20px 10px 48px; cursor: pointer; }
  .mrow:hover { background: rgba(255,255,255,0.7); } .mrow.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* trail */
  ol.trail { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  ol.trail li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; }
  ol.trail .rail { display: flex; flex-direction: column; align-items: center; }
  ol.trail .mk { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 999px; font-size: 12px; font-weight: 700; flex: none; background: var(--navy); color: #fff; }
  ol.trail .mk.now { background: rgba(255,153,0,0.16); color: #7a4a00; border: 1.5px solid var(--accent); }
  ol.trail .mk.fail { background: var(--bad-bg); color: var(--bad-ink); border: 1.5px solid var(--bad); }
  ol.trail .ln { flex: 1; width: 2px; background: #dfe4ea; margin: 4px 0; } ol.trail li:last-child .ln { background: transparent; }
  ol.trail .bd { display: flex; flex-direction: column; gap: 6px; padding-bottom: 20px; min-width: 0; }
  ol.trail .tt { font-weight: 600; font-size: 14.5px; } ol.trail .who { font-size: 12px; color: var(--muted); margin-left: 10px; font-weight: 400; }
  ol.trail .fact { font-size: 13.5px; color: var(--ink2); line-height: 1.5; }
  .pill { font-size: 12px; border-radius: 6px; padding: 3px 9px; background: #f2f4f7; color: var(--ink2); }
  blockquote { margin: 2px 0 0; padding: 10px 14px; border-radius: 10px; background: #f6f1fd; color: #3b2370; font-size: 13.5px; line-height: 1.5; }
  .fam { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 4px; border-radius: 6px; background: var(--navy); color: #fff; font-size: 11px; font-weight: 700; }
  .advice { padding: 14px 16px; border-radius: 12px; background: var(--sunk); } .advice .lang { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .advice.hi p { font-family: "Noto Sans Devanagari", var(--sans); line-height: 1.7; } .advice p { margin: 0; font-size: 14px; line-height: 1.55; }
  .av { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--navy); color: #fff; }
  .av.empty { background: #fff; color: var(--faint); border: 1.5px dashed #b6bfca; }
  .rule { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; } .rule .leaf { font: 12px var(--mono); background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
  .rule .or { font-size: 12px; color: var(--muted); } .rule .grp { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; border: 1px dashed rgba(15,23,42,0.18); border-radius: 8px; padding: 4px; }

  /* map */
  .viz { position: relative; } .viz svg { width: 100%; height: auto; display: block; background: var(--sunk); border-radius: 12px; border: 1px solid var(--rowline); }
  .viz .tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: var(--shadow); max-width: 300px; display: none; z-index: 2; }

  /* histogram */
  .hist { position: relative; display: flex; align-items: flex-end; gap: 3px; height: 72px; padding-bottom: 2px; border-bottom: 1px solid rgba(15,23,42,0.14); }
  .hist span { flex: 1; border-radius: 3px 3px 0 0; } .hist .line { position: absolute; top: 0; bottom: 0; border-left: 2px dashed var(--bad); flex: none; width: 0; }

  /* side panel (Live check, drawers) */
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(15,22,32,0.38); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .panel { position: fixed; z-index: 41; top: 16px; right: 16px; bottom: 16px; width: min(640px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 18px; padding: 24px; overflow-y: auto;
    border-radius: 20px; background: rgba(255,255,255,0.86); backdrop-filter: blur(28px) saturate(150%); -webkit-backdrop-filter: blur(28px) saturate(150%); border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 24px 64px rgba(15,22,32,0.35); }
  .panel .x { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: rgba(15,23,42,0.06); border: 0; cursor: pointer; flex: none; }
  .panel h1 { margin: 4px 0 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .cmp { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,0.75); border: 1px solid var(--rowline); }
  .cmp .track { position: relative; height: 8px; border-radius: 999px; background: var(--track); } .cmp .track span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; }
  .turn { border-left: 2px solid var(--track); padding: 4px 0 6px 12px; margin: 10px 0; } .turn .h { font-size: 12px; color: var(--muted); } .turn .thought { font-style: italic; color: var(--ink2); }
  ul.tl { list-style: none; margin: 0; padding: 0; } ul.tl li { display: grid; grid-template-columns: 40px 86px 1fr; gap: 10px; padding: 9px 4px; border-top: 1px solid var(--rowline); font-size: 13px; }
  ul.tl li.decision .body { color: var(--ink); font-weight: 500; } ul.tl li.error .stage { color: var(--bad-ink); } ul.tl .seq, ul.tl .stage { color: var(--muted); font-size: 12px; }
  ul.tl .refs { font-size: 12px; color: var(--muted); margin-top: 3px; font-weight: 400; }
  /* live loop */
  .feed { display: flex; flex-direction: column; gap: 10px; }
  .ev { display: grid; grid-template-columns: 6px minmax(0, 1fr); border-radius: 14px; overflow: hidden; background: rgba(255,255,255,0.92);
    border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(15,23,42,0.05); animation: rise .35s ease-out; }
  .ev > .rail { background: var(--track); } .ev.caught > .rail { background: var(--info); } .ev.missed > .rail { background: var(--bad); }
  .ev.warned > .rail { background: #f0b429; } .ev.alarm > .rail { background: var(--accent); } .ev.ok > .rail { background: #b6bfca; }
  .ev.blue > .rail { background: var(--new); } .ev.stage > .rail { background: var(--navy); } .ev.summary > .rail { background: var(--good-ink); }
  .ev > .bd { padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ev.blue { background: rgba(246,241,253,0.92); } .ev.stage { background: rgba(15,22,32,0.04); }
  .ev .meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .ev .money { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  .ev .cols2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  @media (max-width: 760px) { .ev .cols2 { grid-template-columns: 1fr; } }
  .ev .lbl { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 3px; }
  .tierchip { font-weight: 700; font-family: var(--mono); font-size: 12px; border-radius: 6px; padding: 2px 7px; background: var(--plain-bg); color: var(--ink2); }
  .tierchip.t2, .tierchip.t3, .tierchip.t4 { background: var(--info-bg); color: var(--info-ink); } .tierchip.t1 { background: var(--wait-bg); color: var(--wait-ink); }
  .progress-line { font-size: 12px; color: var(--muted); padding: 2px 6px; }
  @keyframes rise { from { transform: translateY(-8px); box-shadow: 0 0 0 3px rgba(255,153,0,0.35); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/overview" aria-label="RUKO Red / Blue console, Overview">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5.5v6c0 5 3.4 9.4 8 10.5 4.6-1.1 8-5.5 8-10.5v-6z" fill="none" stroke="#ff9900" stroke-width="2" stroke-linejoin="round"></path></svg>
    <b>RUKO</b><span>Red / Blue console</span>
  </a>
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
  <div class="topacts">
