name: fake_kyc_apk
title: "'Your KYC expires today' SMS with a link to an APK that takes over the phone"
confidence: guess
sources: ["data/sim/scams.py fake_kyc_apk", "RBI / bank advisories on KYC update fraud"]
weight: 0.14
targets: {senior: 2.0, homemaker: 1.5, shopkeeper: 1.2, salaried: 1.0, student: 0.6, gig_worker: 1.0}
start_hours: [9, 20]
steps:
  - id: kyc_sms
    stage: S1
    events: [{type: sms_lure, tag: kyc, conf: [0.7, 0.95], has_link: true}]
    decide: {pressure: 0.6}           # taps the link
  - id: install_apk
    stage: S3
    gap_min: [5, 60]
    events: [{type: sideload_apk}]
  - id: helper_call
    stage: S2
    p: 0.5
    gap_min: [5, 30]
    events: [{type: call, kind: {sim: 0.7, voip: 0.3}, direction: incoming, minutes: {log: [5, 25]}}]
  - id: drain
    gap_min: {log: [30, 360]}
    ask: {amount: {log: [10000, 150000]}, split: {int: [1, 3]}, entry: {typed: 1.0}, round: 0.3,
          pressure: 1.5, mule: same}       # the APK pushes it; the victim barely decides
