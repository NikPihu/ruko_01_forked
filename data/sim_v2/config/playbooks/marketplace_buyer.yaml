name: marketplace_buyer
title: "Fake buyer on OLX / Marketplace: small 'test' payment by QR, then a large one"
confidence: guess
emerging: true
sources: ["ml/PLAN.md §3.2", "police advisories on OLX / army-officer buyer scams"]
weight: 0.07
targets: {student: 1.5, salaried: 1.5, shopkeeper: 1.2, gig_worker: 1.2, homemaker: 1.0, senior: 0.5}
start_hours: [9, 22]
mule_kinds: {plain: 0.5, rented: 0.3, merchant_disguised: 0.2}
steps:
  - id: buyer_chat
    stage: S1
    events: [{type: notification_lure, tag: refund, conf: [0.4, 0.75]}]   # closest contract tag: 'refund'
    decide: {pressure: 0.5}
  - id: test_qr
    gap_min: {log: [10, 240]}
    events: [{type: call, kind: {voip: 0.7, sim: 0.3}, direction: incoming, minutes: {log: [5, 25]}}]
    ask: {during_call: true, amount: {int: [1, 10]}, entry: {qr: 1.0}, round: 0.0, pressure: 0.6, mule: same}
  - id: big_qr
    gap_min: [2, 10]
    ask: {during_call: true, amount: {log: [5000, 50000]}, repeat: {int: [1, 3]}, entry: {qr: 1.0}, round: 0.4,
          pressure: 0.8, mule: same}
